apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-database
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie

  storage:
    # local-path per the CNPG exception in CLAUDE.md: streaming replication, not
    # the volume, provides node-failure durability. This DB holds metadata only,
    # and local-path can't be expanded — growing it later means a rebuild.
    size: 10Gi
    storageClass: local-path

  # Free: local-path already pins each instance to its node permanently.
  affinity:
    podAntiAffinityType: required

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: nextcloud-database
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  name: app
  owner: app
  cluster:
    name: nextcloud-database
