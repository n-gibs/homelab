---
nfs_export_path: /mnt/storage
nfs_drive_uuid: "9701ed19-d894-496c-8594-1d671d789b8e"
nfs_allowed_clients: "192.168.30.0/24"
# Pod CIDR. Needed only for the longhorn-backups export: a pod on worker-01 talking to
# 192.168.30.194 addresses its own node, which Cilium does not masquerade, so the source
# stays a pod IP. Without this, worker-01 can't mount its own NFS export from a pod.
nfs_pod_cidr: "10.42.0.0/16"
nfs_backup_subdir: longhorn-backups
nfs_mount_options: "defaults,nofail,x-systemd.automount"
nfs_subdirs:
  - downloads
  - media
  - photos
  # Nextcloud file data. Created nobody:nogroup like its siblings; the app's init
  # container chowns it to 33:33 on every start.
  - nextcloud
  # Longhorn backup target. Exported separately below, no_root_squash — see tasks/main.yml.
  # Created nobody:nogroup like its siblings; harmless, since root (writing here via
  # no_root_squash) bypasses directory permission checks and can mkdir under it regardless
  # of who owns it. Longhorn's own backupstore/ subtree ends up root:root.
  - longhorn-backups
