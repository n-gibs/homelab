controllers:
  main:
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
    containers:
      app:
        # renovate: datasource=docker depName=lscr.io/linuxserver/prowlarr versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)\.(?<build>\d+)-ls(?<revision>\d+)$
        image:
          repository: lscr.io/linuxserver/prowlarr
          tag: 2.5.2.5491-ls157
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Los_Angeles
        envFrom:
          - secretRef:
              name: arr-api-key
        resources:
          requests:
            cpu: 50m
            memory: 384Mi
          limits:
            # Memory only. No cpu limit: VPA preserves the request:limit ratio, so a
            # shrinking request drags the limit down with it and throttles the container.
            memory: 768Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 9696

route:
  main:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Prowlarr"
      gethomepage.dev/description: "Indexer manager"
      gethomepage.dev/group: "Media"
      gethomepage.dev/icon: "prowlarr.png"
      gethomepage.dev/href: "https://prowlarr.nik-homelab.dev"
      gethomepage.dev/widget.type: "prowlarr"
      gethomepage.dev/widget.url: "http://prowlarr.prowlarr.svc.cluster.local:9696"
      gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}" }}'
    enabled: true
    kind: HTTPRoute
    hostnames:
      - prowlarr.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system
    # An interactive search fans out to every indexer and can run ~60s, well past
    # Envoy's 15s default request timeout; the resulting plain-text 504 reaches the
    # UI as "Unable to load results". backendRefs must be spelled out here -- once
    # rules are declared the chart no longer fills them in.
    rules:
      - backendRefs:
          - name: prowlarr
            port: 9696
        matches:
          - path:
              type: PathPrefix
              value: /
        timeouts:
          request: 120s

persistence:
  config:
    # longhorn, not local-path -- SQLite needs a real block device. See config-pvc.yaml
    # for the rationale, the durability trade, and the restore-from-backup recovery
    # path. Defined as its own manifest rather than inline so the comment lives
    # with the volume; the chart just consumes it.
    existingClaim: prowlarr-config
    globalMounts:
      - path: /config
  # Backups only. Prowlarr is not a media app and has no business seeing the
  # library, so this mounts the backups subdir rather than the whole share the
  # *arr apps get. Prowlarr creates its own prowlarr/ dir under here; the parent
  # is owned by uid 1000, which is what the container runs as.
  backups:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage/backups
    globalMounts:
      - path: /data/backups
