controllers:
  main:
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
    initContainers:
      fix-perms:
        # renovate: datasource=docker depName=busybox
        image:
          repository: busybox
          tag: 1.38.0
        command:
          - sh
          - -c
          - chmod -R 777 /data/downloads /data/media
        securityContext:
          runAsUser: 0
    containers:
      app:
        # renovate: datasource=docker depName=lscr.io/linuxserver/qbittorrent versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)_v[\d.]+-ls(?<build>\d+)$
        image:
          repository: lscr.io/linuxserver/qbittorrent
          tag: 5.2.3_v2.0.14-ls472
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Los_Angeles
          WEBUI_PORT: "8080"
        resources:
          requests:
            cpu: 200m
            memory: 2Gi
          limits:
            # Spelled out because limitrange.yaml defaults an unset memory limit to 512Mi,
            # which is below the request above -- the pod would fail admission outright.
            memory: 4Gi
          # No cpu limit: VPA preserves the request:limit ratio, so the 200m:2 declared
          # here became a 50m:500m pod -- a quarter of the intended ceiling.
      gluetun:
        # Deliberately unpinned, unlike every other image here: gluetun's `latest` is a rolling
        # build off master and its newest release tag lags it, so pinning would roll the VPN
        # container back rather than be a no-op. No renovate comment, so Renovate ignores it.
        image:
          repository: qmcgaw/gluetun
          tag: latest
        env:
          VPN_SERVICE_PROVIDER: mullvad
          VPN_TYPE: wireguard
          TZ: America/Los_Angeles
          FIREWALL_OUTBOUND_SUBNETS: "10.0.0.0/8,192.168.0.0/16"
          # 9999 is gluetun's health server, consumed by Cleanuparr's connectivity check.
          # The endpoint answers "is gluetun's health server up", not "is the tunnel up" --
          # measured 2026-08-14 returning 200 with an empty body throughout a confirmed outage.
          FIREWALL_INPUT_PORTS: "8080,6881,9999"
          SERVER_COUNTRIES: "USA"
          WIREGUARD_ALLOWED_IPS: "0.0.0.0/0"
          DNS_SERVER: "off"
          DNS_UPSTREAM_RESOLVER_TYPE: "plain"
          DNS_UPSTREAM_PLAIN_ADDRESSES: "10.43.0.10:53"
          WIREGUARD_MTU: "1170"
          WIREGUARD_IMPLEMENTATION: userspace
          # Defaults to 127.0.0.1:9999 -- loopback inside the pod's network namespace,
          # so nothing outside the pod can reach it. Bind to all interfaces instead.
          HEALTH_SERVER_ADDRESS: "0.0.0.0:9999"
        envFrom:
          - secretRef:
              name: gluetun-vpn-creds
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 256Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 8080
      # gluetun's health server, answering "is gluetun up" not "is the tunnel up" --
      # not routed publicly. Measured 2026-08-14: returned 200 unconditionally through an outage.
      health:
        port: 9999

route:
  main:
    enabled: true
    kind: HTTPRoute
    hostnames:
      - qbittorrent.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system
    # Pin the backend port. The chart only autodetects the *service*, not the port --
    # it takes whichever port sorts first, so adding the `health` port silently
    # repointed this route at 9999 and broke the WebUI. Explicit from now on.
    rules:
      - backendRefs:
          - identifier: main
            port: 8080

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: nfs
    size: 1Gi
    accessMode: ReadWriteMany
    advancedMounts:
      main:
        app:
          - path: /config
  data:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage
    advancedMounts:
      main:
        fix-perms:
          - path: /data
        app:
          - path: /data
