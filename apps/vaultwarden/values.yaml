controllers:
  main:
    # Single writer against rsa_key.pem and icon_cache/. Not strictly required now that
    # the database is Postgres and /data is RWX, but zero-downtime restarts are not a
    # goal and one pod is one less thing to reason about.
    replicas: 1
    # Not required any more now that the database is Postgres and /data is RWX, but a
    # single writer against rsa_key.pem and icon_cache/ is one less thing to reason
    # about, and zero-downtime restarts are not a goal here.
    strategy: Recreate
    containers:
      app:
        # renovate: datasource=docker depName=vaultwarden/server
        image:
          repository: vaultwarden/server
          tag: 1.37.1
        env:
          DOMAIN: "https://vault.nik-homelab.dev"
          WEBSOCKET_ENABLED: "true"
          # Multi-account: invite-only (no open registration).
          # Admin adds users via /admin panel (no SMTP = no email invites yet).
          SIGNUPS_ALLOWED: "false"
          INVITATIONS_ALLOWED: "true"
          INVITATION_ORG_NAME: "Homelab"
          # SMTP not configured — invites added manually via /admin, no email sent.
          # CloudNativePG generates this secret and its `uri` key is already in the shape
          # Vaultwarden wants, so there is nothing to commit and no rotation to wire up. That
          # is why this one credential does not come from Infisical like ADMIN_TOKEN does.
          DATABASE_URL:
            valueFrom:
              secretKeyRef:
                name: vaultwarden-database-app
                key: uri
          ADMIN_TOKEN:
            valueFrom:
              secretKeyRef:
                name: vaultwarden-admin-token
                key: token
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            # Memory only. No cpu limit: VPA preserves the request:limit ratio, so a
            # shrinking request drags the limit down with it and throttles the container.
            memory: 256Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 80

route:
  main:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Vaultwarden"
      gethomepage.dev/description: "Password manager"
      gethomepage.dev/group: "Infrastructure"
      gethomepage.dev/icon: "bitwarden.png"
      gethomepage.dev/href: "https://vault.nik-homelab.dev"
    enabled: true
    kind: HTTPRoute
    hostnames:
      - vault.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system

persistence:
  data:
    # nfs, not local-path: db.sqlite3 has moved into Postgres, so nothing here needs a
    # local filesystem any more, and RWX is what lets this pod schedule on any node.
    # See data-pvc-nfs.yaml for the rationale and the restore path.
    existingClaim: vaultwarden-data
    globalMounts:
      - path: /data
