server:
  ingress:
    enabled: false
  httproute:
    enabled: true
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system
    hostnames:
      - argocd.nik-homelab.dev

configs:
  params:
    server.insecure: true  # TLS terminated at gateway
  cm:
    users.anonymous.enabled: "true"
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_HTTPRoute: |
      jqPathExpressions:
        - .status
    resource.customizations.ignoreDifferences.gateway.networking.k8s.io_Gateway: |
      jqPathExpressions:
        - .status
  rbac:
    policy.default: "role:admin"
