apiVersion: v1
kind: LimitRange
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      # No default cpu limit on purpose: VPA would drag the ceiling down with the request.
      # See the LimitRange rule in CLAUDE.md.
      default:
        memory: 512Mi
