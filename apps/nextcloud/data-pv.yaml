apiVersion: v1
kind: PersistentVolume
metadata:
  name: nextcloud-data
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  nfs:
    server: 192.168.30.194
    path: /mnt/storage/nextcloud
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-data
  namespace: nextcloud
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  # TODO: /mnt/storage/nextcloud has no off-host backup. Documents here may be the
  # only copy. Covered by the planned /mnt/storage backup project, which also owns
  # photos/ and media/. Until then the desktop sync client is the second copy.
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: nextcloud-data
  resources:
    requests:
      storage: 500Gi
