---
- name: Render ClusterIssuer manifest
  ansible.builtin.template:
    src: cluster-issuer.yaml.j2
    dest: /tmp/cluster-issuer.yaml
    mode: "0600"
  become: true

- name: Apply ClusterIssuers
  ansible.builtin.command:
    cmd: kubectl apply -f /tmp/cluster-issuer.yaml
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  become: true
  changed_when: true

- name: Remove rendered manifest
  ansible.builtin.file:
    path: /tmp/cluster-issuer.yaml
    state: absent
  become: true
