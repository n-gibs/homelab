---
# Thresholds are relative to each sensor's OWN limit, not one literal: crit varies by tens of
# degrees across these boards, so one number would be deaf on some and hair-trigger on others.
# Sensors publishing no crit/limit drop out of the `on()` joins silently, so NVMe covers the
# Composite sensor only and node_hwmon_temp_max_celsius is unused — some report it as nonsense.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: temperature
  namespace: monitoring-system
  labels:
    release: monitoring-system
spec:
  groups:
    # Both rules precompute sensor_name because Homepage's dynamic-list display names each
    # row from a field in the data — indexing positionally would silently relabel every
    # reading if Prometheus ever returned the series in a different order.
    - name: temperature-recording
      rules:
        # Read by the Grafana dashboard's panel 1 only. NVMe deliberately absent: panel 1
        # gets it from a separate query, so including it here would double-count.
        - record: node:temperature_celsius:max
          expr: >-
            label_replace(
              max by (nodename) (
                node_hwmon_temp_celsius{chip="platform_coretemp_0"}
                  * on(instance) group_left(nodename) node_uname_info
              ),
              "sensor_name", "$1 CPU", "nodename", "(.*)"
            )
            or
            label_replace(
              max by (nodename) (
                node_smart_temperature_celsius
                  * on(instance) group_left(nodename) node_uname_info
              ),
              "sensor_name", "$1 HDD", "nodename", "(.*)"
            )

        # Read by the Homepage widget. Degrees of headroom, not raw temperature: one absolute
        # number means nothing on a glanceable list when a disk dies 40 degrees below a CPU.
        # Kept separate from :max, which panel 1 needs for absolute-over-time, and split per
        # sensor class so a hot disk cannot hide behind a cool CPU.
        - record: node:temperature_headroom_celsius:min
          expr: >-
            label_replace(
              min by (nodename) (
                (
                  node_hwmon_temp_crit_celsius
                    - node_hwmon_temp_celsius{chip="platform_coretemp_0"}
                ) * on(instance) group_left(nodename) node_uname_info
              ),
              "sensor_name", "$1 CPU", "nodename", "(.*)"
            )
            or
            label_replace(
              min by (nodename) (
                (
                  node_hwmon_temp_crit_celsius
                    - node_hwmon_temp_celsius{chip=~"nvme.*", sensor="temp1"}
                ) * on(instance) group_left(nodename) node_uname_info
              ),
              "sensor_name", "$1 NVMe", "nodename", "(.*)"
            )
            or
            label_replace(
              min by (nodename) (
                (
                  node_smart_temperature_limit_celsius
                    - on(instance, device) node_smart_temperature_celsius
                ) * on(instance) group_left(nodename) node_uname_info
              ),
              "sensor_name", "$1 HDD", "nodename", "(.*)"
            )

    - name: temperature-cpu-nvme
      rules:
        # thermal_zone chips excluded on purpose: they duplicate coretemp/PCH readings and one
        # acpitz reports a constant impossible value. The group_left onto node_uname_info only
        # buys a hostname in the notification; an instance missing it drops out of this alert,
        # but a down target has no temperature to report either and NodeDown covers that.
        - alert: NodeSensorTemperatureHigh
          expr: >-
            (
              node_hwmon_temp_celsius{chip!~"thermal_thermal_zone.*"}
                >= on(instance, chip, sensor)
              (node_hwmon_temp_crit_celsius - 12)
            ) * on(instance) group_left(nodename) node_uname_info
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.nodename }} sensor {{ $labels.chip }}/{{ $labels.sensor }} is
              {{ $value | printf "%.0f" }}C
            description: >-
              Sensor {{ $labels.chip }}/{{ $labels.sensor }} on {{ $labels.nodename }} has
              been within 12C of its critical threshold for 15m, currently
              {{ $value | printf "%.1f" }}C. Sustained rather than a load spike. Check
              airflow and dust around the chassis, and confirm thermald is still running —
              it is installed on every node but carries no Restart=, so a stray SIGTERM
              leaves it dead and silent.

        - alert: NodeSensorTemperatureCritical
          expr: >-
            (
              node_hwmon_temp_celsius{chip!~"thermal_thermal_zone.*"}
                >= on(instance, chip, sensor)
              (node_hwmon_temp_crit_celsius - 5)
            ) * on(instance) group_left(nodename) node_uname_info
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              {{ $labels.nodename }} sensor {{ $labels.chip }}/{{ $labels.sensor }} is
              {{ $value | printf "%.0f" }}C — near shutdown
            description: >-
              Sensor {{ $labels.chip }}/{{ $labels.sensor }} on {{ $labels.nodename }} is
              {{ $value | printf "%.1f" }}C, within 5C of the threshold at which the
              hardware throttles hard or cuts power. Expect the node to drop out of the
              cluster if this continues. All three nodes are etcd members, so losing a
              second one costs quorum.

    # TODO(NAS): this whole group exists for worker-01's 12TB USB drive, the cluster's only
    # spinning disk. When /mnt/storage moves to a NAS, delete the group along with the
    # smart-temp-textfile exporter in ansible/roles/common — the NAS watches its own disks,
    # and these rules would sit here matching no series.
    - name: temperature-disk
      rules:
        # Fed by smart-temp-textfile.timer on the host, not hwmon — USB drives get no hwmon
        # entry, so this is the only path to a temperature for worker-01's 12TB WD.
        - alert: DiskTemperatureAboveSpec
          expr: >-
            (
              node_smart_temperature_celsius
                >= on(instance, device)
              node_smart_temperature_limit_celsius
            ) * on(instance) group_left(nodename) node_uname_info
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.nodename }} disk {{ $labels.device }} is {{ $value | printf "%.0f" }}C,
              above its rated maximum
            description: >-
              {{ $labels.device }} ({{ $labels.model }}) on {{ $labels.nodename }} has run
              at or above its vendor-specified maximum operating temperature for 15m,
              currently {{ $value | printf "%.0f" }}C. Running a helium drive past spec
              shortens its life well before it fails outright, and this disk backs
              /mnt/storage — every NFS PVC and the whole media library. Improve airflow
              around the enclosure; there is no software fix.

        - alert: DiskTemperatureCritical
          expr: >-
            (
              node_smart_temperature_celsius
                >= on(instance, device)
              (node_smart_temperature_limit_celsius + 5)
            ) * on(instance) group_left(nodename) node_uname_info
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              {{ $labels.nodename }} disk {{ $labels.device }} is {{ $value | printf "%.0f" }}C
            description: >-
              {{ $labels.device }} ({{ $labels.model }}) on {{ $labels.nodename }} is
              {{ $value | printf "%.0f" }}C, more than 5C past its rated maximum. Move data
              off or power the enclosure down.

        # Without this the disk alerts above fail silent: if the timer stops, the series
        # disappears and both expressions go permanently empty. worker-01 owns the only
        # non-NVMe disk, so absent() is equivalent to "worker-01's feed is broken" without
        # hardcoding a node. 30m tolerates a reboot or an Ansible run.
        - alert: DiskTemperatureMetricsMissing
          expr: absent(node_smart_temperature_celsius)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: No SMART drive temperatures are being reported
            description: >-
              node_smart_temperature_celsius has been absent for 30m, so the disk
              temperature alerts cannot fire and worker-01's 12TB drive is unmonitored.
              Check smart-temp-textfile.timer on worker-01 and that node-exporter still
              has --collector.textfile.directory pointed at
              /host/root/var/lib/node_exporter/textfile_collector.

        # Wear, not heat. A udev rule in ansible/roles/common pins the USB drive's APM so its
        # heads stop parking; this alert exists because that rule keys on the bridge's
        # ID_VENDOR/ID_MODEL and can stop matching silently. The threshold sits clear of both
        # states, and the slow window tolerates the legitimate parks a reboot or re-plug causes.
        - alert: DiskHeadParkingResumed
          expr: >-
            (
              rate(node_smart_load_cycle_count[1h]) * 3600 > 10
            ) * on(instance) group_left(nodename) node_uname_info
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.nodename }} disk {{ $labels.device }} is parking its heads
              {{ $value | printf "%.0f" }} times an hour again
            description: >-
              {{ $labels.device }} on {{ $labels.nodename }} is back to loading and
              unloading its heads {{ $value | printf "%.0f" }} times an hour, which burns a
              600k-cycle rating in roughly 14 months. APM has reverted to a power-saving
              level. Confirm `smartctl --get=apm /dev/sda` reads 254, and that
              /etc/udev/rules.d/60-wd-elements-apm.rules still matches the drive —
              `udevadm info --query=property --name=/dev/sda | grep -E 'ID_VENDOR|ID_MODEL'`.
              A new USB bridge reports its own vendor/model strings, so re-enclosing the
              drive means the rule needs the new pair.
