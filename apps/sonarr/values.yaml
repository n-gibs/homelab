controllers:
  main:
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
    containers:
      app:
        # renovate: datasource=docker depName=ghcr.io/linuxserver/sonarr versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)\.(?<build>\d+)-ls(?<revision>\d+)$
        image:
          repository: lscr.io/linuxserver/sonarr
          tag: 4.0.19.2979-ls322
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Los_Angeles
        envFrom:
          - secretRef:
              name: arr-api-key
        resources:
          requests:
            cpu: 100m
            memory: 320Mi
          limits:
            # Memory only. No cpu limit: VPA preserves the request:limit ratio, so a
            # shrinking request drags the limit down with it and throttles the container.
            memory: 640Mi
      # A jammed import queue is invisible to every pod-level signal: the container stays
      # Ready and the health endpoint reports nothing. This exposes it as a metric instead.
      metrics:
        # renovate: datasource=docker depName=ghcr.io/onedr0p/exportarr
        image:
          repository: ghcr.io/onedr0p/exportarr
          tag: v2.3.0
        args:
          - sonarr
        env:
          PORT: "9707"
          URL: http://localhost:8989
          # envFrom can't be reused here -- exportarr wants API_KEY, and the secret
          # holds it under the name Sonarr itself reads.
          API_KEY:
            valueFrom:
              secretKeyRef:
                name: arr-api-key
                key: SONARR__AUTH__APIKEY
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 8989
      metrics:
        port: 9707

route:
  main:
    enabled: true
    kind: HTTPRoute
    hostnames:
      - sonarr.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system
    # An interactive search fans out to every indexer and can run ~60s, well past
    # Envoy's 15s default request timeout; the resulting plain-text 504 reaches the
    # UI as "Unable to load results". backendRefs must be spelled out here -- once
    # rules are declared the chart no longer fills them in.
    rules:
      - backendRefs:
          - name: sonarr
            port: 8989
        matches:
          - path:
              type: PathPrefix
              value: /
        timeouts:
          request: 120s

persistence:
  config:
    # longhorn, not local-path -- SQLite needs a real block device. See config-pvc.yaml
    # for the rationale, the durability trade, and the restore-from-backup recovery
    # path. Defined as its own manifest rather than inline so the comment lives
    # with the volume; the chart just consumes it.
    existingClaim: sonarr-config
    globalMounts:
      - path: /config
  data:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage
    globalMounts:
      - path: /data
