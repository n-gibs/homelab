apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: infisical-operator
  namespace: infisical-operator
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    # Chart truncates fullname to 15 chars (trunc 15 in _helpers.tpl), so this
    # is not "secrets-operator-controller-manager" as the chart name suggests.
    name: infisical-opera-controller-manager
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: 10m
          memory: 64Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
