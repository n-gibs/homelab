---
# Scheduled after the database dumps and the apps' own backups, so each Longhorn backup captures
# fresh archives from inside the volumes. No separate snapshot schedule: a `backup` job snapshots
# on its way, and snapshots live on the volume's own replicas — the one form of protection a node
# failure takes with it. These are crash-consistent, so the apps' own backups still stand.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "30 4 * * *"
  task: backup
  groups:
    - default
  retain: 7
  concurrency: 1
