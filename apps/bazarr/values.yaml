controllers:
  main:
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
    containers:
      app:
        # renovate: datasource=docker depName=lscr.io/linuxserver/bazarr versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-ls(?<build>\d+)$
        image:
          repository: lscr.io/linuxserver/bazarr
          tag: v1.6.0-ls357
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Los_Angeles

service:
  main:
    controller: main
    ports:
      http:
        port: 6767

route:
  main:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Bazarr"
      gethomepage.dev/description: "Subtitles"
      gethomepage.dev/group: "Media"
      gethomepage.dev/icon: "bazarr.png"
      gethomepage.dev/href: "https://bazarr.nik-homelab.dev"
    enabled: true
    kind: HTTPRoute
    hostnames:
      - bazarr.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: nfs
    size: 2Gi
    accessMode: ReadWriteMany
    globalMounts:
      - path: /config
  data:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage
    globalMounts:
      - path: /data
