---
- name: Add root subuid mapping for containerd user namespaces
  ansible.builtin.lineinfile:
    path: /etc/subuid
    line: "root:165536:65536"
    create: true
    mode: "0644"
  become: true

- name: Add root subgid mapping for containerd user namespaces
  ansible.builtin.lineinfile:
    path: /etc/subgid
    line: "root:165536:65536"
    create: true
    mode: "0644"
  become: true

- name: Create containerd override config directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d
    state: directory
    mode: "0755"
  become: true

# The native snapshotter was a workaround for an early Ubuntu 26.04 / kernel 7.x
# problem. containerd now reports the overlayfs plugin as healthy on these nodes,
# and native is expensive: it has no union mount, so each layer's snapshot is a
# full copy of its parent. Measured on worker-02 with the same 798MB image:
# 8m23s to unpack on native vs 26s on overlayfs, and 80G vs 2.2G of snapshotter
# store. Removing the override lets k3s use its overlayfs default.
# `state: absent` (rather than deleting this task) so already-provisioned nodes
# are cleaned up too. Takes effect on the next k3s restart.
- name: Remove the containerd native-snapshotter override
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d/snapshotter.toml
    state: absent
  become: true

- name: Create k3s systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    mode: "0755"
  become: true

# Cilium writes /etc/cni/net.d/05-cilium.conflist once, when its agent first becomes
# ready, and that file then persists on disk forever. containerd carries no
# cni.conf_dir override, so it watches the /etc/cni/net.d default, finds the conflist
# at boot and reports the network plugin ready — kubelet marks the node Ready within
# seconds. But /var/run is a fresh tmpfs, so /var/run/cilium/cilium.sock does not exist
# yet. kubelet starts every previously-bound pod at once, cilium-cni waits for the
# socket with a *hard 30s ceiling*, and the losers fail:
#   CNI ADD failed ... failed to create cilium agent client after 30.000000 seconds timeout
# Measured on worker-00: 12 pods on the 2026-07-11 boot (coredns among them, which is
# how it presents as a per-node DNS outage) and 13 more on the 2026-07-29 k3s restart.
# The node reports Ready the whole time, so the scheduler keeps feeding it work.
#
# Dropping the stale conflist before k3s starts makes the node honestly NotReady until
# the agent rewrites it — the write-cni-conf-when-ready gate Cilium already implements.
# Note the kubelet --register-with-taints=node.cilium.io/agent-not-ready approach does
# NOT fix this: taints are applied only at first Node registration and are never
# re-applied on reboot or kubelet restart.
#
# Guarded on the socket so `systemctl restart k3s` against a healthy agent is a no-op:
# KillMode=process leaves running containers (the agent included) alive across a k3s
# restart, and the agent only writes the conflist during its own startup.
#
# That guard is also what permits the split-brain described below, and it is kept anyway —
# deliberately. Reaping the agent here was tried (84ca78e) and reverted: it only ever fires
# on a k3s restart, which is also the only time it could help, so it trades a rare silent
# failure for a routine one. Worst case is the containerd wedge, where `systemctl restart
# k3s` is the documented remediation and killing the agent risks the replacement container
# failing to start, leaving the node with no Cilium at all. The invariant belongs in the new
# agent's own startup, not in k3s's. Detection lives in the CiliumAgentDuplicate alert
# (system/monitoring/), which fires on the fingerprint below.
#
# The split-brain: KillMode=process means `systemctl stop k3s` leaves the containerd-shims
# running, so the cilium-agent process outlives k3s. systemd says so itself —
#   k3s.service: Unit process 1836 (containerd-shim) remains running after unit stopped.
# Normally k3s reattaches to that shim on restart and nothing is duplicated. But when it
# instead builds a *new* agent container — an image, pod-spec or snapshotter change across
# the restart — the old process is still alive and you get two cilium-agents on one node.
# Observed on worker-00 2026-07-29: k3s stopped 01:57:43 mid-snapshotter-migration, the new
# agent came up 01:58:57 and could not bind either of its ports, because the old one held
# them:
#   Failed to launch hubble ... listen tcp :4244: bind: address already in use
#   Failed to serve cilium-health API ... listen tcp 192.168.30.129:4240: bind: address already in use
# Both agents then wrote the same shared BPF LB maps from independent in-memory backend-ID
# allocators, so each deleted backends the other had just written and every service whose
# backend pod appeared after the split pointed at a backend ID that no longer existed:
#   cilium-dbg bpf lb list | grep 'not found'   ->  "backend 235 not found"  (23 frontends)
# It hides completely: each agent's own userspace `service list` is self-consistent, the
# node is Ready, `status --brief` is OK, and neither agent logs anything about LB. Only the
# BPF map disagrees. CoreDNS was recreated 62s into the split, so it presented as a
# cluster-wide DNS outage (27 ArgoCD apps Unknown, cert-manager Degraded).
- name: Gate k3s startup on a live Cilium CNI socket
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/cilium-cni-gate.conf
    content: |
      [Service]
      ExecStartPre=/bin/sh -c '[ -S /var/run/cilium/cilium.sock ] || rm -f /etc/cni/net.d/05-cilium.conflist'
    mode: "0644"
  become: true
  notify: Reload systemd

# k3s.service already declares Wants=/After=network-online.target, but that target is
# reached vacuously on these nodes: systemd-networkd-wait-online.service is enabled and
# wanted by the target, yet it is skipped every boot on an unmet
#   ConditionPathIsSymbolicLink=/run/systemd/generator/network-online.target.wants/systemd-networkd-wait-online.service
# and that generator directory does not exist on any of the three nodes. So nothing
# actually waits for DHCP, and k3s starts before there is a default route:
#   level=fatal msg="Error: no default routes found in \"/proc/net/route\" ..."
# Observed on the 2026-07-30 worker-02 reboot: 3 failed starts over 11s before the
# route appeared. Restart=always eventually wins, so it self-heals on a normal reboot —
# but during a cluster move the switch/firewall boots alongside the nodes, the window is
# much longer, and all three nodes flap k3s (and their etcd members) until it closes.
#
# Clearing the condition lets the unit run, which is all network-online.target needs to
# mean something; k3s's existing After= then does its job with no k3s-specific hack.
# Measured cost when the network is already up: 7ms. If DHCP never completes the unit
# fails after its own 120s timeout and k3s still starts, because k3s uses Wants= (not
# Requires=) — worst case degrades to today's behaviour rather than blocking the boot.
- name: Create systemd-networkd-wait-online override directory
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-networkd-wait-online.service.d
    state: directory
    mode: "0755"
  become: true

- name: Make network-online.target actually wait for the network
  ansible.builtin.copy:
    dest: /etc/systemd/system/systemd-networkd-wait-online.service.d/always-run.conf
    content: |
      [Unit]
      ConditionPathIsSymbolicLink=
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - htop
      - vim
      - unattended-upgrades
      - ufw
      - fail2ban
      - open-iscsi
      - nfs-common
      - chrony
      - lm-sensors
      - smartmontools
      - thermald
    state: present
  become: true

# chrony is the only time source on these nodes — systemd-timesyncd is not installed.
# On 2026-07-29 a mass `kill -TERM` sweep on worker-00 (hunting an orphaned process
# holding :9100 during the containerd snapshotter migration) SIGTERM'd chrony, thermald
# and fail2ban as collateral. None of the three carries Restart=, so all three stayed
# dead silently; the clock then drifted unmonitored for 38h. Reconcile them here.
- name: Create chrony systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/chrony.service.d
    state: directory
    mode: "0755"
  become: true

# A stray SIGTERM is a *clean* exit (status=0/SUCCESS), so Restart=on-failure would not
# have covered it. An explicit `systemctl stop chrony` still wins — systemd never restarts
# a unit that was deliberately stopped.
# ponytail: chrony only. Clock skew on an etcd control-plane node is the one that hurts;
# add the same override for thermald/fail2ban if either ever goes missing again.
- name: Make chrony survive an unexpected termination
  ansible.builtin.copy:
    dest: /etc/systemd/system/chrony.service.d/override.conf
    content: |
      [Service]
      Restart=always
      RestartSec=5s
    mode: "0644"
  become: true

- name: Enable and start node services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - chrony
    - thermald
    - fail2ban
  become: true

# CPU and NVMe temperatures already reach Prometheus for free: node-exporter's hwmon
# collector reads /sys and publishes node_hwmon_temp_celsius alongside each chip's own
# node_hwmon_temp_crit_celsius, which is what the alerts thresholds off.
#
# USB-attached drives have no hwmon entry — the kernel's `drivetemp` module binds to SATA
# hosts, not usb-storage — so worker-01's 12TB WD (the cluster's only spinning disk, and
# the hottest sensor in it at 61C against a 65C spec max) is invisible to that path. This
# feeds it in through node-exporter's textfile collector instead of adding a second
# exporter. Emits nothing at all on nodes with no SMART-readable non-NVMe disk.
#
# TODO(NAS): this exporter, its two systemd units, and the disk half of
# system/monitoring-system/prometheusrule-temperature.yaml all exist for that one USB
# drive. Once /mnt/storage moves to a NAS the nodes have only NVMe left, hwmon covers it,
# and this whole block goes silent — delete it rather than leaving it emitting nothing.
- name: Create node-exporter textfile collector directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    mode: "0755"
  become: true

# Writes to a temp file and renames: the collector reads this directory on every scrape
# and a half-written .prom makes it fail the whole scrape, not just this metric.
# Every metric is omitted per-disk when unreadable rather than emitted as 0 — a missing
# series makes the alert expression empty, where a 0 would read as a stone-cold drive.
- name: Install SMART drive temperature textfile exporter
  ansible.builtin.copy:
    dest: /usr/local/bin/smart-temp-textfile
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Managed by Ansible (roles/common). Publishes SMART drive temperatures for
      # node-exporter's textfile collector.
      set -euo pipefail

      out=/var/lib/node_exporter/textfile_collector/smart_temp.prom
      tmp="$(mktemp "${out}.XXXXXX")"
      trap 'rm -f "$tmp"' EXIT

      {
        echo '# HELP node_smart_temperature_celsius Drive temperature reported by SMART.'
        echo '# TYPE node_smart_temperature_celsius gauge'
        echo '# HELP node_smart_temperature_limit_celsius Vendor specified maximum operating temperature.'
        echo '# TYPE node_smart_temperature_limit_celsius gauge'
        echo '# HELP node_smart_load_cycle_count Lifetime head load/unload cycles (SMART 193).'
        echo '# TYPE node_smart_load_cycle_count counter'
      } >"$tmp"

      # NVMe is deliberately excluded: hwmon already covers it, and two sources for one
      # device would mean two alerts for one hot disk.
      while read -r name type; do
        [[ "$type" == "disk" ]] || continue
        [[ "$name" == nvme* ]] && continue
        dev="/dev/$name"

        # Every smartctl call needs `|| true`. Its exit status is a bitmask, and it sets
        # bits for conditions that are not failures for our purpose: worker-01's WD
        # returns non-zero on every invocation because the enclosure presents an invalid
        # checksum in the SMART threshold structure, while still reporting a perfectly
        # good temperature. Without this, pipefail plus set -e aborts the script after
        # reading the value but before writing the file.
        attrs="$(smartctl -A "$dev" 2>/dev/null || true)"
        # Field 10 of attribute 194 is the raw value. Falls back to the SCSI-style
        # "Current Drive Temperature" line for drives that report no ATA attributes.
        temp="$(awk '$1 == 194 { print $10; exit }' <<<"$attrs")"
        if [[ -z "$temp" ]]; then
          temp="$(awk '/Current Drive Temperature/ { print $4; exit }' <<<"$attrs")"
        fi
        [[ "$temp" =~ ^[0-9]+$ ]] || continue

        model="$(smartctl -i "$dev" 2>/dev/null \
          | awk -F': +' '/^Device Model|^Product/ { print $2; exit }' || true)"
        printf 'node_smart_temperature_celsius{device="%s",model="%s"} %s\n' \
          "$name" "${model:-unknown}" "$temp" >>"$tmp"

        # Head parking is a wear budget, not a temperature: worker-01's WD burns ~50
        # load cycles an hour while essentially idle, which straight-lines through a
        # 600k rating in about 14 months. Only a rate over time says whether a fix
        # worked, so it rides along on the SMART read already happening here.
        cycles="$(awk '$1 == 193 { print $10; exit }' <<<"$attrs")"
        if [[ "$cycles" =~ ^[0-9]+$ ]]; then
          printf 'node_smart_load_cycle_count{device="%s"} %s\n' "$name" "$cycles" >>"$tmp"
        fi

        limit="$(smartctl -l devstat "$dev" 2>/dev/null \
          | awk '/Specified Maximum Operating Temperature/ { print $4; exit }' || true)"
        if [[ "$limit" =~ ^[0-9]+$ ]]; then
          printf 'node_smart_temperature_limit_celsius{device="%s"} %s\n' \
            "$name" "$limit" >>"$tmp"
        fi
      done < <(lsblk --nodeps --noheadings --output NAME,TYPE)

      chmod 0644 "$tmp"
      mv "$tmp" "$out"
      trap - EXIT
  become: true

- name: Install SMART temperature exporter systemd units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: smart-temp-textfile.service
      content: |
        [Unit]
        Description=Publish SMART drive temperatures for node-exporter
        After=local-fs.target

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/smart-temp-textfile
    # 2min, not 30s. Polling SMART holds a drive awake, and temperature is a slow signal —
    # the alerts below need 15m sustained to fire, so a 2min gauge age costs nothing.
    - name: smart-temp-textfile.timer
      content: |
        [Unit]
        Description=Publish SMART drive temperatures every 2 minutes

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=2min
        AccuracySec=10s

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  become: true
  notify: Reload systemd

- name: Enable and start SMART temperature exporter timer
  ansible.builtin.systemd_service:
    name: smart-temp-textfile.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true

# TODO(NAS): delete this task and the rule it installs once /mnt/storage moves off the
# USB drive. It is pinned to one serial and is dead weight the moment that drive leaves.
#
# worker-01's 12TB WD shipped at APM 128 ("minimum power consumption without standby"),
# which parks the heads roughly 50 times an hour on a drive that is 0.02% busy — about 9%
# of a 600k load-cycle rating burned in five weeks. APM 254 stops the parking outright,
# measured at zero cycles over the following hour with no temperature penalty.
#
# APM is volatile: it resets to the drive default whenever the drive loses power, which on
# a USB enclosure includes bus re-enumeration with the node still up. A boot-time unit
# would miss that, so this hangs off the udev add/change event instead.
#
# smartctl, not idle3ctl or hdparm: WD120EDGZ is an Ultrastar He12 white-label, an HGST
# platform with no idle3 timer, so unload is APM and APM alone. APM is a standard ATA
# feature reachable over SAT with smartmontools, already installed above — no vendor
# commands aimed at the disk backing every NFS PVC in the cluster.
- name: Stop the 12TB USB drive parking its heads every minute
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/60-wd-elements-apm.rules
    mode: "0644"
    content: |
      # Managed by Ansible (roles/common). See the task that installs this file.
      ACTION=="add|change", SUBSYSTEM=="block", KERNEL=="sd[a-z]", \
        ENV{ID_SERIAL_SHORT}=="WD-B002KX5D", \
        RUN+="/usr/sbin/smartctl --set=apm,254 /dev/%k"
  become: true
  notify: Reload udev rules

# The kernel default fs.inotify.max_user_instances=128 is charged per-UID, and every
# containerd-shim holds 2 inotify fds — one shim per running pod. worker-00 hit 129/128
# with 37 pods (72 shim fds + 44 from k3s-server + ~11 from systemd/tailscaled/agetty),
# after which even PID 1 logged "Failed to allocate inotify fd: Too many open files" and
# path units could not enter their waiting state.
# Audited before raising it (.claude/scripts/inotify-audit.py): not a leak — zero holders
# had an idle instance, and worker-02's 35x-older k3s-server held *fewer* fds. The only
# growth term is pod count, which kubelet caps at 110/node, so 1024 is real headroom at
# the measured ~2.2 fds/pod.
# max_user_watches is not currently near its limit (288 used of 123584); raised for symmetry.
- name: Raise inotify limits for Kubernetes pod density
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-inotify.conf
    sysctl_set: true
    reload: true
    state: present
  loop:
    - { name: fs.inotify.max_user_instances, value: "1024" }
    - { name: fs.inotify.max_user_watches, value: "524288" }
  become: true

- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: "0644"
  become: true

- name: Enable unattended-upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    enabled: true
    state: started
  become: true

- name: Harden SSH - disable password auth
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present
  become: true
  notify: Restart sshd

- name: Harden SSH - disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    state: present
  become: true
  notify: Restart sshd

- name: Configure UFW defaults
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
  become: true

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  become: true

- name: Allow k3s API server
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
  become: true

- name: Allow kubelet metrics
  community.general.ufw:
    rule: allow
    port: "10250"
    proto: tcp
  become: true

- name: Allow Cilium VXLAN
  community.general.ufw:
    rule: allow
    port: "8472"
    proto: udp
  become: true

- name: Allow node-exporter metrics from pod network
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: 10.42.0.0/16
  become: true

- name: Allow node-exporter metrics from cluster node subnet
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: 192.168.30.0/24
  become: true

- name: Enable UFW
  community.general.ufw:
    state: enabled
  become: true

# The Ubuntu installer allocates only part of the volume group to the root LV.
# Container images are the dominant consumer on these nodes, so claim the whole
# VG. (This was originally written when the native snapshotter was in use and
# stored a full copy of every layer; that override has since been removed above,
# but the headroom is still worth having.)
- name: Check for unallocated space in the root volume group
  ansible.builtin.command: vgs --noheadings --nosuffix --units b -o vg_free ubuntu-vg
  register: root_vg_free
  changed_when: false
  failed_when: false
  check_mode: false        # read-only; must run under --check for the guard below to evaluate
  become: true

- name: Extend root logical volume to use all free volume group space
  community.general.lvol:
    vg: ubuntu-vg
    lv: ubuntu-lv
    size: +100%FREE
    resizefs: true
  become: true
  when:
    - root_vg_free.rc == 0
    - (root_vg_free.stdout | trim | int) > 1073741824
