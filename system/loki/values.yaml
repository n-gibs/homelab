deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  pattern_ingester:
    enabled: true

  # Enables the ruler so log-only conditions can alert — see rule-cilium-split-brain.yaml.
  #
  # storage.type must be local to read rule files off disk, and the local store expects
  # <directory>/<tenant>, where the tenant is literally `fake` because auth_enabled is
  # false. /rules is where the chart's loki-sc-rules sidecar already writes, so point the
  # ruler there rather than the default /var/loki/rules.
  # alertmanager_url reuses the kube-prometheus-stack Alertmanager, so these alerts inherit
  # the existing ntfy routing and inhibitions. enable_alertmanager_v2 already defaults true.
  rulerConfig:
    wal:
      dir: /var/loki/ruler-wal
    storage:
      type: local
      local:
        directory: /rules
    alertmanager_url: http://monitoring-system-kube-pro-alertmanager.monitoring-system.svc.cluster.local:9093

# The rules sidecar runs by default and already mounts /rules into the loki container, but it
# writes every ConfigMap flat into FOLDER, which the ruler cannot read (it needs the tenant
# subdirectory above). folderAnnotation lets a ConfigMap name its own target directory; the
# annotation key below is the kiwigrid/k8s-sidecar default.
sidecar:
  rules:
    folderAnnotation: k8s-sidecar-target-directory

singleBinary:
  replicas: 1
  persistence:
    storageClass: nfs
    accessModes:
      - ReadWriteOnce
    size: 20Gi
  resources:
    requests:
      cpu: 100m
    limits:
      cpu: "1"

gateway:
  enabled: false
minio:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Zero out replica counts for the other deployment modes (Distributed/SimpleScalable) —
# the chart renders their workload templates whenever `replicas` is unset, even though
# deploymentMode: Monolithic doesn't use them.
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomPlanner: { replicas: 0 }
bloomBuilder: { replicas: 0 }
bloomGateway: { replicas: 0 }
