controllers:
  main:
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
    containers:
      app:
        # renovate: datasource=docker depName=lscr.io/linuxserver/lidarr versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)\.(?<build>\d+)-ls(?<revision>\d+)$
        image:
          repository: lscr.io/linuxserver/lidarr
          tag: 3.1.0.4875-ls38
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Los_Angeles
        envFrom:
          - secretRef:
              name: arr-api-key
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            # Memory only. No cpu limit: VPA preserves the request:limit ratio, so a
            # shrinking request drags the limit down with it and throttles the container.
            memory: 768Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 8686

route:
  main:
    enabled: true
    kind: HTTPRoute
    hostnames:
      - lidarr.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system
    # An interactive search fans out to every indexer and can run ~60s, well past
    # Envoy's 15s default request timeout; the resulting plain-text 504 reaches the
    # UI as "Unable to load results". backendRefs must be spelled out here -- once
    # rules are declared the chart no longer fills them in.
    rules:
      - backendRefs:
          - name: lidarr
            port: 8686
        matches:
          - path:
              type: PathPrefix
              value: /
        timeouts:
          request: 120s

persistence:
  config:
    # longhorn, not local-path -- /config is SQLite and needs a real block device, and this
    # volume is replicated so the pod isn't pinned to one node. Lidarr's own scheduled backup is
    # the application-consistent copy that supplies durability; see config-pvc.yaml.
    existingClaim: lidarr-config
    globalMounts:
      - path: /config
  data:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage
    globalMounts:
      - path: /data
