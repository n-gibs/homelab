# Why it lives here and what the eligible-vs-resized panel tells you:
# see system/vpa/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-vpa
  namespace: vpa
  labels:
    grafana_dashboard: "1"
data:
  homelab-vpa.json: |
    {
      "title": "Homelab — Vertical Pod Autoscaler",
      "uid": "homelab-vpa",
      "tags": ["homelab", "autoscaling"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": { "from": "now-24h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods controlled, by update mode",
          "description": "Every pod should sit under InPlaceOrRecreate. A Recreate series reappearing means a vpa.yaml drifted back or a new app copied the old template.",
          "gridPos": { "h": 5, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (update_mode) (vpa_updater_controlled_pods_total)",
              "legendFormat": "{{update_mode}}",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "palette-classic" } },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "In-place resizes (24h)",
          "description": "Pods resized without a restart. Zero on a quiet cluster is normal — the updater only acts when requests leave the recommended bounds, on a quick OOM, or on a pod older than 12h drifting more than 10%.",
          "gridPos": { "h": 5, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(increase(vpa_updater_in_place_updated_pods_total[24h]))",
              "legendFormat": "resized",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "text", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "VPAs with a recommendation",
          "description": "Objects the recommender has produced a recommendation for, against those it flagged as unsupported config. Any unsupported count is a broken VPA spec, not a scaling problem.",
          "gridPos": { "h": 5, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(vpa_recommender_vpa_objects_count{has_recommendation=\"true\"})",
              "legendFormat": "with recommendation",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(vpa_recommender_vpa_objects_count{unsupported_config=\"true\"})",
              "legendFormat": "unsupported config",
              "refId": "B"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "palette-classic" } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "unsupported config" },
                "properties": [
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "red", "value": 1 }
                      ]
                    }
                  },
                  { "id": "color", "value": { "mode": "thresholds" } }
                ]
              }
            ]
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Is in-place working, or falling back to eviction?",
          "description": "Pods matching in-place criteria (gauge) against resizes actually applied (rate). The updater exposes no failure counter, so a sustained gap — candidates present, resizes flat — is the fallback signal. Memory limit downscales always fall back, since containers default to the PreferNoRestart resize policy.",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(vpa_updater_in_place_updatable_pods_total)",
              "legendFormat": "pods eligible for in-place",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(increase(vpa_updater_in_place_updated_pods_total[$__rate_interval]))",
              "legendFormat": "resized in place",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "resized in place" },
                "properties": [
                  { "id": "custom.drawStyle", "value": "bars" },
                  { "id": "custom.fillOpacity", "value": 60 }
                ]
              }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 5,
          "type": "table",
          "title": "In-place resizes by VPA",
          "description": "Which workloads are actually being resized. A single app dominating usually means its recommendation is oscillating, not that it is scaling well.",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "topk(15, sum by (vpa_namespace, vpa_name) (vpa_updater_in_place_updated_pods_total))",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "transformations": [
            { "id": "organize", "options": { "excludeByName": { "Time": true }, "renameByName": { "vpa_namespace": "Namespace", "vpa_name": "VPA", "Value": "Resizes" } } }
          ],
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Recommender health",
          "description": "Metrics-server responses by outcome, and the recommender loop's p99. Errors here mean recommendations go stale, which looks identical to VPA doing nothing.",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (is_error) (rate(vpa_recommender_metric_server_responses[5m]))",
              "legendFormat": "metrics-server is_error={{is_error}}",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "histogram_quantile(0.99, sum by (le, step) (rate(vpa_recommender_execution_latency_seconds_bucket[5m])))",
              "legendFormat": "p99 {{step}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 0, "showPoints": "never" }
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": "p99 .*" },
                "properties": [{ "id": "unit", "value": "s" }]
              }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        }
      ]
    }
