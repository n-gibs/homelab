---
# Feed: ansible/roles/common writes node_apparmor_signal_denials_total via a systemd timer.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kernel
  namespace: monitoring-system
  labels:
    release: monitoring-system
spec:
  groups:
    - name: kernel
      rules:
        # A healthy node logs ~15 signal denials in three weeks; 7.0.0-43 with containerd's
        # stock profile logged ~6,500 an hour, even after kernel rate limiting.
        - alert: AppArmorSignalDenials
          expr: |
            increase(node_apparmor_signal_denials_total[15m])
              * on (instance) group_left (nodename, release) node_uname_info
              > 20
          labels:
            severity: critical
          annotations:
            summary: AppArmor is denying signals on {{ $labels.nodename }} ({{ $labels.release }})
            description: >-
              {{ $value | humanize }} AppArmor signal denials in 15m on {{ $labels.nodename }},
              running kernel {{ $labels.release }}. Processes in one container can no longer
              signal each other, so Postgres stops waking its own workers and CNPG clusters
              fill their connection slots. Check `journalctl -k | grep 'operation="signal"'`
              for the peer label: ansible/roles/common loads a containerd profile that allows
              only `cri-containerd.apparmor.d//&unconfined`. To roll the node back, boot the
              previous kernel once with `grub-reboot`.

        # A missing or stale feed silences the alert above, and with it kured's brake. A failing
        # timer leaves the last value in place, so staleness needs its own check. Scoped to the
        # nodes' job: OPNsense's FreeBSD node_exporter also exports node_uname_info.
        - alert: AppArmorDenialFeedMissing
          expr: |
            (node_uname_info{job="node-exporter"} unless on (instance) node_apparmor_signal_denials_total)
              or on (instance)
            (
              (time() - node_textfile_mtime_seconds{file=~".*apparmor\\.prom"} > 600)
                * on (instance) group_left (nodename) node_uname_info
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: AppArmor denial feed missing or stale on {{ $labels.nodename }}
            description: >-
              node_apparmor_signal_denials_total is missing on {{ $labels.nodename }}, or its
              textfile hasn't been rewritten in over 10 minutes, so AppArmorSignalDenials
              cannot fire there. Check `systemctl status apparmor-denials-textfile` on the node
              and the --collector.textfile.directory flag in
              system/monitoring-system/values.yaml.

        # Our containerd profile overrides containerd's own for as long as it's loaded, so a
        # k3s upgrade must re-check it against the new template. Keep it even once
        # containerd#14487 ships: upstream skips the chromium peer. Firing also pauses kured.
        - alert: ContainerdProfileReview
          expr: kube_node_info{container_runtime_version!="containerd://2.3.7-k3s1.36"}
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.node }} runs {{ $labels.container_runtime_version }}; review the containerd AppArmor profile"
            description: >-
              ansible/roles/common pins cri-containerd.apparmor.d to containerd 2.3.7's template
              plus stacked-peer rules (containerd#14485). {{ $labels.node }} now runs
              {{ $labels.container_runtime_version }}. Re-render the profile from that version's
              contrib/apparmor/template.go, keeping the chromium peer rules that upstream
              containerd#14487 lacks, then update the version in this rule.
