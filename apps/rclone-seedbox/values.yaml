# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
controllers:
  main:
    type: cronjob
    pod:
      # Copy as uid/gid 1000, the PUID/PGID every *arr runs under. rclone defaults to
      # root, and with fs.protected_hardlinks=1 (kernel default) a user cannot hardlink
      # a root-owned file it can't write — so Sonarr silently fell back to a full copy
      # of every seedbox import, defeating the whole point of the shared /data mount.
      # Local qBittorrent grabs hardlink fine precisely because it also runs as 1000.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      # worker-01 is the NFS server itself (192.168.30.194:/mnt/storage). Running
      # anywhere else means every copied byte crosses the LAN a second time as an
      # NFS write. No toleration: worker-01's taint was removed 2026-07-31, and no
      # availability is lost by pinning — if worker-01 is down there is no NFS
      # export to write to anyway.
      nodeSelector:
        homelab.io/media: "true"
    cronjob:
      schedule: "*/10 * * * *"
      # Forbid: a run that overruns 10 minutes must not get a second copier
      # competing for the same files.
      concurrencyPolicy: Forbid
      successfulJobsHistory: 1
      failedJobsHistory: 3
      backoffLimit: 2
    containers:
      app:
        image:
          repository: rclone/rclone
          tag: 1.75.0
        command:
          - rclone
        args:
          - copy
          - seedbox:/home/seedit4me/torrents/qbittorrent
          - /data/downloads/seedbox
          # One category per arr, because an arr claims every torrent in its client's
          # category — all three sharing `media` meant Lidarr's queue filled with
          # Sonarr's TV grabs, stuck at importBlocked forever. Copying the parent means
          # naming what to take: `temp` is qBittorrent's in-progress scratch dir and
          # `ratio` is manual seeding, neither of which any arr imports. With any
          # --include present rclone excludes everything else, so this list is the
          # whole contract.
          - --include=/music/**
          - --include=/tv/**
          - --include=/movies/**
          # ProFTPD's shell-less SFTP forces disable_hashcheck, so rclone falls back to
          # comparing size + modtime — and the destination ends up stamped with the copy
          # time rather than the source mtime, so nothing ever matches and every run
          # re-transfers the whole payload (930 MiB per 15 min, measured 2026-08-04).
          # Worse, each re-copy renames a new .partial into place, so the file gets a new
          # inode under any *arr mid-import and the hardlink is orphaned.
          # Size alone is a sound comparison here: a completed torrent's size is fixed,
          # and unlike --ignore-existing a truncated copy still gets repaired.
          - --size-only
          - --transfers=4
          - --checkers=4
          - --stats=1m
          - --stats-one-line
          - --log-level=INFO
        env:
          # rclone builds the "seedbox:" remote from these. The username and
          # password come from the sealed secret via envFrom below.
          RCLONE_CONFIG_SEEDBOX_TYPE: sftp
          RCLONE_CONFIG_SEEDBOX_HOST: nl137.seedit4.me
          RCLONE_CONFIG_SEEDBOX_PORT: "2097"
          # ProFTPD mod_sftp serves SFTP with no login shell. Without these two,
          # rclone probes for a remote shell and runs md5sum over it, failing
          # every transfer.
          RCLONE_CONFIG_SEEDBOX_SHELL_TYPE: none
          RCLONE_CONFIG_SEEDBOX_DISABLE_HASHCHECK: "true"
        envFrom:
          - secretRef:
              name: rclone-seedbox-sftp
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 1
            # Peak memory tracks file size and --transfers, not a flat baseline: 512Mi
            # OOMKilled on a 3 GiB transfer. Lower --transfers before raising this again.
            memory: 1Gi

persistence:
  data:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage
    globalMounts:
      - path: /data
