repositories:
  - name: cilium
    url: https://helm.cilium.io
  - name: argo
    url: https://argoproj.github.io/argo-helm

---

releases:
  - name: cilium
    namespace: kube-system
    chart: cilium/cilium
    version: 1.19.5
    values:
      - values/cilium.yaml

  - name: gateway-api-crds
    namespace: kube-system
    chart: ./charts/gateway-api-crds
    needs:
      - kube-system/cilium

  - name: argocd
    namespace: argocd
    createNamespace: true
    chart: argo/argo-cd
    version: 10.3.2
    values:
      - values/argocd.yaml
    needs:
      - kube-system/cilium
      - kube-system/gateway-api-crds

  - name: root
    namespace: argocd
    chart: ./root
    needs:
      - argocd/argocd
