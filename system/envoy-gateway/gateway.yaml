apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: envoy
  # Bind the EnvoyProxy override to THIS gateway's proxy directly, not only via
  # the GatewayClass. On a fresh resync the Service was created with the default
  # externalTrafficPolicy (Local) before the GatewayClass-attached EnvoyProxy was
  # processed, and the controller never re-derived it — a Gateway-level ref makes
  # the proxy re-evaluate the EnvoyProxy for this Gateway. EnvoyProxy is in the
  # same namespace, so no namespace field here.
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: homelab
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.nik-homelab.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-nik-homelab-dev
            namespace: envoy-gateway-system
      allowedRoutes:
        namespaces:
          from: All
