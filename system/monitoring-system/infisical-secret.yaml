apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: ntfy-webhook-url
  namespace: monitoring-system
spec:
  infisicalAuthRef:
    name: infisical-auth
    namespace: infisical
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: homelab-ef-28
      environmentSlug: prod
      # Path is /<namespace>/<secret-name>, not just /<namespace>: two Secrets in this
      # namespace both use the key `url`, so a per-namespace path collides.
      secretPath: /monitoring-system/ntfy-webhook-url
  targets:
    - name: ntfy-webhook-url
      namespace: monitoring-system
      kind: Secret
      creationPolicy: Owner
