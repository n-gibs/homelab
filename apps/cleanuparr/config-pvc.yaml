apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cleanuparr-config
  namespace: cleanuparr
spec:
  accessModes:
    - ReadWriteOnce
  # /config is SQLite -- longhorn per the CLAUDE.md storage rule.
  # Backup: backup-cronjob.yaml, since Cleanuparr has no backup feature of its own.
  # Settings lost with the volume are re-enterable from the UI; the arr API keys are
  # generate:-derived and recoverable from secrets/.secrets.
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
