---
- name: Add root subuid mapping for containerd user namespaces
  ansible.builtin.lineinfile:
    path: /etc/subuid
    line: "root:165536:65536"
    create: true
    mode: "0644"
  become: true

- name: Add root subgid mapping for containerd user namespaces
  ansible.builtin.lineinfile:
    path: /etc/subgid
    line: "root:165536:65536"
    create: true
    mode: "0644"
  become: true

- name: Create containerd override config directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d
    state: directory
    mode: "0755"
  become: true

# overlayfs is healthy on these nodes now, and native has no union mount, so every layer
# is a full copy of its parent. `state: absent` rather than deletion, so already-provisioned
# nodes get cleaned up too. See ansible/README.md.
- name: Remove the containerd native-snapshotter override
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d/snapshotter.toml
    state: absent
  become: true

- name: Create k3s systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    mode: "0755"
  become: true

# A stale conflist lets kubelet call the node Ready before cilium.sock exists, so pods
# start and cilium-cni fails them. Dropping it makes the node honestly NotReady. Guarded
# on the socket, which is also why two agents can coexist after a restart.
# See ansible/README.md.
- name: Gate k3s startup on a live Cilium CNI socket
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/cilium-cni-gate.conf
    content: |
      [Service]
      ExecStartPre=/bin/sh -c '[ -S /var/run/cilium/cilium.sock ] || rm -f /etc/cni/net.d/05-cilium.conflist'
    mode: "0644"
  become: true
  notify: Reload systemd

# network-online.target is vacuous here: wait-online is skipped every boot on an unmet
# ConditionPathIsSymbolicLink, so nothing waits for DHCP and k3s starts with no default
# route. Clearing the condition lets the unit run. See ansible/README.md.
- name: Create systemd-networkd-wait-online override directory
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-networkd-wait-online.service.d
    state: directory
    mode: "0755"
  become: true

- name: Make network-online.target actually wait for the network
  ansible.builtin.copy:
    dest: /etc/systemd/system/systemd-networkd-wait-online.service.d/always-run.conf
    content: |
      [Unit]
      ConditionPathIsSymbolicLink=
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - htop
      - vim
      - unattended-upgrades
      - ufw
      - fail2ban
      - open-iscsi
      - nfs-common
      - chrony
      - lm-sensors
      - smartmontools
      - thermald
      # intel_gpu_top: shows Video/VideoEnhance engine occupancy, the only way to tell a
      # QSV transcode from a software one that merely opened the device.
      - intel-gpu-tools
      # nvme-cli: reads the APST power-state table kernel_cmdline_extra is tuned against
      # on worker-02. smartctl does not expose it.
      - nvme-cli
    state: present
  become: true

# Longhorn's v1 data engine attaches every volume over iSCSI to localhost, and open-iscsi
# ships the daemon disabled. A missing iscsid surfaces as a volume stuck in Attaching,
# which reads like a Longhorn bug. Talos equivalent: docs/talos-migration-audit.md.
- name: Load iscsi_tcp on boot
  ansible.builtin.copy:
    content: "iscsi_tcp\n"
    dest: /etc/modules-load.d/iscsi_tcp.conf
    mode: "0644"
  become: true

- name: Load iscsi_tcp now
  community.general.modprobe:
    name: iscsi_tcp
    state: present
  become: true

- name: Enable and start iscsid
  ansible.builtin.systemd_service:
    name: iscsid
    enabled: true
    state: started
  become: true

# multipathd can claim the block devices Longhorn attaches over iSCSI, and it manages nothing
# on these nodes (direct-attached NVMe plus one USB disk), so this drops an unused daemon
# rather than a capability. Add real multipath storage and blacklist its devices in
# /etc/multipath.conf instead. Talos status unverified.
- name: Disable and stop multipathd
  ansible.builtin.systemd_service:
    name: multipathd
    enabled: false
    state: stopped
  become: true

# chrony is the only time source on these nodes and ships without Restart=, so a stray
# SIGTERM leaves it dead silently while the clock drifts unmonitored.
- name: Create chrony systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/chrony.service.d
    state: directory
    mode: "0755"
  become: true

# Restart=always, not on-failure: a SIGTERM is a clean exit. An explicit `systemctl stop`
# still wins, because systemd never restarts a deliberate stop.
# ponytail: chrony only. Clock skew on an etcd node is the one that hurts.
- name: Make chrony survive an unexpected termination
  ansible.builtin.copy:
    dest: /etc/systemd/system/chrony.service.d/override.conf
    content: |
      [Service]
      Restart=always
      RestartSec=5s
    mode: "0644"
  become: true

- name: Enable and start node services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - chrony
    - thermald
    - fail2ban
  become: true

# hwmon covers CPU and NVMe already, but USB-attached drives have no hwmon entry, so
# worker-01's 12TB WD is invisible to it. See ansible/README.md.
# TODO(NAS): delete this exporter and its two units once /mnt/storage leaves that drive.
- name: Create node-exporter textfile collector directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    mode: "0755"
  become: true

# Writes to a temp file and renames, because a half-written .prom fails the whole scrape.
# Unreadable metrics are omitted per-disk rather than emitted as 0: a missing series leaves
# the alert expression empty, where a 0 reads as a stone-cold drive.
- name: Install SMART drive temperature textfile exporter
  ansible.builtin.copy:
    dest: /usr/local/bin/smart-temp-textfile
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Managed by Ansible (roles/common). Publishes SMART drive temperatures for
      # node-exporter's textfile collector.
      set -euo pipefail

      out=/var/lib/node_exporter/textfile_collector/smart_temp.prom
      tmp="$(mktemp "${out}.XXXXXX")"
      trap 'rm -f "$tmp"' EXIT

      {
        echo '# HELP node_smart_temperature_celsius Drive temperature reported by SMART.'
        echo '# TYPE node_smart_temperature_celsius gauge'
        echo '# HELP node_smart_temperature_limit_celsius Vendor specified maximum operating temperature.'
        echo '# TYPE node_smart_temperature_limit_celsius gauge'
        echo '# HELP node_smart_load_cycle_count Lifetime head load/unload cycles (SMART 193).'
        echo '# TYPE node_smart_load_cycle_count counter'
      } >"$tmp"

      # NVMe excluded: hwmon covers it, and two sources means two alerts for one disk.
      while read -r name type; do
        [[ "$type" == "disk" ]] || continue
        [[ "$name" == nvme* ]] && continue
        dev="/dev/$name"

        # Every smartctl call needs `|| true`: its exit status is a bitmask that sets bits
        # for non-failures, and worker-01's WD returns non-zero every time while still
        # giving a good temperature.
        attrs="$(smartctl -A "$dev" 2>/dev/null || true)"
        # Field 10 of attribute 194 is the raw value. Falls back to the SCSI-style line
        # for drives reporting no ATA attributes.
        temp="$(awk '$1 == 194 { print $10; exit }' <<<"$attrs")"
        if [[ -z "$temp" ]]; then
          temp="$(awk '/Current Drive Temperature/ { print $4; exit }' <<<"$attrs")"
        fi
        [[ "$temp" =~ ^[0-9]+$ ]] || continue

        model="$(smartctl -i "$dev" 2>/dev/null \
          | awk -F': +' '/^Device Model|^Product/ { print $2; exit }' || true)"
        printf 'node_smart_temperature_celsius{device="%s",model="%s"} %s\n' \
          "$name" "${model:-unknown}" "$temp" >>"$tmp"

        # Head parking is a wear budget rather than a temperature, but only a rate over
        # time shows whether the APM fix below is holding, so it rides the same SMART read.
        cycles="$(awk '$1 == 193 { print $10; exit }' <<<"$attrs")"
        if [[ "$cycles" =~ ^[0-9]+$ ]]; then
          printf 'node_smart_load_cycle_count{device="%s"} %s\n' "$name" "$cycles" >>"$tmp"
        fi

        limit="$(smartctl -l devstat "$dev" 2>/dev/null \
          | awk '/Specified Maximum Operating Temperature/ { print $4; exit }' || true)"
        if [[ "$limit" =~ ^[0-9]+$ ]]; then
          printf 'node_smart_temperature_limit_celsius{device="%s"} %s\n' \
            "$name" "$limit" >>"$tmp"
        fi
      done < <(lsblk --nodeps --noheadings --output NAME,TYPE)

      chmod 0644 "$tmp"
      mv "$tmp" "$out"
      trap - EXIT
  become: true

- name: Install SMART temperature exporter systemd units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: smart-temp-textfile.service
      content: |
        [Unit]
        Description=Publish SMART drive temperatures for node-exporter
        After=local-fs.target

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/smart-temp-textfile
    # 2min, not 30s: polling SMART holds the drive awake, and the alerts need 15m
    # sustained to fire anyway.
    - name: smart-temp-textfile.timer
      content: |
        [Unit]
        Description=Publish SMART drive temperatures every 2 minutes

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=2min
        AccuracySec=10s

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  become: true
  notify: Reload systemd

- name: Enable and start SMART temperature exporter timer
  ansible.builtin.systemd_service:
    name: smart-temp-textfile.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true

# APM 254 stops worker-01's 12TB WD parking its heads on a near-idle drive. On udev
# add/change because APM is volatile; matched on vendor+model because the USB bridge
# fabricates an unstable serial. See ansible/README.md.
# TODO(NAS): delete once /mnt/storage leaves that drive.
- name: Stop the 12TB USB drive parking its heads every minute
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/60-wd-elements-apm.rules
    mode: "0644"
    content: |
      # Managed by Ansible (roles/common). See the task that installs this file.
      ACTION=="add|change", SUBSYSTEM=="block", KERNEL=="sd[a-z]", \
        ENV{ID_VENDOR}=="WDC_WD12", ENV{ID_MODEL}=="0EDGZ-11CNVA0", \
        RUN+="/usr/sbin/smartctl --set=apm,254 /dev/%k"
  become: true
  notify: Reload udev rules

# The default max_user_instances=128 is charged per-UID and every containerd-shim holds 2,
# so a dense node runs the whole UID out of inotify fds. Not a leak: the only growth term
# is pod count, which kubelet caps. See ansible/README.md.
- name: Raise inotify limits for Kubernetes pod density
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-inotify.conf
    sysctl_set: true
    reload: true
    state: present
  loop:
    - { name: fs.inotify.max_user_instances, value: "1024" }
    - { name: fs.inotify.max_user_watches, value: "524288" }
  become: true

# Hand edits to this file are how worker-02 ended up booting parameters no one could see.
# Reset it everywhere; the exceptions live in kernel_cmdline_extra.
- name: Reset the stock kernel command line
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^GRUB_CMDLINE_LINUX_DEFAULT='
    line: 'GRUB_CMDLINE_LINUX_DEFAULT=""'
  become: true
  notify: Update grub

# Appends, like kdump-tools.cfg: grub.d is sourced after /etc/default/grub, so assigning
# would drop crashkernel=. Always written, so emptying the list reverts a node.
- name: Manage per-host kernel parameters
  ansible.builtin.copy:
    dest: /etc/default/grub.d/99-kernel-cmdline.cfg
    content: |
      # Managed by Ansible (roles/common). Set kernel_cmdline_extra in host_vars.
      GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT {{ kernel_cmdline_extra | join(' ') }}"
    mode: "0644"
  become: true
  notify: Update grub

- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: "0644"
  become: true

- name: Enable unattended-upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    enabled: true
    state: started
  become: true

- name: Harden SSH - disable password auth
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present
  become: true
  notify: Restart sshd

- name: Harden SSH - disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    state: present
  become: true
  notify: Restart sshd

- name: Configure UFW defaults
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
  become: true

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  become: true

- name: Allow k3s API server
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
  become: true

- name: Allow kubelet metrics
  community.general.ufw:
    rule: allow
    port: "10250"
    proto: tcp
  become: true

- name: Allow Cilium VXLAN
  community.general.ufw:
    rule: allow
    port: "8472"
    proto: udp
  become: true

- name: Allow node-exporter metrics from pod network
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: 10.42.0.0/16
  become: true

- name: Allow node-exporter metrics from cluster node subnet
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: 192.168.30.0/24
  become: true

# Node-subnet source, not pod-subnet: Prometheus scrapes a node IP from outside the cluster
# CIDR, so Cilium masquerades the pod source to the scraping node's own address.
# See ansible/README.md.
- name: Allow Cilium health and metrics ports from cluster node subnet
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    src: 192.168.30.0/24
  loop:
    - "4240"      # cilium-health host probes
    - "9962"      # cilium-agent metrics
    - "9963"      # cilium-operator metrics
    - "9965"      # hubble metrics
  become: true

# Embedded etcd: 2379 client, 2380 peer, 2381 metrics, on the node IP of every server.
# Node-subnet source, unlike the hand-added rule this replaces — nothing off that subnet
# has any business holding a cluster datastore connection. See ansible/README.md.
- name: Allow etcd client, peer and metrics from cluster node subnet
  community.general.ufw:
    rule: allow
    port: "2379:2381"
    proto: tcp
    src: 192.168.30.0/24
  become: true

# Kept deliberately. Pods reach the host on more ports than anyone can enumerate, and the
# failure mode of missing one is a silent timeout that reads as a network fault. The pod
# CIDR is inside the cluster's trust boundary. See ansible/README.md.
- name: Allow all traffic from the pod network
  community.general.ufw:
    rule: allow
    src: 10.42.0.0/16
  become: true

# Hand-added, then found to be backed by nothing on any node. The ufw module only adds, so
# these need an explicit delete to leave the nodes. See ansible/README.md.
- name: Remove UFW rules with nothing behind them
  community.general.ufw:
    rule: allow
    delete: true
    port: "{{ item.port | default(omit) }}"
    proto: "{{ item.proto | default(omit) }}"
    src: "{{ item.src | default(omit) }}"
  loop:
    - { port: "5001", proto: tcp }
    - { port: "51820", proto: udp }
    - { port: "51821", proto: udp }
    - { src: "10.43.0.0/16" }
    - { port: "2379:2381", proto: tcp }   # the Anywhere-source version, replaced above
  become: true

- name: Enable UFW
  community.general.ufw:
    state: enabled
  become: true

# The Ubuntu installer allocates only part of the volume group to the root LV, and container
# images are the dominant consumer here, so claim the whole VG.
- name: Check for unallocated space in the root volume group
  ansible.builtin.command: vgs --noheadings --nosuffix --units b -o vg_free ubuntu-vg
  register: root_vg_free
  changed_when: false
  failed_when: false
  check_mode: false        # read-only; must run under --check for the guard below to evaluate
  become: true

- name: Extend root logical volume to use all free volume group space
  community.general.lvol:
    vg: ubuntu-vg
    lv: ubuntu-lv
    size: +100%FREE
    resizefs: true
  become: true
  when:
    - root_vg_free.rc == 0
    - (root_vg_free.stdout | trim | int) > 1073741824
