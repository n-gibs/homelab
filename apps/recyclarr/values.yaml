controllers:
  main:
    type: cronjob
    cronjob:
      schedule: "0 4 * * *"
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
    containers:
      app:
        # renovate: datasource=docker depName=ghcr.io/recyclarr/recyclarr
        image:
          repository: ghcr.io/recyclarr/recyclarr
          tag: 8.7.2
        args: ["sync"]
        env:
          TZ: America/Los_Angeles
        envFrom:
          - secretRef:
              name: recyclarr-api-keys

configMaps:
  config:
    data:
      recyclarr.yml: |
        # Instance names must be unique across services: Recyclarr 8 silently skips duplicates.
        # Sizes and upgrade settings are deliberately unmanaged; see HOM-38 before adding them.
        sonarr:
          sonarr:
            base_url: http://sonarr.sonarr.svc.cluster.local:8989
            api_key: !env_var SONARR_API_KEY
            quality_profiles:
              - name: Any
                reset_unmatched_scores:
                  enabled: true
                min_format_score: 0
                score_set: default
            # Full-disc images can't be imported, so the grab fails and leaves its RARs and ISO
            # behind. -10000 against min_format_score 0 rejects them outright.
            custom_formats:
              - trash_ids:
                  - 85c61753df5da1fb2aab6f2a47426b09 # BR-DISK
                assign_scores_to:
                  - name: Any

        radarr:
          radarr:
            base_url: http://radarr.radarr.svc.cluster.local:7878
            api_key: !env_var RADARR_API_KEY
            quality_profiles:
              - name: Any
                reset_unmatched_scores:
                  enabled: true
                min_format_score: 0
                score_set: default
            custom_formats:
              - trash_ids:
                  - ed38b889b31be83fda192888e2286d83 # BR-DISK
                assign_scores_to:
                  - name: Any

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: nfs
    size: 1Gi
    accessMode: ReadWriteMany
    globalMounts:
      - path: /config
  recyclarr-yml:
    type: configMap
    identifier: config
    globalMounts:
      - path: /config/recyclarr.yml
        subPath: recyclarr.yml
        readOnly: true
