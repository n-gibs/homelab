apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data-local
  namespace: vaultwarden
  # No sync-wave annotation -- see the local-path note in CLAUDE.md. Superseded by
  # data-pvc-nfs.yaml; scheduled for deletion.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
