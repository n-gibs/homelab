# renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
image:
  tag: 44.40.0

cronjob:
  schedule: "0 3,15 * * *"
  timeZone: America/Los_Angeles
  # Two Renovate runs at once can open duplicate PRs for the same dependency.
  concurrencyPolicy: Forbid
  # k8s keeps only 1 failed pod by default; 3 gives enough log history to debug a bad run.
  failedJobsHistoryLimit: 3

existingSecret: renovate-env

renovate:
  # JavaScript, not JSON, so credentials can stay out of git as process.env
  # references. A broken config.js makes Renovate exit loudly; the JSON
  # RENOVATE_HOST_RULES alternative fails silently. See the spec.
  configIsJavaScript: true
  config: |
    module.exports = {
      platform: 'github',
      onboarding: false,
      repositories: ['n-gibs/homelab'],
      hostRules: [
        {
          hostType: 'docker',
          matchHost: 'docker.io',
          // Not a credential, so it stays readable in git rather than
          // being invisible inside the sealed secret.
          username: 'nikgibs',
          password: process.env.DOCKER_HUB_TOKEN,
        },
        {
          // lscr.io proxies ghcr.io, whose anonymous rate limit 429s the
          // `tags/list?n=10000` lookups -- reported as "no-result" on whichever
          // arrs lost the race. Reuses RENOVATE_TOKEN; ghcr.io takes a GitHub PAT.
          hostType: 'docker',
          matchHost: 'lscr.io',
          username: 'n-gibs',
          password: process.env.RENOVATE_TOKEN,
          // Auth alone does not stop the 429s: Renovate's default queue is 16 concurrent
          // requests per host, and parallel tags/list lookups still trip ghcr.io's edge limit.
          // A throttled run is slower; a throttled lookup reports "no-result" and skips silently.
          concurrentRequestLimit: 4,
          maxRequestsPerSecond: 5,
        },
      ],
    };

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  # CronJob, so no VPA rewrites this — 1 core was the literal ceiling and the last two
  # runs throttled 72% and 64% (2026-08-12).
  limits:
    cpu: 2
    memory: 2Gi
