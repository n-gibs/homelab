---
- name: Add root subuid mapping for containerd user namespaces
  ansible.builtin.lineinfile:
    path: /etc/subuid
    line: "root:165536:65536"
    create: true
    mode: "0644"
  become: true

- name: Add root subgid mapping for containerd user namespaces
  ansible.builtin.lineinfile:
    path: /etc/subgid
    line: "root:165536:65536"
    create: true
    mode: "0644"
  become: true

- name: Create containerd override config directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d
    state: directory
    mode: "0755"
  become: true

# The native snapshotter was a workaround for an early Ubuntu 26.04 / kernel 7.x
# problem. containerd now reports the overlayfs plugin as healthy on these nodes,
# and native is expensive: it has no union mount, so each layer's snapshot is a
# full copy of its parent. Measured on worker-02 with the same 798MB image:
# 8m23s to unpack on native vs 26s on overlayfs, and 80G vs 2.2G of snapshotter
# store. Removing the override lets k3s use its overlayfs default.
# `state: absent` (rather than deleting this task) so already-provisioned nodes
# are cleaned up too. Takes effect on the next k3s restart.
- name: Remove the containerd native-snapshotter override
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d/snapshotter.toml
    state: absent
  become: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - htop
      - vim
      - unattended-upgrades
      - ufw
      - fail2ban
      - open-iscsi
      - nfs-common
      - chrony
      - thermald
    state: present
  become: true

# chrony is the only time source on these nodes — systemd-timesyncd is not installed.
# On 2026-07-29 a mass `kill -TERM` sweep on worker-00 (hunting an orphaned process
# holding :9100 during the containerd snapshotter migration) SIGTERM'd chrony, thermald
# and fail2ban as collateral. None of the three carries Restart=, so all three stayed
# dead silently; the clock then drifted unmonitored for 38h. Reconcile them here.
- name: Create chrony systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/chrony.service.d
    state: directory
    mode: "0755"
  become: true

# A stray SIGTERM is a *clean* exit (status=0/SUCCESS), so Restart=on-failure would not
# have covered it. An explicit `systemctl stop chrony` still wins — systemd never restarts
# a unit that was deliberately stopped.
# ponytail: chrony only. Clock skew on an etcd control-plane node is the one that hurts;
# add the same override for thermald/fail2ban if either ever goes missing again.
- name: Make chrony survive an unexpected termination
  ansible.builtin.copy:
    dest: /etc/systemd/system/chrony.service.d/override.conf
    content: |
      [Service]
      Restart=always
      RestartSec=5s
    mode: "0644"
  become: true

- name: Enable and start node services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - chrony
    - thermald
    - fail2ban
  become: true

# The kernel default fs.inotify.max_user_instances=128 is charged per-UID, and every
# containerd-shim holds 2 inotify fds — one shim per running pod. worker-00 hit 129/128
# with 37 pods (72 shim fds + 44 from k3s-server + ~11 from systemd/tailscaled/agetty),
# after which even PID 1 logged "Failed to allocate inotify fd: Too many open files" and
# path units could not enter their waiting state.
# Audited before raising it (.claude/scripts/inotify-audit.py): not a leak — zero holders
# had an idle instance, and worker-02's 35x-older k3s-server held *fewer* fds. The only
# growth term is pod count, which kubelet caps at 110/node, so 1024 is real headroom at
# the measured ~2.2 fds/pod.
# max_user_watches is not currently near its limit (288 used of 123584); raised for symmetry.
- name: Raise inotify limits for Kubernetes pod density
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-inotify.conf
    sysctl_set: true
    reload: true
    state: present
  loop:
    - { name: fs.inotify.max_user_instances, value: "1024" }
    - { name: fs.inotify.max_user_watches, value: "524288" }
  become: true

- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: "0644"
  become: true

- name: Enable unattended-upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    enabled: true
    state: started
  become: true

- name: Harden SSH - disable password auth
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present
  become: true
  notify: Restart sshd

- name: Harden SSH - disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    state: present
  become: true
  notify: Restart sshd

- name: Configure UFW defaults
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
  become: true

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  become: true

- name: Allow k3s API server
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
  become: true

- name: Allow kubelet metrics
  community.general.ufw:
    rule: allow
    port: "10250"
    proto: tcp
  become: true

- name: Allow Cilium VXLAN
  community.general.ufw:
    rule: allow
    port: "8472"
    proto: udp
  become: true

- name: Allow node-exporter metrics from pod network
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: 10.42.0.0/16
  become: true

- name: Allow node-exporter metrics from cluster node subnet
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: 192.168.30.0/24
  become: true

- name: Enable UFW
  community.general.ufw:
    state: enabled
  become: true

# The Ubuntu installer allocates only part of the volume group to the root LV.
# Container images are the dominant consumer on these nodes, so claim the whole
# VG. (This was originally written when the native snapshotter was in use and
# stored a full copy of every layer; that override has since been removed above,
# but the headroom is still worth having.)
- name: Check for unallocated space in the root volume group
  ansible.builtin.command: vgs --noheadings --nosuffix --units b -o vg_free ubuntu-vg
  register: root_vg_free
  changed_when: false
  failed_when: false
  check_mode: false        # read-only; must run under --check for the guard below to evaluate
  become: true

- name: Extend root logical volume to use all free volume group space
  community.general.lvol:
    vg: ubuntu-vg
    lv: ubuntu-lv
    size: +100%FREE
    resizefs: true
  become: true
  when:
    - root_vg_free.rc == 0
    - (root_vg_free.stdout | trim | int) > 1073741824
