server:
  # Measured 7-day peak 20m / 71Mi. Keep this inside the existing server block — a second
  # top-level `server:` key silently wins in YAML, dropping everything below it and
  # deleting the ArgoCD HTTPRoute.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  service:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "ArgoCD"
      gethomepage.dev/description: "GitOps CD"
      gethomepage.dev/group: "Infrastructure"
      gethomepage.dev/icon: "argocd.png"
      gethomepage.dev/href: "https://argocd.nik-homelab.dev"
  ingress:
    enabled: false
  httproute:
    enabled: true
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system
    hostnames:
      - argocd.nik-homelab.dev

# The application-controller already listens on :8082 (--metrics-port=8082); this only
# puts a Service in front of it so Prometheus has something to scrape. Without it there
# is no argocd_app_info, and an alert on ArgoCD sync state silently never fires.
# The matching ServiceMonitor deliberately lives in system/monitoring-system/ rather than
# here: `controller.metrics.serviceMonitor.enabled` needs the Prometheus Operator CRDs,
# which don't exist yet at bootstrap time (ArgoCD installs before monitoring-system), so
# enabling it here would break a from-scratch `just bootstrap`.
controller:
  metrics:
    enabled: true
  # Resource requests for this and every component below.
  #
  # All seven components shipped requestless and all seven landed on worker-00, the 4-core
  # node. That is the mechanism, not chance: kube-scheduler scores on *requested*
  # resources, so a requestless container looks free everywhere and placement is arbitrary
  # — and nothing rebalances afterwards.
  #
  # Values are 7-day peak usage from Prometheus (max_over_time of the 5m rate) rounded up,
  # not guesses. Requests only, no limits: a CPU limit throttles the controller
  # mid-reconcile for no benefit at 28 cores, and a memory limit turns a slow sync into an
  # OOMKill.
  resources:
    requests:
      cpu: 200m
      memory: 768Mi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 192Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

dex:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi

notifications:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi

configs:
  params:
    server.insecure: true  # TLS terminated at gateway
    controller.diff.server.side: "true"  # cancel CRD-defaulted fields (Gateway API drift)
  cm:
    users.anonymous.enabled: "true"
    accounts.readonly: apiKey
  rbac:
    policy.default: "role:admin"
    policy.csv: "g, readonly, role:readonly"
