apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr-config-local
  namespace: lidarr
  # No sync-wave annotation -- see the local-path note in CLAUDE.md. Superseded by
  # lidarr-config below; scheduled for deletion.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lidarr-config
  namespace: lidarr
spec:
  accessModes:
    - ReadWriteOnce
  # /config is SQLite -- longhorn per the CLAUDE.md storage rule.
  # Backup: Lidarr's own System -> Backup, writing to /data/backups/lidarr/scheduled/.
  # Tightest of the migrated volumes: MediaCover and logs grow with the library, so
  # this is the one most likely to need an expand.
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
