# Nothing watched the thing that publishes every public hostname in the cluster. See
# prometheusrule.yaml.
serviceMonitor:
  enabled: true

sources:
  - gateway-httproute

provider:
  name: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: api-token

cloudflare:
  proxied: false

extraArgs:
  - --gateway-namespace=envoy-gateway-system

policy: sync
txtOwnerId: homelab

domainFilters:
  - nik-homelab.dev

logLevel: info
