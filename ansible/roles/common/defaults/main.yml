# Appended to GRUB_CMDLINE_LINUX_DEFAULT. Set per host; see host_vars/worker-02.yml.
kernel_cmdline_extra: []

# Boot this kernel instead of the newest installed one, e.g. "7.0.0-34-generic". An
# emergency override only: kured rolls new kernels out one node at a time, and an alert
# stops it. Empty means the newest installed kernel.
kernel_pin: ""
