# Here for one label, intel.feature.node.kubernetes.io/gpu, which system/intel-gpu-plugin
# selects on. Chart defaults set memory limits but no requests.
master:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

worker:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

gc:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi
