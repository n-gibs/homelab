# Cleanuparr has no built-in scheduled backup, unlike the arrs, so this job is its app-level
# backup path. Not a `cp`: SQLite in WAL mode spreads committed state across .db/-wal/-shm, so
# copying a live database can produce a torn, unrestorable file. This uses SQLite's online backup
# API from Python's stdlib, hence a python image -- no sqlite3 CLI, and Renovate tracks it.
apiVersion: batch/v1
kind: CronJob
metadata:
  # Name must keep the -db-backup suffix: BackupCronJobMissing in
  # system/monitoring-system/prometheusrule-backups.yaml counts CronJobs matching
  # ".+-db-backup" and alerts if one stops reporting.
  name: cleanuparr-db-backup
  namespace: cleanuparr
spec:
  schedule: "15 4 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            # Alloy derives the Loki `app` stream label from this; without it these
            # pods fall back to the namespace and land in cleanuparr's main stream.
            app.kubernetes.io/name: cleanuparr-db-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            # /data/backups is 1000:1000 rwxrwxr-x, so uid 1000 can create the
            # cleanuparr/ subdirectory itself. /config is written by the app as 1000.
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: sqlite-backup
              image: python:3.13-alpine
              command:
                - python
                - -c
                - |
                  import glob, os, shutil, sqlite3, sys, tarfile, time

                  CONFIG = "/config"
                  DEST = "/data/backups/cleanuparr"
                  RETAIN_DAYS = 14
                  staging = "/tmp/cleanuparr-backup"
                  stamp = time.strftime("%Y%m%d-%H%M%S")

                  # Copy by exclusion rather than by filename: the DataProtection keys and
                  # cleanuparr.json live under /config with undocumented names. The .db files
                  # are replaced below by consistent snapshots.
                  shutil.rmtree(staging, ignore_errors=True)
                  shutil.copytree(
                      CONFIG,
                      staging,
                      ignore=shutil.ignore_patterns(
                          "logs", "*.db", "*.db-wal", "*.db-shm"
                      ),
                  )

                  # Cleanuparr creates one database per internal context (data,
                  # events, users), so glob rather than naming them.
                  dbs = sorted(glob.glob(os.path.join(CONFIG, "*.db")))
                  if not dbs:
                      sys.exit(
                          "no .db files in /config -- refusing to write a backup "
                          "with no database in it"
                      )
                  for db in dbs:
                      target = os.path.join(staging, os.path.basename(db))
                      # Read-only source: a backup job must never mutate what it is backing up,
                      # and if WAL recovery were needed this open fails loudly, which is the safe
                      # direction. mode=ro enforces that -- not the mount, which has to stay
                      # writable so SQLite can create the -shm file (see below).
                      src = sqlite3.connect(f"file:{db}?mode=ro", uri=True)
                      dst = sqlite3.connect(target)
                      with dst:
                          src.backup(dst)
                      dst.close()
                      src.close()
                      print(
                          f"snapshot {os.path.basename(db)} "
                          f"{os.path.getsize(target)} bytes"
                      )

                  os.makedirs(DEST, exist_ok=True)
                  archive = os.path.join(DEST, f"cleanuparr-{stamp}.tar.gz")
                  # Temp name on the same filesystem, so the rename below is atomic: writing
                  # straight to `archive` would leave a truncated file at exactly the name the
                  # restore path reaches for. The ".tmp" suffix also keeps a crashed run's
                  # leftover out of the prune glob, so it is never counted as a real archive.
                  tmp_archive = archive + ".tmp"
                  with tarfile.open(tmp_archive, "w:gz") as tar:
                      tar.add(staging, arcname="config")
                  os.rename(tmp_archive, archive)
                  print(f"wrote {archive} ({os.path.getsize(archive)} bytes)")

                  cutoff = time.time() - RETAIN_DAYS * 86400
                  kept = 0
                  for old in sorted(
                      glob.glob(os.path.join(DEST, "cleanuparr-*.tar.gz"))
                  ):
                      if os.path.getmtime(old) < cutoff:
                          os.remove(old)
                          print(f"pruned {os.path.basename(old)}")
                      else:
                          kept += 1
                  print(f"retained: {kept} archives")
              volumeMounts:
                # Not readOnly. Opening a WAL-mode database, even with mode=ro, requires a -shm
                # file, and SQLite must create it when none exists -- an idle database has none,
                # so a read-only mount fails with "unable to open database file". mode=ro on the
                # connection is what keeps this job from mutating the database.
                - name: config
                  mountPath: /config
                - name: data
                  mountPath: /data
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            # ReadWriteOnce is a per-NODE constraint, not per-pod, so this pod may mount the
            # volume while Cleanuparr has it. (ReadWriteOncePod would forbid it; that is not
            # the access mode in use.)
            - name: config
              persistentVolumeClaim:
                claimName: cleanuparr-config-local
            - name: data
              nfs:
                server: 192.168.30.194
                path: /mnt/storage
