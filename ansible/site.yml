---
- name: Apply common baseline to all nodes
  hosts: k3s_cluster
  tags: common          # without this `just provision-common` selects zero tasks
  roles:
    - common

- name: Deploy k3s cluster
  ansible.builtin.import_playbook: k3s.orchestration.site

- name: Configure cert-manager ClusterIssuers on all server nodes
  hosts: k3s_cluster
  roles:
    - cert_manager_issuers
