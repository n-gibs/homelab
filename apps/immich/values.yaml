controllers:
  main:
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
    containers:
      main:
        # Chart 0.13.1's appVersion is v3.0.0 and the chart does not release on
        # every Immich release, so the tag is pinned ahead of it here. Valkey is
        # unaffected: its own values section pins its image explicitly.
        # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
        image:
          tag: v3.1.0
        env:
          DB_HOSTNAME: immich-database-rw
          DB_USERNAME: app
          DB_DATABASE_NAME: app
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: password

immich:
  # true makes the chart create the immich-server ServiceMonitor itself, with an endpoint each
  # for the api (:8081) and microservices (:8082) metrics -- there is no hand-written one to
  # keep in sync. Costs 2540 series, measured 2026-08-15.
  metrics:
    enabled: true
  persistence:
    library:
      existingClaim: immich-library

valkey:
  enabled: true
  # No VPA covers valkey -- immich's VPA targetRef is Deployment/immich-server alone, so
  # this container's requests are whatever the manifest says and nothing tunes them later.
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi

machine-learning:
  enabled: false

server:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 50m
              memory: 2Gi
            limits:
              # Memory only. No cpu limit: VPA preserves the request:limit ratio, so a
              # shrinking request drags the limit down with it and throttles the container.
              memory: 4Gi
  route:
    main:
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Immich"
        gethomepage.dev/description: "Photo and video backup"
        gethomepage.dev/group: "Media"
        gethomepage.dev/icon: "immich.png"
        gethomepage.dev/href: "https://immich.nik-homelab.dev"
        # Homepage finds the backing pod by app.kubernetes.io/name, defaulting to the
        # route's own name — which is immich-server, while the chart labels the pod
        # just "server". Without this the card shows a permanent orange dot even
        # though the widget itself is fine; status and widget are separate lookups.
        gethomepage.dev/app: "server"
        # version 2 because the widget's v1 API shape only covers Immich < 1.118; we run
        # v3.x. The {{HOMEPAGE_VAR_}} placeholder resolves in annotations too (discovered
        # services go through substituteEnvironmentVars), so the key stays a sealed secret
        # on Homepage's side. It must be a quoted literal: bjw-s runs annotation values
        # through Helm's tpl, which would otherwise fail the render with
        # `function "HOMEPAGE_VAR_IMMICH_API_KEY" not defined`.
        gethomepage.dev/widget.type: "immich"
        gethomepage.dev/widget.url: "http://immich-server.immich.svc.cluster.local:2283"
        gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_IMMICH_API_KEY}}" }}'
        gethomepage.dev/widget.version: "2"
      enabled: true
      kind: HTTPRoute
      hostnames:
        - immich.nik-homelab.dev
      parentRefs:
        - name: homelab
          namespace: envoy-gateway-system
