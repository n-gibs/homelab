apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: infisical
  namespace: infisical
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Infisical"
    gethomepage.dev/description: "Secrets management"
    gethomepage.dev/group: "Infrastructure"
    # Status lookup defaults to app.kubernetes.io/name=<route name>, which matches nothing here.
    gethomepage.dev/pod-selector: "app=infisical-standalone"
    gethomepage.dev/icon: "infisical.png"
    gethomepage.dev/href: "https://infisical.nik-homelab.dev"
spec:
  hostnames:
    - infisical.nik-homelab.dev
  parentRefs:
    - name: homelab
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        # Chart hardcodes <release>-<chart>-<infisical.name>; fullnameOverride doesn't change it.
        - name: infisical-infisical-standalone-infisical
          port: 8080
