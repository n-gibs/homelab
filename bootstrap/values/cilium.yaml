# cilium-operator, hubble-relay and hubble-ui deliberately have NO resource requests,
# unlike their requestless peers fixed in argocd.yaml / monitoring-system / nfs-provisioner.
# Setting them means `helmfile apply -l name=cilium`, and rolling the agent DaemonSet is
# how you get two agents writing the BPF LB maps at once (k3s KillMode=process) — the
# dangling-backend DNS outage. Combined peak is only 55m / 448Mi, so the scheduling win
# does not justify it. If you do it, do it in a deliberate window watching
# CiliumAgentDuplicate, not as a side effect. See commit 76af3e5.
kubeProxyReplacement: true

# Every node is a k3s server with its own apiserver on *:6443, and the agent DaemonSet and
# operator both run hostNetwork, so 127.0.0.1 is the local apiserver wherever the pod lands.
# This was hardcoded to worker-00's IP, which made that node a cluster-wide single point of
# failure for Cilium — every agent logged `apiserver not ready` when its k3s restarted.
# A node whose own apiserver is down has no working k3s anyway, so its agent is moot.
k8sServiceHost: "127.0.0.1"
k8sServicePort: "6443"

# Cilium's chart default is maxUnavailable: 2, which on a 3-node cluster tears down
# two thirds of the CNI at once. Roll one node at a time — Renovate bumps the chart
# version in bootstrap/helmfile.yaml, so this applies to every future upgrade too.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1

envoy:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1

ipam:
  mode: kubernetes

loadBalancer:
  algorithm: maglev

l2announcements:
  enabled: true

l2podAnnouncements:
  enabled: true
  interfacePattern: "^(enp2s0|eno1)$"

operator:
  replicas: 1

socketLB:
  enabled: true
  hostNamespaceOnly: false

bpf:
  lbExternalClusterIP: true

hubble:
  enabled: true
  relay:
    enabled: true
    hostNetwork: true
  ui:
    enabled: true
