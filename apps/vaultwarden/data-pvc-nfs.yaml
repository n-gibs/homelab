# nfs and RWX are the point: the database moved to Postgres, so what is left here is
# write-once (rsa_key.pem, config.json, attachments/, sends/) and the pod is free to
# schedule on any node. Restore rsa_key.pem or every client must log in again, though
# no vault data is lost.

# Backed up nightly by vaultwarden-db-backup to
# /mnt/storage/vaultwarden/vaultwarden-db-backup, alongside the pg_dump.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  namespace: vaultwarden
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      storage: 5Gi
