# cilium-operator, hubble-relay and hubble-ui deliberately have NO resource requests, unlike
# their requestless peers elsewhere: setting them rolls the agent DaemonSet, which is how you
# get two agents writing the BPF LB maps at once. Their combined peak is small enough that the
# scheduling win does not justify it. Do it in a deliberate window or not at all.
kubeProxyReplacement: true

# Every node is a k3s server with its own apiserver, and the agent and operator both run
# hostNetwork, so 127.0.0.1 is the local apiserver wherever the pod lands. Naming one node's
# IP instead makes that node a cluster-wide single point of failure for Cilium, and a node
# whose own apiserver is down has no working k3s anyway.
k8sServiceHost: "127.0.0.1"
k8sServicePort: "6443"

# The chart default of maxUnavailable: 2 tears down two thirds of the CNI at once on a
# 3-node cluster. Renovate bumps the chart, so this applies to every future upgrade too.
updateStrategy:
  rollingUpdate:
    maxUnavailable: 1

envoy:
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 1

ipam:
  mode: kubernetes

loadBalancer:
  algorithm: maglev

l2announcements:
  enabled: true

l2podAnnouncements:
  enabled: true
  interfacePattern: "^(enp2s0|eno1)$"

# metricsService rather than the chart's own serviceMonitor: that one is gated on a
# monitoring.coreos.com/v1 capabilities check, and Prometheus arrives later as an ArgoCD app,
# so enabling it here fails the Cilium release and takes the CNI with it on a fresh cluster.
# The ServiceMonitors live in system/monitoring-system/servicemonitor-cilium.yaml.
prometheus:
  enabled: true
  metricsService: true

operator:
  replicas: 1
  prometheus:
    metricsService: true

socketLB:
  enabled: true
  hostNamespaceOnly: false

bpf:
  lbExternalClusterIP: true

hubble:
  enabled: true
  # drop and dns only. `flow`, `tcp` and `http` are per-flow and would dwarf the whole head
  # series count. drop is bounded by namespace pairs at this context setting, and bare `dns`
  # gives rcode/qtype without the `query` label, which is one series per domain name.
  metrics:
    enabled:
      - drop:sourceContext=namespace;destinationContext=namespace
      - dns
  relay:
    enabled: true
    hostNetwork: true
  ui:
    enabled: true
