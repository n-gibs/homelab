---
# Standalone for the same reasons as coredns-ha: no Helm chart, and the generator in
# stack.yaml hardcodes destination.namespace to {{ `{{path.basename}}` }}.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-system-limits
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  destination:
    name: in-cluster
    namespace: kube-system
  project: default
  source:
    repoURL: {{ .Values.gitops.repo }}
    targetRevision: {{ .Values.gitops.revision }}
    path: system/kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
