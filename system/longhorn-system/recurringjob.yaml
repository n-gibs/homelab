---
# Scheduled after the database dumps and the apps' own backups, so each Longhorn backup captures
# fresh archives from inside the volumes. No separate snapshot schedule: a `backup` job snapshots
# on its way, and snapshots live on the volume's own replicas — the one form of protection a node
# failure takes with it. These are crash-consistent, so the apps' own backups still stand.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-backup
  namespace: longhorn-system
spec:
  cron: "30 4 * * *"
  task: backup
  groups:
    - default
  retain: 7
  concurrency: 1
---
# Prometheus left daily-backup with its last backup snapshot still in place. Each trim releases
# the TSDB blocks retention has deleted since, which needs unmapMarkSnapChainRemoved set on that
# Volume. A removed snapshot directly under the volume head never merges away, so only a trim
# can empty it.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-trim
  namespace: longhorn-system
spec:
  cron: "30 5 * * 0"
  task: filesystem-trim
  groups:
    - no-backup
  concurrency: 1
