apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: flaresolverr
  namespace: flaresolverr
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flaresolverr
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        # Chromium peaks near 400Mi on a hard challenge. With the template's 1:2 ratio this
        # floor keeps the limit at 768Mi even when VPA history is thin or reset.
        minAllowed:
          cpu: 100m
          memory: 384Mi
        maxAllowed:
          cpu: 4
          memory: 2Gi
