# Hand-written rather than vendored, and the backup timestamp reads 0 by design:
# see platform/cloudnative-pg/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cnpg
  namespace: cloudnative-pg
  labels:
    grafana_dashboard: "1"
data:
  homelab-cnpg.json: |
    {
      "title": "Homelab — CloudNativePG",
      "uid": "homelab-cnpg",
      "tags": ["homelab", "database"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": { "from": "now-24h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Instances by role",
          "description": "Primary vs replica count per cluster. A cluster missing a primary row has no writable instance.",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "count by (cnpg_io_cluster, cnpg_io_instanceRole) (cnpg_backends_total)",
              "legendFormat": "{{cnpg_io_cluster}} {{cnpg_io_instanceRole}}"
            }
          ],
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "textMode": "value_and_name",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "palette-classic" } },
            "overrides": []
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Manual switchover required",
          "description": "CNPG sets this when it cannot pick a replica to promote automatically. Any cluster showing 1 needs a manual `cnpg promote`.",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(cnpg_collector_manual_switchover_required)"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Replication lag",
          "description": "Max lag per cluster across its replicas.",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max by (cnpg_io_cluster) (cnpg_pg_replication_lag)",
              "legendFormat": "{{cnpg_io_cluster}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Active backends",
          "description": "Backend count per cluster, summed across roles. Includes the metrics exporter's own connection.",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (cnpg_io_cluster) (cnpg_backends_total)",
              "legendFormat": "{{cnpg_io_cluster}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "CNPG-native backups configured",
          "description": "Count of clusters with a completed CNPG-native backup. Reads 0 today because no Cluster here has a `.spec.backup` stanza — CNPG-native backup isn't configured, by design; the real backup path is the per-app pg_dump CronJobs (apps/*/pg-backup.yaml), tracked live on the Homelab — Backups dashboard's \"Oldest DB backup (CNPG-backed apps)\" panel. This one exists so the moment anyone does configure `.spec.backup`, there's already a number watching it instead of a stale claim.",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "count(cnpg_collector_last_available_backup_timestamp > 0)"
            }
          ],
          "options": { "colorMode": "value", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false } },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "noValue": "0"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Cache hit ratio",
          "description": "Share of reads served from shared_buffers rather than disk, per cluster.",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum by (cnpg_io_cluster) (rate(cnpg_cache_hits[5m])) / (sum by (cnpg_io_cluster) (rate(cnpg_cache_hits[5m])) + sum by (cnpg_io_cluster) (rate(cnpg_cache_miss[5m])))",
              "legendFormat": "{{cnpg_io_cluster}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": { "drawStyle": "line", "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }
            },
            "overrides": []
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } }
        }
      ]
    }
