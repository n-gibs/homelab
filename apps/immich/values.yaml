controllers:
  main:
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
    containers:
      main:
        # Chart 0.13.1's appVersion is v3.0.0 and the chart does not release on
        # every Immich release, so the tag is pinned ahead of it here. Valkey is
        # unaffected: its own values section pins its image explicitly.
        # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
        image:
          tag: v3.0.3
        env:
          DB_HOSTNAME: immich-database-rw
          DB_USERNAME: app
          DB_DATABASE_NAME: app
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: immich-database-app
                key: password

immich:
  metrics:
    enabled: false
  persistence:
    library:
      existingClaim: immich-library

valkey:
  enabled: true

machine-learning:
  enabled: false

server:
  enabled: true
  route:
    main:
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Immich"
        gethomepage.dev/description: "Photo and video backup"
        gethomepage.dev/group: "Media"
        gethomepage.dev/icon: "immich.png"
        gethomepage.dev/href: "https://immich.nik-homelab.dev"
        # version 2 because the widget's v1 API shape only applies to Immich < 1.118;
        # we run v3.x. The {{HOMEPAGE_VAR_}} placeholder resolves in annotations, not
        # just in Homepage's own config files — discovered services are run through
        # substituteEnvironmentVars — so the key stays a sealed secret on Homepage's
        # side rather than sitting in plaintext here. It has to be written through a
        # quoted literal because bjw-s runs route annotation values through Helm's
        # tpl, which would otherwise try to evaluate the placeholder itself and fail
        # the render with `function "HOMEPAGE_VAR_IMMICH_API_KEY" not defined`.
        gethomepage.dev/widget.type: "immich"
        gethomepage.dev/widget.url: "http://immich-server.immich.svc.cluster.local:2283"
        gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_IMMICH_API_KEY}}" }}'
        gethomepage.dev/widget.version: "2"
      enabled: true
      kind: HTTPRoute
      hostnames:
        - immich.nik-homelab.dev
      parentRefs:
        - name: homelab
          namespace: envoy-gateway-system
