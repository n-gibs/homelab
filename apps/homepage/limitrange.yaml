apiVersion: v1
kind: LimitRange
metadata:
  name: homepage
  namespace: homepage
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      # No default cpu limit on purpose (see CLAUDE.md), and here raising it is no fix
      # either: homepage is one Node process bursting ~15 widget fetches per page load,
      # so any ceiling stalls the burst until Envoy's route timeout fires.
      default:
        memory: 512Mi
