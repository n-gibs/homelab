apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: jellyfin-api-key
  namespace: jellyfin
spec:
  infisicalAuthRef:
    name: infisical-auth
    namespace: infisical
  syncOptions:
    refreshInterval: 60s
  sources:
    # Same secret Homepage's widget uses -- one API key, one Infisical entry. The
    # /homepage/ prefix is where it already lives; not worth a duplicate.
    - projectSlug: homelab-ef-28
      environmentSlug: prod
      secretPath: /homepage/jellyfin-api-key
  targets:
    - name: jellyfin-api-key
      namespace: jellyfin
      kind: Secret
      creationPolicy: Owner
