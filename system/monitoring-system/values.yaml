# k3s doesn't expose these endpoints
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# etcd runs inside the k3s process rather than as a pod, so the chart's `component: etcd`
# Service selector matches nothing and its ServiceMonitor scrapes an endpointless Service.
# The chart can name static IPs instead (kubeEtcd.endpoints), but it renders them as an
# Endpoints object, and ArgoCD excludes Endpoints and EndpointSlice by kind to keep from
# watching control-plane churn -- so that object is never applied and the pool stays empty.
# scrapeconfig-etcd.yaml addresses the three nodes directly instead.
#
# `enabled` stays true because the chart gates its etcd alert rules on it. Only the Service
# and ServiceMonitor go, and with them the permanently-empty scrape pool.
kubeEtcd:
  enabled: true
  service:
    enabled: false
  serviceMonitor:
    enabled: false

kubelet:
  serviceMonitor:
    relabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        sourceLabels: []
        targetLabel: cluster
        replacement: homelab
    cAdvisorRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        sourceLabels: []
        targetLabel: cluster
        replacement: homelab
    # Chart default drops container_cpu_cfs_throttled_seconds_total here too;
    # keep the rest of the cardinality reduction but preserve that metric for CPU throttling monitoring.
    cAdvisorMetricRelabelings:
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_cpu_(load_average_10s|system_seconds_total|user_seconds_total)'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_memory_(mapped_file|swap)'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_(file_descriptors|tasks_state|threads_max)'
      - sourceLabels: [__name__, scope]
        action: drop
        regex: 'container_memory_failures_total;hierarchy'
      - sourceLabels: [__name__, interface]
        action: drop
        regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_spec.*'
      - sourceLabels: [id, pod]
        action: drop
        regex: '.+;'

prometheusOperator:
  # Trivial on their own (7-day peak 0m / 20Mi each), but these two sidecars were part of
  # the seventeen requestless containers that made worker-00 look empty to the scheduler.
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi

kube-state-metrics:
  prometheus:
    monitor:
      relabelings:
        - action: replace
          sourceLabels: []
          targetLabel: cluster
          replacement: homelab
  # KSM's default ClusterRole has no business with Infisical CRs; extend it rather
  # than replace it so the chart's own rules (pods, nodes, etc.) stay intact.
  # No apiextensions.k8s.io/customresourcedefinitions rule here: the chart already
  # grants that itself whenever customResourceState.enabled is true (verified in the
  # rendered ClusterRole) — adding it again would just be redundant, not additive.
  rbac:
    extraRules:
      - apiGroups: ["secrets.infisical.com"]
        resources: ["infisicalstaticsecrets"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: secrets.infisical.com
              version: v1beta1
              kind: InfisicalStaticSecret
            labelsFromPath:
              name: [metadata, name]
              namespace: [metadata, namespace]
            metrics:
              - name: infisical_secret_last_sync_timestamp_seconds
                help: Unix time of the operator's last successful reconcile of this secret
                each:
                  type: Gauge
                  gauge:
                    # Find-by-key path, not a type label filter: the CR carries four
                    # conditions and only this one's message is a timestamp — the other
                    # three are prose and would fail timestamp parsing.
                    path: [status, conditions, "[type=secrets.infisical.com/LastSuccessfulReconcileAt]"]
                    valueFrom: [message]

prometheus-node-exporter:
  # The chart ships resources: {}, which left all three pods BestEffort.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  # Points the textfile collector at what smart-temp-textfile.timer writes (see
  # ansible/roles/common). No new volume: the chart already bind-mounts / at /host/root.
  #
  # The two filesystem excludes are the chart's own defaults, repeated verbatim because
  # Helm replaces lists rather than merging — without them node-exporter would scrape
  # every container overlay and kubelet bind mount. Re-check on a chart bump.
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector
  prometheus:
    monitor:
      relabelings:
        - action: replace
          sourceLabels: []
          targetLabel: cluster
          replacement: homelab

prometheus:
  prometheusSpec:
    # The cluster's largest consumer shipped requestless, so the scheduler saw a free pod
    # and parked it on the 4-core node while it used 179m / 2.9Gi. Memory is 3Gi rather
    # than trimmed to that peak because a TSDB's working set grows with retention and
    # series count.
    #
    # No limits, deliberately: a memory limit on a TSDB turns a slow query into an OOMKill
    # that loses the WAL, and this pod is the alerting path.
    resources:
      requests:
        cpu: 250m
        memory: 3Gi
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: nfs
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

grafana:
  enabled: true
  service:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Grafana"
      gethomepage.dev/description: "Metrics & dashboards"
      gethomepage.dev/group: "Infrastructure"
      gethomepage.dev/icon: "grafana.png"
      gethomepage.dev/href: "https://grafana.nik-homelab.dev"
  adminPassword: changeme  # override via secret in production
  grafana.ini:
    server:
      root_url: "%(protocol)s://grafana.nik-homelab.dev"
      serve_from_sub_path: false
    auth.anonymous:
      enabled: true
      org_role: Admin
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.loki.svc.cluster.local:3100

alertmanager:
  alertmanagerSpec:
    # 7-day peak 14m / 46Mi. Small, but it shipped requestless like the rest, which is how
    # it ended up co-located with Prometheus on the 4-core node.
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
    secrets:
      - ntfy-webhook-url
      - deadmanssnitch-url
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: ['namespace']
      - target_matchers: ['alertname = InfoInhibitor']
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        # Dead-man's switch. Watchdog fires continuously while the alerting path is healthy,
        # so healthchecks.io alerting on the ABSENCE of these pings is what catches a broken
        # alerting path. Don't pin hc-ping.com's IP — if cluster DNS breaks, the ping
        # stopping IS the signal.
        # group_interval must be well under repeat_interval: the dispatcher only re-evaluates
        # on group_interval ticks, so 5m/5m yields a ping every 10m, not 5m (measured).
        - receiver: 'deadmanssnitch'
          matchers: ['alertname = "Watchdog"']
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 5m
        # Criticals re-notify hourly instead of inheriting the 12h below. Must stay ABOVE the
        # warning|critical route — routes match in order and the broader one would swallow it.
        # Delivery half of prometheusrule-alert-escalation.yaml, which turns a warning firing
        # >2h into a critical.
        # group_by overrides the top-level ['namespace'] because node-level alerts carry no
        # namespace label: without alertname/escalated_alert every namespace-less alert
        # collapses into one group sharing a single repeat_interval timer.
        - receiver: 'ntfy'
          matchers: ['severity = "critical"']
          group_by: ['alertname', 'escalated_alert', 'namespace']
          repeat_interval: 1h
        - receiver: 'ntfy'
          matchers: ['severity =~ "warning|critical"']
          continue: false
    receivers:
      - name: 'null'
      - name: 'deadmanssnitch'
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/deadmanssnitch-url/url
            send_resolved: false
      - name: 'ntfy'
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/ntfy-webhook-url/url
            send_resolved: true
            # ntfy 400s (code 40041) once the rendered message exceeds 4096 bytes, and
            # Alertmanager treats that as unrecoverable -- so delivery breaks during a
            # storm, when the batch is biggest. Truncating keeps the notification;
            # truncatedAlerts carries the dropped count. Lower this if a 400 recurs: the
            # rendered size depends on the ntfy-side template, which is not in this repo.
            max_alerts: 5
    templates:
      - '/etc/alertmanager/config/*.tmpl'
