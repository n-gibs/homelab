---
# G9: k3s server + worker, no control-plane taint. homelab.io/media attracts media
# workloads; homelab.io/ingress is the L2 announcer set worker-02 shares (see
# system/envoy-gateway/envoyproxy.yaml). Deliberately no --node-taint: a taint only
# repels, and it just left the highest-RAM node idle.

# --node-label applies at kubelet registration only, so this does not label an existing
# node on a k3s restart. Label it once by hand.
extra_server_args: >-
  {{ common_server_flags }}
  --node-label homelab.io/media=true
  --node-label homelab.io/ingress=true
