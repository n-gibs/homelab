image:
  tag: v1.13.2

enableRbac: true
serviceAccount:
  create: true

extraClusterRoles:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
      - gateways
    verbs:
      - get
      - list
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "home.nik-homelab.dev"
  - name: HOMEPAGE_VAR_SONARR_API_KEY
    valueFrom:
      secretKeyRef:
        name: arr-api-keys
        key: SONARR_API_KEY
  - name: HOMEPAGE_VAR_RADARR_API_KEY
    valueFrom:
      secretKeyRef:
        name: arr-api-keys
        key: RADARR_API_KEY
  - name: HOMEPAGE_VAR_LIDARR_API_KEY
    valueFrom:
      secretKeyRef:
        name: arr-api-keys
        key: LIDARR_API_KEY
  - name: HOMEPAGE_VAR_ARGOCD_API_KEY
    valueFrom:
      secretKeyRef:
        name: argocd-api-key
        key: ARGOCD_API_KEY
  - name: HOMEPAGE_VAR_IMMICH_API_KEY
    valueFrom:
      secretKeyRef:
        name: immich-api-key
        key: IMMICH_API_KEY
  - name: HOMEPAGE_VAR_JELLYFIN_API_KEY
    valueFrom:
      secretKeyRef:
        name: jellyfin-api-key
        key: JELLYFIN_API_KEY
  - name: HOMEPAGE_VAR_QBITTORRENT_USERNAME
    valueFrom:
      secretKeyRef:
        name: qbittorrent-local-creds
        key: QBITTORRENT_USERNAME
  - name: HOMEPAGE_VAR_QBITTORRENT_PASSWORD
    valueFrom:
      secretKeyRef:
        name: qbittorrent-local-creds
        key: QBITTORRENT_PASSWORD
  - name: HOMEPAGE_VAR_NAVIDROME_USER
    valueFrom:
      secretKeyRef:
        name: navidrome-homepage-token
        key: user
  - name: HOMEPAGE_VAR_NAVIDROME_TOKEN
    valueFrom:
      secretKeyRef:
        name: navidrome-homepage-token
        key: token
  - name: HOMEPAGE_VAR_NAVIDROME_SALT
    valueFrom:
      secretKeyRef:
        name: navidrome-homepage-token
        key: salt

config:
  settings:
    title: Homelab
    theme: dark
    color: slate
    headerStyle: boxedWidgets
    target: _blank
    statusStyle: dot
    # Off so link-only tiles (Bazarr, Prowlarr, Cleanuparr, Nextcloud, Vaultwarden,
    # Longhorn, Infisical) collapse to one row instead of matching the tallest widget
    # card in the group. Rows go ragged in exchange.
    useEqualHeights: false
    # The browser fetches this, not the pod, so no cluster egress and no images volume to mount.
    # Bare-string form rather than the background: {image, ...} map — cardBlur is incompatible
    # with background filters, so frosted cards means no dimming. This image is dark enough.
    background: https://images.unsplash.com/photo-1496715976403-7e36dc43f17b?auto=format&fit=crop&w=2560&q=80
    cardBlur: sm
    # Only place group icons and column counts can be set. Homepage takes group display
    # order from key order here, but the chart renders this map through toYaml, which sorts
    # keys — so order is alphabetical and not controllable from values.yaml. Calendar gets
    # its own single-column group so the agenda renders full width; it sorts last anyway.
    layout:
      Upcoming:
        style: row
        columns: 1
        icon: mdi-calendar
      Media:
        style: row
        columns: 3
        icon: mdi-play-circle
      Infrastructure:
        style: row
        columns: 3
        icon: mdi-server

    providers:
      longhorn:
        url: http://longhorn-frontend.longhorn-system.svc.cluster.local

  kubernetes:
    mode: cluster
    gateway: true

  widgets:
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
    - openmeteo:
        label: Home
        latitude: 32.80626271655686
        longitude: -117.2240939981718
        timezone: America/Los_Angeles
        units: imperial
        cache: 5
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - longhorn:
        expanded: true
        total: true
        labels: true
        nodes: true
    - search:
        provider: duckduckgo
        target: _blank

  services:
    - Media:
        - Sonarr:
            href: https://sonarr.nik-homelab.dev
            description: TV shows
            icon: sonarr.png
            widget:
              type: sonarr
              url: http://sonarr.sonarr.svc.cluster.local:8989
              key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
        - Radarr:
            href: https://radarr.nik-homelab.dev
            description: Movies
            icon: radarr.png
            widget:
              type: radarr
              url: http://radarr.radarr.svc.cluster.local:7878
              key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
        - Lidarr:
            href: https://lidarr.nik-homelab.dev
            description: Music
            icon: lidarr.png
            widget:
              type: lidarr
              url: http://lidarr.lidarr.svc.cluster.local:8686
              key: "{{HOMEPAGE_VAR_LIDARR_API_KEY}}"
        - Navidrome:
            href: https://navidrome.nik-homelab.dev
            description: Music streaming
            icon: navidrome.png
            widget:
              type: navidrome
              url: http://navidrome.navidrome.svc.cluster.local:4533
              user: "{{HOMEPAGE_VAR_NAVIDROME_USER}}"
              token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"
              salt: "{{HOMEPAGE_VAR_NAVIDROME_SALT}}"
        # Defined here rather than by HTTPRoute annotation: the widget needs WebUI
        # credentials, and annotations are plaintext in git and skip HOMEPAGE_VAR
        # substitution. namespace/app restore the status dot discovery gave for free.
        - qBittorrent:
            href: https://qbittorrent.nik-homelab.dev
            description: Torrent client
            icon: qbittorrent.png
            namespace: qbittorrent
            app: qbittorrent
            widget:
              type: qbittorrent
              url: http://qbittorrent.qbittorrent.svc.cluster.local:8080
              username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
              password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
        # Link only: seedit4.me fronts the WebUI with nginx basic auth. The widget has
        # no headers field, and userinfo in the URL does not survive Node's
        # http.request the way it does in curl -- nginx still answers 401.
        - Seedbox:
            href: https://203.nl137.seedit4.me/qbittorrent/
            description: qBittorrent on the seedbox
            icon: qbittorrent.png
    - Upcoming:
        - Calendar:
            description: Releases across the arr stack
            icon: mdi-calendar
            widget:
              type: calendar
              view: agenda
              maxEvents: 10
              showTime: true
              timezone: America/Los_Angeles
              integrations:
                - type: sonarr
                  service_group: Media
                  service_name: Sonarr
                  color: teal
                - type: radarr
                  service_group: Media
                  service_name: Radarr
                  color: amber
                - type: lidarr
                  service_group: Media
                  service_name: Lidarr
                  color: purple
    - Infrastructure:
        - ArgoCD:
            href: https://argocd.nik-homelab.dev
            description: GitOps CD
            icon: argo-cd.png
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local
              key: "{{HOMEPAGE_VAR_ARGOCD_API_KEY}}"
        - Grafana:
            href: https://grafana.nik-homelab.dev
            description: Metrics & dashboards
            icon: grafana.png
            widget:
              type: grafana
              version: 2
              url: http://monitoring-system-grafana.monitoring-system.svc.cluster.local
              username: admin
              password: changeme
        # Reads a recording rule from system/monitoring-system/prometheusrule-temperature.yaml,
        # which also keeps this URL short enough to review. Headroom, not raw temperature: the
        # hardware disagrees about what hot means. dynamic-list names each row from
        # metric.sensor_name, so the display does not depend on series order.
        - Temperatures:
            href: https://grafana.nik-homelab.dev/d/homelab-temperatures
            description: Thermal headroom per sensor
            icon: mdi-thermometer
            widget:
              type: customapi
              url: http://prometheus-operated.monitoring-system.svc.cluster.local:9090/api/v1/query?query=sort(node:temperature_headroom_celsius:min)
              # Matches the SMART reading behind it, which only updates every two minutes.
              refreshInterval: 60000
              display: dynamic-list
              # suffix/format are undocumented for dynamic-list but work — it passes mappings to
              # the same formatValue() the block display uses. Nothing in customapi can colour a
              # row, so the threshold lives in the wording.
              mappings:
                items: data.result
                name: metric.sensor_name
                label: value.1
                format: number
                suffix: "C to limit"

  bookmarks: []
