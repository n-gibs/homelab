apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config-local
  namespace: bazarr
  # No sync-wave annotation -- see the local-path note in CLAUDE.md. Superseded by
  # bazarr-config below; scheduled for deletion.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bazarr-config
  namespace: bazarr
spec:
  accessModes:
    - ReadWriteOnce
  # /config holds bazarr.db (SQLite, WAL) -- longhorn per the CLAUDE.md storage rule.
  # Backup: Bazarr's own Settings -> Scheduler, writing to /data/backups/bazarr.
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
