apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-local
  namespace: jellyfin
  # No sync-wave annotation -- see the local-path note in CLAUDE.md. Superseded by
  # jellyfin-config below; scheduled for deletion.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: jellyfin
spec:
  accessModes:
    - ReadWriteOnce
  # jellyfin.db is SQLite -- longhorn per the CLAUDE.md storage rule. This buys
  # replication, not mobility: the nodeSelector and the i915 request still pin the pod.
  # Backup: jellyfin-db-backup calling Jellyfin's own /Backup/Create onto NFS. Restore
  # with `--restore-archive /config/data/data/backups/<newest>.zip`.

  # Sized for Jellyfin 10.11's 2GiB-free startup check, not for growth -- too small a
  # volume aborts startup while s6 keeps the container reporting Running.

  # /config/network.xml is UI state living only here. After a rebuild from empty,
  # re-enter both under Dashboard -> Networking or clients are silently seen as LAN:
  # KnownProxies = 10.42.0.0/16 (empty discards XFF), and LocalNetworkSubnets =
  # 192.168.10.0/24,192.168.30.0/24 (empty falls back to all of RFC1918).
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
