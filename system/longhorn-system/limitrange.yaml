# Instance managers and CSI sidecars ship requestless, so the scheduler sees this
# namespace's ~1.4Gi as free; the chart's resources knob reaches longhornManager only, so a
# namespace default is the only lever. defaultRequest only, never a limit: capping an
# instance manager's memory turns reclaimable page cache into an OOMKill of a live replica.
apiVersion: v1
kind: LimitRange
metadata:
  name: longhorn-default-mem-request
  namespace: longhorn-system
spec:
  limits:
    - type: Container
      defaultRequest:
        memory: 128Mi
