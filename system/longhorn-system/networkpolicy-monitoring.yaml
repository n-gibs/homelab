# The chart's own longhorn-manager NetworkPolicy admits only Longhorn components, which
# blackholes every Prometheus scrape and leaves the alerts evaluating against no data. Its
# networkPolicies.enabled flag does not gate those templates, so values.yaml cannot fix it.
# Policies are additive: this grants the one port Prometheus needs and leaves isolation intact.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: longhorn-manager-allow-monitoring
  namespace: longhorn-system
spec:
  podSelector:
    matchLabels:
      app: longhorn-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring-system
      ports:
        - protocol: TCP
          port: 9500
