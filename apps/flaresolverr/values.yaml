controllers:
  main:
    containers:
      app:
        # renovate: datasource=docker depName=ghcr.io/flaresolverr/flaresolverr
        image:
          repository: ghcr.io/flaresolverr/flaresolverr
          tag: v3.5.0
        env:
          TZ: America/Los_Angeles
          LOG_LEVEL: info
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "2"
            memory: 1Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 8191
