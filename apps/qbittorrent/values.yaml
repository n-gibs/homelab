controllers:
  main:
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
    initContainers:
      fix-perms:
        image:
          repository: busybox
          tag: latest
        command:
          - sh
          - -c
          - chmod -R 777 /data/downloads /data/media
        securityContext:
          runAsUser: 0
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/qbittorrent
          tag: latest
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Los_Angeles
          WEBUI_PORT: "8080"
        resources:
          requests:
            cpu: 200m
          limits:
            cpu: "2"
      gluetun:
        image:
          repository: qmcgaw/gluetun
          tag: latest
        env:
          VPN_SERVICE_PROVIDER: mullvad
          VPN_TYPE: wireguard
          TZ: America/Los_Angeles
          FIREWALL_OUTBOUND_SUBNETS: "10.0.0.0/8,192.168.0.0/16"
          # 9999 is gluetun's health server, exposed so Cleanuparr's Queue Cleaner can
          # gate on "is the tunnel up" rather than "is the internet up". A dead Mullvad
          # tunnel stalls every torrent at once, which Queue Cleaner would otherwise
          # read as a queue full of stalled downloads and strike them all.
          FIREWALL_INPUT_PORTS: "8080,6881,9999"
          SERVER_COUNTRIES: "USA"
          WIREGUARD_ALLOWED_IPS: "0.0.0.0/0"
          DNS_SERVER: "off"
          DNS_UPSTREAM_RESOLVER_TYPE: "plain"
          DNS_UPSTREAM_PLAIN_ADDRESSES: "10.43.0.10:53"
          WIREGUARD_MTU: "1170"
          WIREGUARD_IMPLEMENTATION: userspace
          # Defaults to 127.0.0.1:9999 -- loopback inside the pod's network namespace,
          # so nothing outside the pod can reach it. Bind to all interfaces instead.
          HEALTH_SERVER_ADDRESS: "0.0.0.0:9999"
        envFrom:
          - secretRef:
              name: gluetun-vpn-creds
        securityContext:
          capabilities:
            add:
              - NET_ADMIN

service:
  main:
    controller: main
    ports:
      http:
        port: 8080
      # gluetun's health server. Consumed by Cleanuparr's connectivity check at
      # http://qbittorrent.qbittorrent.svc.cluster.local:9999 -- not routed publicly.
      health:
        port: 9999

route:
  main:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "qBittorrent"
      gethomepage.dev/description: "Torrent client"
      gethomepage.dev/group: "Media"
      gethomepage.dev/icon: "qbittorrent.png"
      gethomepage.dev/href: "https://qbittorrent.nik-homelab.dev"
    enabled: true
    kind: HTTPRoute
    hostnames:
      - qbittorrent.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system
    # Pin the backend port. The chart only autodetects the *service*, not the port --
    # it takes whichever port sorts first, so adding the `health` port silently
    # repointed this route at 9999 and broke the WebUI. Explicit from now on.
    rules:
      - backendRefs:
          - identifier: main
            port: 8080

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: nfs
    size: 1Gi
    accessMode: ReadWriteMany
    advancedMounts:
      main:
        app:
          - path: /config
  data:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage
    advancedMounts:
      main:
        fix-perms:
          - path: /data
        app:
          - path: /data
