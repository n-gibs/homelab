server:
  # Measured 7-day peak 20m / 71Mi. Keep this inside the existing server block — adding a
  # second top-level `server:` key silently wins over the first in YAML, which drops the
  # annotations, ingress and httproute config below and deletes the ArgoCD HTTPRoute.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  service:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "ArgoCD"
      gethomepage.dev/description: "GitOps CD"
      gethomepage.dev/group: "Infrastructure"
      gethomepage.dev/icon: "argocd.png"
      gethomepage.dev/href: "https://argocd.nik-homelab.dev"
  ingress:
    enabled: false
  httproute:
    enabled: true
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system
    hostnames:
      - argocd.nik-homelab.dev

# The application-controller already listens on :8082 (--metrics-port=8082); this only
# puts a Service in front of it so Prometheus has something to scrape. Without it there
# is no argocd_app_info, and an alert on ArgoCD sync state silently never fires.
# The matching ServiceMonitor deliberately lives in system/monitoring-system/ rather than
# here: `controller.metrics.serviceMonitor.enabled` needs the Prometheus Operator CRDs,
# which don't exist yet at bootstrap time (ArgoCD installs before monitoring-system), so
# enabling it here would break a from-scratch `just bootstrap`.
controller:
  metrics:
    enabled: true
  # Resource requests for this and every component below.
  #
  # All seven ArgoCD components shipped with no requests at all, and all seven landed on
  # worker-00 — a 4-core node, against 12 cores each on worker-01 and worker-02. That is
  # the mechanism, not a coincidence: kube-scheduler scores nodes on *requested*
  # resources, so a container with no request looks free everywhere, scoring collapses to
  # a near-tie, and placement is effectively arbitrary. Nothing rebalances afterwards, so
  # wherever a pod landed at bootstrap is where it stays. worker-00 reported 24% of its
  # CPU as requested while actually serving 60% of the cluster's real CPU load.
  #
  # Values are 7-day peak usage from Prometheus (max_over_time of the 5m rate), rounded
  # up — not guesses. Measured peaks: controller 164m/730Mi, repo-server 93m/151Mi,
  # server 20m/71Mi, redis 9m/35Mi, dex 1m/118Mi, applicationset 1m/58Mi,
  # notifications 0m/90Mi.
  #
  # Requests only, no limits. A CPU limit would throttle the controller mid-reconcile for
  # no benefit on a homelab with 28 cores and ~2.5 of them requested, and a memory limit
  # turns a slow sync into an OOMKill.
  resources:
    requests:
      cpu: 200m
      memory: 768Mi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 192Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

dex:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi

notifications:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi

configs:
  params:
    server.insecure: true  # TLS terminated at gateway
    controller.diff.server.side: "true"  # cancel CRD-defaulted fields (Gateway API drift)
  cm:
    users.anonymous.enabled: "true"
    accounts.readonly: apiKey
  rbac:
    policy.default: "role:admin"
    policy.csv: "g, readonly, role:readonly"
