apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jellyfin
  updatePolicy:
    updateMode: "Recreate"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          # 1 core, not the 100m template default: jellyfin idles between streams, so
          # VPA's recommendation sat on the floor and the scheduler reserved 100m for a
          # workload that needs several cores the moment someone presses play.
          cpu: "1"
          memory: 256Mi
        maxAllowed:
          cpu: 8
          memory: 8Gi
