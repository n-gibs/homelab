---
# CNPG PVCs are local-path, so node-failure durability comes from streaming replication rather
# than the volume: a cluster down to one replica still serves normally with no surviving copy of
# the data. Requires podmonitor.yaml. Aggregations are `by (namespace)` because this repo runs
# one cluster per namespace; switch to `by (cnpg_io_cluster)` if that changes.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg
  namespace: cloudnative-pg
  labels:
    release: monitoring-system
spec:
  groups:
    - name: cnpg
      rules:
        # Only the primary reports this (replicas report 0), so max picks it without
        # knowing which pod it is -- and if the primary itself vanishes the max collapses
        # to 0 and this still fires rather than going quiet.
        - alert: CNPGReplicationDegraded
          expr: max by (namespace) (cnpg_pg_replication_streaming_replicas) < 2
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} Postgres has fewer than 2 streaming replicas"
            description: >-
              The primary reports {{ $value }} streaming replicas instead of 2. The data
              now exists on fewer nodes than intended, and CNPG volumes are local-path so
              losing the wrong node loses the database. Check
              `kubectl -n {{ $labels.namespace }} get cluster`.

        # A missing pod stops producing series, so count what is left. All four clusters
        # are 3 instances. If every instance of one cluster goes at once that namespace
        # has no series and this cannot fire -- KubePodNotReady and CNPGMetricsMissing
        # cover that.
        - alert: CNPGInstancesMissing
          expr: count by (namespace) (cnpg_collector_up) < 3
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.namespace }} Postgres is reporting only {{ $value }} of 3 instances"
            description: >-
              An instance has not been scraped for 15m. On local-path volumes it cannot
              move to another node, so a node problem holds it down until the node returns.

        - alert: CNPGReplicationLagHigh
          expr: max by (namespace) (cnpg_pg_replication_lag) > 300
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} Postgres replication is {{ $value }}s behind"
            description: >-
              A replica is over 5 minutes behind. Still streaming, so not yet
              CNPGReplicationDegraded, but a failover now would lose the unreplayed tail.

        # The exporter runs inside the pod and talks to its own Postgres, so this catches
        # a pod that is alive while its database is not answering.
        - alert: CNPGCollectorDown
          expr: cnpg_collector_up == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.cluster }} instance {{ $labels.pod }} is not answering its metrics collector"
            description: >-
              Every other expression here is blind to this instance. Check
              `kubectl -n {{ $labels.namespace }} logs {{ $labels.pod }} -c postgres`.

        # CNPG waits indefinitely for this, so without an alert it waits forever.
        - alert: CNPGManualSwitchoverRequired
          expr: cnpg_collector_manual_switchover_required > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} Postgres is waiting for a manual switchover"
            description: >-
              CloudNativePG needs a switchover performed by hand. See
              `kubectl -n {{ $labels.namespace }} describe cluster`.

        # Postgres force-stops writes near 2^31. These databases sit around 1e2, so this
        # only fires if autovacuum has genuinely stopped freezing.
        - alert: CNPGTransactionIDWraparoundRisk
          expr: max by (namespace, datname) (cnpg_pg_database_xid_age) > 1.5e9
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} database {{ $labels.datname }} transaction ID age is {{ $value }}"
            description: >-
              Autovacuum is not freezing rows. Investigate long-running transactions and
              stuck replication slots holding back the freeze horizon.

        # A cluster emitting no replication series is invisible to a threshold comparison, not
        # healthy: an exporter that loses CONNECT on the app database fails every per-database
        # query while cnpg_collector_up still reads 1. Hence `unless` rather than a comparison.
        # Fix is a grant -- see platform/cloudnative-pg/README.md.
        - alert: CNPGReplicationMetricsMissing
          expr: >-
            count by (namespace) (cnpg_collector_up)
            unless count by (namespace) (cnpg_pg_replication_streaming_replicas)
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }} Postgres reports no replication metrics"
            description: >-
              Instances are scraped but emit no cnpg_pg_replication_* series, so
              CNPGReplicationDegraded and CNPGReplicationLagHigh cannot fire for this
              cluster. Usually the exporter has lost CONNECT on the application database.

        # Every rule above reads a metric that stops existing if the PodMonitor breaks, and
        # an absent series cannot breach a threshold -- so this file would go silent
        # exactly when it stopped working.
        - alert: CNPGMetricsMissing
          expr: absent(cnpg_collector_up)
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: No CloudNativePG metrics are being reported
            description: >-
              cnpg_collector_up has had no series for an hour, so every CNPG alert is
              silent across all four clusters. Check podmonitor.yaml, Prometheus
              PodMonitor discovery, and the operator's cnpg-default-monitoring ConfigMap.
