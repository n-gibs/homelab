controllers:
  main:
    # longhorn is ReadWriteOnce, and two Jellyfins must never open the same SQLite
    # database: the old pod has to be gone before the new one starts.
    strategy: Recreate
    pod:
      nodeSelector:
        homelab.io/media: "true"
      securityContext:
        # render (991) and video (44) own the DRI devices; the container runs as uid 1000.
        supplementalGroups: [991, 44]
    containers:
      app:
        # renovate: datasource=docker depName=ghcr.io/linuxserver/jellyfin versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)ubu(?<build>\d+)-ls(?<revision>\d+)$
        image:
          repository: lscr.io/linuxserver/jellyfin
          tag: 10.11.11ubu2604-ls43
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Los_Angeles
        # Static, not VPA-managed. Jellyfin's demand is bimodal (idle vs transcode) and VPA
        # only sizes for what it has already seen, so a transcode starting after a quiet
        # stretch gets sized against idle and ffmpeg is OOM-killed before VPA catches up.
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            # QuickSync, advertised by system/intel-gpu-plugin. Requesting the resource is
            # what gets renderD128 past containerd's device cgroup; mounting it does not.
            gpu.intel.com/i915: 1
            # 4Gi against a ~630Mi anon working set: the rest is page cache. Segments are
            # written at the transcode's target bitrate and every dirty page is charged to
            # this cgroup until writeback drains, so the headroom is what keeps reclaim
            # ahead of the writer. That is what 1536Mi did not have.
            memory: 4Gi
          # No cpu limit on purpose -- see limitrange.yaml.

service:
  main:
    controller: main
    ports:
      http:
        port: 8096

route:
  main:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Jellyfin"
      gethomepage.dev/description: "Media server"
      gethomepage.dev/group: "Media"
      gethomepage.dev/icon: "jellyfin.png"
      gethomepage.dev/href: "https://jellyfin.nik-homelab.dev"
      gethomepage.dev/widget.type: "jellyfin"
      gethomepage.dev/widget.url: "http://jellyfin.jellyfin.svc.cluster.local:8096"
      # Outer tpl escape: Homepage substitutes the placeholder at runtime, Helm must not touch it.
      gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}" }}'
      # No `version` — that's for Jellyfin >= 10.12; we run 10.11.x, which wants v1 (default).
      gethomepage.dev/widget.enableBlocks: "true"
    enabled: true
    kind: HTTPRoute
    hostnames:
      - jellyfin.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system
    # Envoy's 15s default route timeout kills remote playback: off-LAN clients are
    # transcoded, and Jellyfin holds an HLS segment request until ffmpeg reaches it.
    rules:
      - backendRefs:
          - identifier: main
        matches:
          - path:
              type: PathPrefix
              value: /
        timeouts:
          request: 300s

persistence:
  config:
    # longhorn, not nfs -- jellyfin.db is SQLite and SQLite over NFS deadlocks.
    # See config-pvc.yaml for the rationale and the restore path. Defined as its
    # own manifest so the comment lives with the volume.
    existingClaim: jellyfin-config
    globalMounts:
      - path: /config
  # Jellyfin writes backups to <datadir>/backups, which is /config/data/data/backups
  # in the linuxserver image (verified against the Path in GET /Backup). Mounting the
  # NFS share there puts the archives on a different disk from the Longhorn config
  # volume they protect, without making the rest of /data writable.
  backups:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage/backups/jellyfin
    globalMounts:
      - path: /config/data/data/backups
  data:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage
    globalMounts:
      - path: /data
        readOnly: true
  # Keeps HLS segments off the config volume, which a single long transcode can fill until
  # every jellyfin.db write returns SQLite error 13. Mounted at /config/cache, not
  # /config/cache/transcodes: the image's init `lsiown`s /config/* with a one-level glob, and an
  # emptyDir mounts root:root, so a deeper mount point leaves uid 1000 unable to write segments.
  cache:
    type: emptyDir
    # Derived data, so losing it on restart costs only a lazy rebuild. Overshoots the concurrent
    # transcode footprint deliberately: exceeding sizeLimit evicts the pod mid-stream, while the
    # headroom costs disk worker-01 has spare.
    sizeLimit: 16Gi
    globalMounts:
      - path: /config/cache
