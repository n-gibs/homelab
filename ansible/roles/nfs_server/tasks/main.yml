---
- name: Install NFS server packages
  ansible.builtin.apt:
    name:
      - nfs-kernel-server
      - nfs-common
    state: present
  become: true

- name: Create NFS export directory
  ansible.builtin.file:
    path: "{{ nfs_export_path }}"
    state: directory
    mode: "0755"
    owner: nobody
    group: nogroup
  become: true

- name: Mount external drive by UUID
  ansible.posix.mount:
    path: "{{ nfs_export_path }}"
    src: "UUID={{ nfs_drive_uuid }}"
    fstype: xfs
    opts: "{{ nfs_mount_options }}"
    state: mounted
  become: true

- name: Configure NFS export
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "{{ nfs_export_path }} {{ nfs_allowed_clients }}(rw,sync,no_subtree_check,no_root_squash)"
    create: true
    mode: "0644"
  become: true
  notify: Re-export NFS shares

- name: Enable and start NFS server
  ansible.builtin.service:
    name: nfs-kernel-server
    enabled: true
    state: started
  become: true
