apiVersion: v1
kind: LimitRange
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  limits:
    - type: Container
      # 50m, not jellyfin's own 1.5: this only reaches containers that declare no request,
      # and worker-00 has 4 allocatable cores to share.
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      # No default cpu limit on purpose: VPA would drag the ceiling down with the request.
      # See the LimitRange rule in CLAUDE.md.
      default:
        memory: 512Mi
