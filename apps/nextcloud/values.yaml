nextcloud:
  host: nextcloud.nik-homelab.dev          # also templates NEXTCLOUD_TRUSTED_DOMAINS
  # Top-level, not the default /var/www/html/data — that would nest the NFS data
  # volume inside the local-path app-tree volume. Files still land at
  # /mnt/storage/nextcloud/data.
  datadir: /nc-data
  existingSecret:
    enabled: true
    secretName: nextcloud-admin
    usernameKey: username
    passwordKey: password
  defaultConfigs:
    # No Redis, so don't let the chart write a Redis config at all.
    redis.config.php: false
  # fsGroup does not apply to NFS volumes, so without this chown the entrypoint
  # cannot write the data dir. Volume name is a chart literal, not release-templated.
  extraInitContainers:
    - name: fix-data-perms
      image: busybox:1.38
      command: ["sh", "-c", "mkdir -p /nc/data && chown 33:33 /nc /nc/data"]
      volumeMounts:
        - name: nextcloud-data
          mountPath: /nc
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 64Mi
  phpConfigs:
    uploads.ini: |
      upload_max_filesize = 4G
      post_max_size = 4G
      memory_limit = 1G
      max_execution_time = 3600
  configs:
    previews.config.php: |-
      <?php
      $CONFIG = array (
        'enable_previews' => true,
        'enabledPreviewProviders' => array (
          'OC\Preview\PNG',
          'OC\Preview\JPEG',
          'OC\Preview\GIF',
          'OC\Preview\HEIC',
          'OC\Preview\TXT',
          'OC\Preview\MarkDown',
          'OC\Preview\PDF'
        ),
      );
    # A config file, not NEXTCLOUD_TRUSTED_DOMAINS — that env var is only honoured
    # on the initial install. The service DNS entry is what the metrics exporter
    # uses; drop it and its requests get HTTP 400 "untrusted domain".
    trusted_domains.config.php: |-
      <?php
      $CONFIG = array (
        'trusted_domains' => array (
          'localhost',
          'nextcloud.nik-homelab.dev',
          'nextcloud.nextcloud.svc.cluster.local'
        ),
      );

  # Envoy terminates TLS and forwards plain HTTP, so without these Nextcloud
  # generates http:// URLs — the symptom is a login that hangs on a 303 to an
  # http:// Location the browser won't follow.
  extraEnv:
    # URLs for cron, emails and share links. Default is http://localhost.
    - name: OVERWRITECLIURL
      value: https://nextcloud.nik-homelab.dev
    # Honour X-Forwarded-For so logs and brute-force protection see the real
    # client IP, not an Envoy pod IP.
    - name: TRUSTED_PROXIES
      value: 10.42.0.0/16

# Sets OVERWRITEPROTOCOL=https — same reverse-proxy fix as the extraEnv above.
phpClientHttpsFix:
  enabled: true

internalDatabase:
  enabled: false

externalDatabase:
  enabled: true
  type: postgresql
  # CNPG's generated secret maps 1:1 onto the chart's keys — no sealed secret needed.
  existingSecret:
    enabled: true
    secretName: nextcloud-database-app
    usernameKey: username
    passwordKey: password
    hostKey: host
    databaseKey: dbname

redis:
  enabled: false
mariadb:
  enabled: false
collabora:
  enabled: false
imaginary:
  enabled: false

metrics:
  enabled: true
  https: false
  # Only feed the two chart alerts declined below, so don't poll for them.
  info:
    apps: false
    update: false
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

prometheus:
  # Matches both Services, so it creates a permanently-down target that trips
  # TargetDown. Replaced by servicemonitor.yaml.
  serviceMonitor:
    enabled: false
  # Two of the three chart alerts latch on any upstream release and stay firing
  # until you upgrade. The third (reachability) is in prometheusrule.yaml.
  rules:
    enabled: false

cronjob:
  enabled: true
  # Not 'sidecar' — that runs crond, which needs root in the app pod.
  type: cronjob
  cronjob:
    # REQUIRED — the chart ships this empty. Without it the cron pod runs as uid 0,
    # occ refuses to run as a non-owner of config.php, and every run exits 1, so
    # background jobs silently never run.
    securityContext:
      runAsUser: 33
      runAsGroup: 33
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

persistence:
  enabled: true
  existingClaim: nextcloud-html
  nextcloudData:
    enabled: true
    existingClaim: nextcloud-data

# local-path pins the pod to one node regardless; this makes it a choice. worker-01
# is the NFS server, so file I/O stays local. Reuses the media label rather than
# inventing a second name for the same node.
nodeSelector:
  homelab.io/media: "true"

# REQUIRED. The default livenessProbe starts killing the pod ~40s in, well before a
# first boot can rsync ~15k files and run the installer. 60 x 10s = 10 min budget.
startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 60

# No cpu limit. Keeping the ratio tight was the old workaround for VPA preserving
# request:limit — but tight only slows the collapse: a 250m request became ~100m and
# took the ceiling down to 400m with it, leaving PHP 21% throttled on page loads.
# Removing the cpu limit removes the thing being divided. Memory limit stays, since
# memory is not a burst-and-idle resource. See vpa.yaml.
resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 2Gi

httpRoute:
  enabled: true
  hostnames:
    - nextcloud.nik-homelab.dev
  parentRefs:
    - name: homelab
      namespace: envoy-gateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      # Large uploads outlive Envoy's default stream timeout. If they still cut off
      # mid-transfer the lever is a ClientTrafficPolicy, not this.
      timeouts:
        request: 3600s
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Nextcloud"
    gethomepage.dev/description: "Documents & file sync"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "nextcloud.png"
    gethomepage.dev/href: "https://nextcloud.nik-homelab.dev"
