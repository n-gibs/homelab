apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: homelab
  namespace: envoy-gateway-system
spec:
  # The Cilium L2 policy announces the gateway IP only from worker-01, but the
  # data-plane proxy is free to schedule on any node. With externalTrafficPolicy
  # Local, the announcer and the proxy pod must be co-located or traffic to
  # 192.168.30.200 is blackholed. Use Cluster so the announcing node forwards to
  # the proxy wherever it runs (via the VXLAN overlay). Trade-off: client source
  # IP is SNAT'd — not needed for this LAN homelab.
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        externalTrafficPolicy: Cluster
