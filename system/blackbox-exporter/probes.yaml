---
# Two Probes, split by module rather than by app: everything answering a real 200 shares
# one, longhorn gets its own because it needs a module that tolerates 401.
#
# Public hostnames, not Services. All of them resolve to 192.168.30.200, the gateway's address,
# so the probe traverses DNS, the gateway, the HTTPRoute and the served certificate — the
# whole path a browser takes. A Service-level probe would skip every one of those and only
# retest what pod readiness already covers.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: apps
  namespace: blackbox-exporter
  labels:
    release: monitoring-system
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://vault.nik-homelab.dev
        - https://grafana.nik-homelab.dev
        - https://jellyfin.nik-homelab.dev
        - https://nextcloud.nik-homelab.dev
        - https://immich.nik-homelab.dev
        # Each measured through this exporter before being added: all return 200, five
        # of them (lidarr, navidrome, prowlarr, radarr, sonarr) only after a redirect the
        # module follows. A hostname dropped from an HTTPRoute does not fail DNS — the
        # wildcard record still resolves it to the gateway, which 404s — so it surfaces
        # here as EndpointDown, not as a name that stopped resolving.
        - https://argocd.nik-homelab.dev
        - https://bazarr.nik-homelab.dev
        - https://cleanuparr.nik-homelab.dev
        - https://home.nik-homelab.dev
        - https://infisical.nik-homelab.dev
        - https://lidarr.nik-homelab.dev
        - https://navidrome.nik-homelab.dev
        - https://prowlarr.nik-homelab.dev
        - https://qbittorrent.nik-homelab.dev
        - https://radarr.nik-homelab.dev
        - https://sonarr.nik-homelab.dev
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: apps-auth
  namespace: blackbox-exporter
  labels:
    release: monitoring-system
spec:
  interval: 60s
  module: http_2xx_auth
  prober:
    url: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        # 401 unauthenticated, measured. On http_2xx this would be probe_success 0 and a
        # standing critical EndpointDown; see values.yaml for what the auth module still proves.
        - https://longhorn.nik-homelab.dev
