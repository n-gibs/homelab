controllers:
  main:
    pod:
      nodeSelector:
        homelab.io/storage: "true"
    initContainers:
      fix-perms:
        image:
          repository: busybox
          tag: latest
        command:
          - sh
          - -c
          - chmod -R 777 /data/downloads /data/media
        securityContext:
          runAsUser: 0
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/qbittorrent
          tag: latest
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Los_Angeles
          WEBUI_PORT: "8080"
      gluetun:
        image:
          repository: qmcgaw/gluetun
          tag: latest
        env:
          VPN_SERVICE_PROVIDER: mullvad
          VPN_TYPE: wireguard
          TZ: America/Los_Angeles
          FIREWALL_OUTBOUND_SUBNETS: "10.0.0.0/8,192.168.0.0/16"
          FIREWALL_INPUT_PORTS: "8080,6881"
          SERVER_COUNTRIES: "USA"
          WIREGUARD_ALLOWED_IPS: "0.0.0.0/0"
          DNS_SERVER: "off"
          DNS_UPSTREAM_RESOLVER_TYPE: "plain"
          DNS_UPSTREAM_PLAIN_ADDRESSES: "10.43.0.10:53"
          WIREGUARD_MTU: "1170"
          WIREGUARD_IMPLEMENTATION: userspace
        envFrom:
          - secretRef:
              name: gluetun-vpn-creds
        securityContext:
          capabilities:
            add:
              - NET_ADMIN

service:
  main:
    controller: main
    ports:
      http:
        port: 8080

route:
  main:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "qBittorrent"
      gethomepage.dev/description: "Torrent client"
      gethomepage.dev/group: "Media"
      gethomepage.dev/icon: "qbittorrent.png"
      gethomepage.dev/href: "https://qbittorrent.nik-homelab.dev"
    enabled: true
    kind: HTTPRoute
    hostnames:
      - qbittorrent.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: local-path
    size: 1Gi
    accessMode: ReadWriteOnce
    advancedMounts:
      main:
        app:
          - path: /config
  data:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage
    advancedMounts:
      main:
        fix-perms:
          - path: /data
        app:
          - path: /data
