controllers:
  main:
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
    containers:
      app:
        # renovate: datasource=docker depName=lscr.io/linuxserver/sonarr versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)\.(?<build>\d+)-ls(?<revision>\d+)$
        image:
          repository: lscr.io/linuxserver/sonarr
          tag: 4.0.19.2979-ls321
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Los_Angeles
        envFrom:
          - secretRef:
              name: arr-api-key
        resources:
          requests:
            cpu: 100m
            memory: 320Mi
          limits:
            # Memory only. No cpu limit: VPA preserves the request:limit ratio, so a
            # shrinking request drags the limit down with it and throttles the container.
            memory: 640Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 8989

route:
  main:
    enabled: true
    kind: HTTPRoute
    hostnames:
      - sonarr.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system
    # An interactive search fans out to every indexer and can run ~60s, well past
    # Envoy's 15s default request timeout; the resulting plain-text 504 reaches the
    # UI as "Unable to load results". backendRefs must be spelled out here -- once
    # rules are declared the chart no longer fills them in.
    rules:
      - backendRefs:
          - name: sonarr
            port: 8989
        matches:
          - path:
              type: PathPrefix
              value: /
        timeouts:
          request: 120s

persistence:
  config:
    # local-path, not nfs -- SQLite over NFS deadlocks. See config-pvc.yaml for
    # the rationale, the durability trade, and the restore-from-backup recovery
    # path. Defined as its own manifest rather than inline so the comment lives
    # with the volume; the chart just consumes it.
    existingClaim: sonarr-config-local
    globalMounts:
      - path: /config
  data:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage
    globalMounts:
      - path: /data
