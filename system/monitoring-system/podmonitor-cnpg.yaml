---
# Scrapes every CloudNativePG instance. `any: true` plus the podRole selector covers every
# current and future cluster with no further edits.
#
# A PodMonitor, not a ServiceMonitor: the -rw/-ro Services route only to the primary or the
# replicas, so scraping through them would miss instances and relabel samples onto
# whichever pod answered.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: cnpg-instances
  namespace: monitoring-system
  labels:
    release: monitoring-system
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      cnpg.io/podRole: instance
  # Only cnpg_collector_up carries a cluster label of its own; these put it on every sample.
  podTargetLabels:
    - cnpg.io/cluster
    - cnpg.io/instanceRole
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
