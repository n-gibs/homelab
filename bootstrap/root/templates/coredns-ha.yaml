---
# Own Application rather than the `system` ApplicationSet: that generator builds a Helm
# source from app.yaml, and this has no chart. Its objects must also land in kube-system,
# which the generator hardcodes to the directory basename. Everything else matches the
# ApplicationSet. See CLAUDE.md before adding an app.yaml here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coredns-ha
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  destination:
    name: in-cluster
    namespace: kube-system
  project: default
  source:
    repoURL: {{ .Values.gitops.repo }}
    targetRevision: {{ .Values.gitops.revision }}
    path: system/coredns
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
