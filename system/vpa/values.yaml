recommender:
  enabled: true
  podMonitor:
    enabled: true
  # "Saved checkpoint for VPA" logs at V(3), once per container per minute. Chart default is 4.
  extraArgs:
    v: "2"

updater:
  enabled: true
  extraArgs:
    min-replicas: 1
  podMonitor:
    enabled: true

admissionController:
  enabled: true
