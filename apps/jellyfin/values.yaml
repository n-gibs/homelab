controllers:
  main:
    # local-path is ReadWriteOnce and node-pinned, and two Jellyfins must never open
    # the same SQLite database: the old pod has to be gone before the new one starts.
    strategy: Recreate
    initContainers:
      # ONE-TIME MIGRATION -- delete this initContainer (and the oldconfig mount in
      # persistence) once the local-path volume is populated and Jellyfin is verified.
      # It is a no-op on every run after the first.
      #
      # Reads the retired nfs PVC through its directory on the share rather than by
      # claim, because the chart no longer declares that PVC and ArgoCD prunes it;
      # the PV's reclaim policy is Retain, so the files outlive the claim. Runs as an
      # initContainer so the copy is guaranteed to happen with Jellyfin stopped --
      # no scaling the Deployment down behind ArgoCD's selfHeal.
      migrate-config:
        # renovate: datasource=docker depName=busybox
        image:
          repository: busybox
          tag: 1.38.0
        command:
          - sh
          - -c
          - |
            set -eu
            # Own sentinel, written last, rather than any file the copy itself
            # brings over: a crash mid-copy must look unmigrated so the retry
            # recopies over the top instead of starting Jellyfin on half a library.
            if [ -f /config/.migrated-from-nfs ]; then
              echo "already migrated"
              exit 0
            fi
            # cache/log/transcodes are scratch; everything else (database, metadata,
            # plugins, library roots, the *.xml settings) has to come across.
            cd /oldconfig
            for d in *; do
              case "$d" in cache|log|transcodes) continue ;; esac
              echo "copying $d"
              cp -a "$d" /config/
            done
            chown -R 1000:1000 /config
            touch /config/.migrated-from-nfs
            echo "migrated $(du -sh /config | cut -f1)"
        securityContext:
          runAsUser: 0
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
    containers:
      app:
        # renovate: datasource=docker depName=lscr.io/linuxserver/jellyfin versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)ubu(?<build>\d+)-ls(?<revision>\d+)$
        image:
          repository: lscr.io/linuxserver/jellyfin
          tag: 10.11.11ubu2604-ls43
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Los_Angeles
        resources:
          requests:
            cpu: 250m
          limits:
            cpu: "4"

service:
  main:
    controller: main
    ports:
      http:
        port: 8096

route:
  main:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Jellyfin"
      gethomepage.dev/description: "Media server"
      gethomepage.dev/group: "Media"
      gethomepage.dev/icon: "jellyfin.png"
      gethomepage.dev/href: "https://jellyfin.nik-homelab.dev"
      gethomepage.dev/widget.type: "jellyfin"
      gethomepage.dev/widget.url: "http://jellyfin.jellyfin.svc.cluster.local:8096"
      # Outer tpl escape: Homepage substitutes the placeholder at runtime, Helm must not touch it.
      gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}" }}'
      # No `version` — that's for Jellyfin >= 10.12; we run 10.11.x, which wants v1 (default).
      gethomepage.dev/widget.enableBlocks: "true"
    enabled: true
    kind: HTTPRoute
    hostnames:
      - jellyfin.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system

persistence:
  config:
    # local-path, not nfs -- jellyfin.db is SQLite and SQLite over NFS deadlocks.
    # See config-pvc.yaml for the rationale and the restore path. Defined as its
    # own manifest so the comment lives with the volume.
    existingClaim: jellyfin-config-local
    globalMounts:
      - path: /config
  # Jellyfin writes backups to <datadir>/backups, which is /config/data/data/backups
  # in the linuxserver image (verified against the Path in GET /Backup). Mounting the
  # NFS share there puts the archives on a different disk from the local-path config
  # volume they protect, without making the rest of /data writable.
  backups:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage/backups/jellyfin
    globalMounts:
      - path: /config/data/data/backups
  data:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage
    globalMounts:
      - path: /data
        readOnly: true
  # ONE-TIME MIGRATION -- remove together with the migrate-config initContainer.
  # This is the retired nfs config PVC, addressed by its directory on the share
  # (`kubectl get pv <vol> -o jsonpath='{.spec.nfs.path}'`) because the claim is gone.
  oldconfig:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage/jellyfin/jellyfin
    advancedMounts:
      main:
        migrate-config:
          - path: /oldconfig
            readOnly: true
