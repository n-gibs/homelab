{{- range $stack := .Values.gitops.stacks }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $stack.name }}
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: {{ $stack.syncWave | default "0" | quote }}
spec:
  generators:
    - git:
        repoURL: {{ $.Values.gitops.repo }}
        revision: {{ $.Values.gitops.revision }}
        files:
          - path: "{{ $stack.name }}/*/app.yaml"
  template:
    metadata:
      name: '{{`{{path.basename}}`}}'
      annotations:
        argocd.argoproj.io/sync-wave: '{{`{{syncWave | default "0"}}`}}'
    spec:
      destination:
        name: in-cluster
        namespace: '{{`{{path.basename}}`}}'
      project: default
      sources:
        - repoURL: '{{`{{chartRepo}}`}}'
          chart: '{{`{{chartName}}`}}'
          targetRevision: '{{`{{chartVersion}}`}}'
          helm:
            valueFiles:
              - $values/{{`{{path}}`}}/values.yaml
        - repoURL: {{ $.Values.gitops.repo }}
          targetRevision: {{ $.Values.gitops.revision }}
          ref: values
        - repoURL: {{ $.Values.gitops.repo }}
          targetRevision: {{ $.Values.gitops.revision }}
          path: '{{`{{path}}`}}'
          directory:
            exclude: '{app.yaml,values.yaml}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
{{- end }}
