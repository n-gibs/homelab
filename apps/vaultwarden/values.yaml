controllers:
  main:
    # local-path is ReadWriteOnce and node-pinned, and two Vaultwardens must never
    # open the same SQLite database: the old pod has to be gone before the new one
    # starts.
    strategy: Recreate
    containers:
      app:
        # renovate: datasource=docker depName=vaultwarden/server
        image:
          repository: vaultwarden/server
          tag: 1.37.1
        env:
          DOMAIN: "https://vault.nik-homelab.dev"
          WEBSOCKET_ENABLED: "true"
          # Multi-account: invite-only (no open registration).
          # Admin adds users via /admin panel (no SMTP = no email invites yet).
          SIGNUPS_ALLOWED: "false"
          INVITATIONS_ALLOWED: "true"
          INVITATION_ORG_NAME: "Homelab"
          # SMTP not configured — invites added manually via /admin (no email sent).
          ADMIN_TOKEN:
            valueFrom:
              secretKeyRef:
                name: vaultwarden-admin-token
                key: token

service:
  main:
    controller: main
    ports:
      http:
        port: 80

route:
  main:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Vaultwarden"
      gethomepage.dev/description: "Password manager"
      gethomepage.dev/group: "Infrastructure"
      gethomepage.dev/icon: "bitwarden.png"
      gethomepage.dev/href: "https://vault.nik-homelab.dev"
    enabled: true
    kind: HTTPRoute
    hostnames:
      - vault.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system

persistence:
  data:
    # local-path, not nfs -- db.sqlite3 is SQLite in WAL mode, which does not work
    # over NFS. See data-pvc.yaml for the rationale and the restore path.
    existingClaim: vaultwarden-data-local
    globalMounts:
      - path: /data
