---
# Duration-based escalation. A `severity: warning` that never escalates is
# indistinguishable from noise: the ntfy route inherits repeat_interval 12h, so 30h of
# continuous firing yields two or three notifications interleaved with everything else.
# NodeClockNotSynchronising went unnoticed for 38h that way.
#
# Escalates the whole class on duration rather than reclassifying alerts one at a time.
# Pairs with the `severity = "critical"` child route in values.yaml, which re-notifies
# hourly — escalation alone would just add one more message to the same stream.
#
# No feedback loop: matches `severity="warning"`, emits `severity: critical`, so it cannot
# match itself. Do not change the emitted severity to warning.
#
# ALERTS_FOR_STATE timestamps the PENDING transition, not firing, and carries no
# `alertstate` label — hence the join against ALERTS, which does. So a source with
# `for: 15m` trips at 1h45m of firing, not 2h. Erring early is fine.
#
# `label_replace` saves the source alertname into `escalated_alert` because Prometheus
# overwrites `alertname` with this rule's own.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: alert-escalation
  namespace: monitoring-system
  labels:
    release: monitoring-system
spec:
  groups:
    - name: alert-escalation
      rules:
        - alert: WarningAlertFiringTooLong
          expr: >-
            label_replace(
              ALERTS{alertstate="firing", severity="warning"}
                and ignoring(alertstate) (time() - ALERTS_FOR_STATE > 7200),
              "escalated_alert", "$1", "alertname", "(.+)")
          labels:
            severity: critical
          annotations:
            summary: >-
              {{ $labels.escalated_alert }} has been firing for over 2h and is still unresolved
            description: >-
              A `severity: warning` alert has now been firing for more than two hours, which
              means it was notified once and then went quiet under the 12h repeat interval.
              Escalated to critical so it re-notifies hourly until it is fixed or silenced.
              Source alert: `{{ $labels.escalated_alert }}`{{ if $labels.instance }} on `{{ $labels.instance }}`{{ end }}{{ if $labels.namespace }} in namespace `{{ $labels.namespace }}`{{ end }}.
              Fix it, or if it is expected, silence it with an explicit `--duration` — note a
              silence on the source alert does NOT suppress this one, because silences are an
              Alertmanager concept and `ALERTS` still reports a silenced alert as firing. To
              mute the pair, silence `escalated_alert="<source>"` as well. The original warning
              also keeps notifying: the inhibit rules match on `alertname`, which differs here
              by construction.
