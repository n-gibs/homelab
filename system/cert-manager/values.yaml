crds:
  enabled: true
replicaCount: 1

# Without this nothing scrapes cert-manager, so certmanager_certificate_expiration_timestamp_seconds
# does not exist and a failed renewal on the *.nik-homelab.dev wildcard surfaces as a browser
# warning roughly 90 days after the last good issue. Alerts in
# system/cert-manager/prometheusrule.yaml.
prometheus:
  servicemonitor:
    enabled: true
    endpointAdditionalProperties:
      # Matches the relabeling every other scrape in this stack applies.
      relabelings:
        - action: replace
          sourceLabels: []
          targetLabel: cluster
          replacement: homelab

# The OPNsense resolver at 192.168.30.1 is authoritative for nik-homelab.dev (split horizon), so it
# answers the DNS-01 self-check with an aa NODATA and the challenge never leaves pending. The
# self-check has to ask a resolver that can actually see the public zone.
dns01RecursiveNameservers: "1.1.1.1:53,8.8.8.8:53"
dns01RecursiveNameserversOnly: true
