apiVersion: v1
kind: LimitRange
metadata:
  name: infisical
  namespace: infisical
spec:
  limits:
    - type: Container
      # defaultRequest only. The redis subchart declares no resources at all, which made
      # redis-master-0 BestEffort: invisible to the scheduler and first evicted under node
      # pressure. No default memory limit — redis has no maxmemory set, so a ceiling here
      # would turn a cache filling up into an OOMKill.
      defaultRequest:
        cpu: 50m
        memory: 128Mi
