apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-config-local
  namespace: navidrome
  # No sync-wave annotation -- see the local-path note in CLAUDE.md. Superseded by
  # navidrome-config below; scheduled for deletion.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-config
  namespace: navidrome
spec:
  accessModes:
    - ReadWriteOnce
  # navidrome.db is SQLite in WAL mode -- longhorn per the CLAUDE.md storage rule.
  # Backup: ND_BACKUP_* in values.yaml, a VACUUM INTO snapshot onto NFS at
  # /mnt/storage/backups/navidrome. It protects play counts, ratings and playlists,
  # none of which are reconstructible from the music files. Restore by copying it back.
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
