apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: jellyfin
  updatePolicy:
    updateMode: "Recreate"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          # 1, not the template's 100m: jellyfin idles between streams, so VPA sized on
          # typical usage and left nothing reserved for a transcode.
          cpu: "1"
          memory: 256Mi
        maxAllowed:
          cpu: 8
          memory: 8Gi
