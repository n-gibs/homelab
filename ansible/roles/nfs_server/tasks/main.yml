---
- name: Install NFS server packages
  ansible.builtin.apt:
    name:
      - nfs-kernel-server
      - nfs-common
    state: present
  become: true

- name: Create NFS export directory
  ansible.builtin.file:
    path: "{{ nfs_export_path }}"
    state: directory
    mode: "0755"
    owner: nobody
    group: nogroup
  become: true

- name: Mount external drive by UUID
  ansible.posix.mount:
    path: "{{ nfs_export_path }}"
    src: "UUID={{ nfs_drive_uuid }}"
    fstype: xfs
    opts: "{{ nfs_mount_options }}"
    state: mounted
  become: true

- name: Create NFS subdirectories
  ansible.builtin.file:
    path: "{{ nfs_export_path }}/{{ item }}"
    state: directory
    mode: "0755"
    owner: nobody
    group: nogroup
  become: true
  loop: "{{ nfs_subdirs }}"

- name: Configure NFS export
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "{{ nfs_export_path }} {{ nfs_allowed_clients }}(rw,sync,no_subtree_check,no_root_squash)"
    create: true
    mode: "0644"
  become: true
  notify: Re-export NFS shares

# Longhorn's backup target gets its own export, scoped to just this directory (not the
# whole share). It must match the parent /mnt/storage export's no_root_squash, not
# contradict it: this directory is nested inside that export, and an NFSv4 client can
# resolve through the parent, so a client writes as root regardless of what this export
# says. all_squash here just left the backupstore with a mix of root- and nobody-owned
# directories, and a root-owned drwx------ blocks a squashed client's mkdir.
- name: Configure NFS export for Longhorn backups
  ansible.builtin.blockinfile:
    path: /etc/exports
    marker: "# {mark} ANSIBLE MANAGED BLOCK - longhorn-backups export"
    create: true
    mode: "0644"
    block: |
      {{ nfs_export_path }}/{{ nfs_backup_subdir }} {{ nfs_allowed_clients }}(rw,sync,no_subtree_check,no_root_squash)
      {{ nfs_export_path }}/{{ nfs_backup_subdir }} {{ nfs_pod_cidr }}(rw,sync,no_subtree_check,no_root_squash)
  become: true
  notify: Re-export NFS shares

- name: Enable and start NFS server
  ansible.builtin.service:
    name: nfs-kernel-server
    enabled: true
    state: started
  become: true

- name: Allow NFS through UFW
  community.general.ufw:
    rule: allow
    port: "2049"
    proto: "{{ item }}"
    src: "{{ nfs_allowed_clients }}"
  become: true
  loop:
    - tcp
    - udp

# worker-01 reaches the longhorn-backups export over the pod CIDR, not the LAN — see the
# export task above for why.
- name: Allow NFS through UFW from pod CIDR
  community.general.ufw:
    rule: allow
    port: "2049"
    proto: "{{ item }}"
    src: "{{ nfs_pod_cidr }}"
  become: true
  loop:
    - tcp
    - udp
