image:
  tag: v1.13.2

enableRbac: true
serviceAccount:
  create: true

extraClusterRoles:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
      - gateways
    verbs:
      - get
      - list
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "home.nik-homelab.dev"

config:
  settings:
    title: Homelab
    theme: dark
    color: slate
    headerStyle: boxed
    target: _blank

  kubernetes:
    mode: cluster
    gateway: true

  widgets:
    - resources:
        backend: kubernetes
        expanded: true
        cpu: true
        memory: true
    - search:
        provider: duckduckgo
        target: _blank
    - greeting:
        text_size: xl
        text: Homelab

  services: []

  bookmarks: []
