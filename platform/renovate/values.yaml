# renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
image:
  tag: 44.224.1

cronjob:
  schedule: "0 3,15 * * *"
  timeZone: America/Los_Angeles
  # Two Renovate runs at once can open duplicate PRs for the same dependency.
  concurrencyPolicy: Forbid
  # k8s keeps only 1 failed pod by default; 3 gives enough log history to debug a bad run.
  failedJobsHistoryLimit: 3

existingSecret: renovate-env

renovate:
  # JavaScript, not JSON, so credentials can stay out of git as process.env
  # references. A broken config.js makes Renovate exit loudly; the JSON
  # RENOVATE_HOST_RULES alternative fails silently. See the spec.
  configIsJavaScript: true
  config: |
    module.exports = {
      platform: 'github',
      onboarding: false,
      repositories: ['n-gibs/homelab'],
      hostRules: [
        {
          hostType: 'docker',
          matchHost: 'docker.io',
          // Not a credential, so it stays readable in git rather than
          // being invisible inside the sealed secret.
          username: 'nikgibs',
          password: process.env.DOCKER_HUB_TOKEN,
        },
        {
          // Auth covers the tag pages only. Renovate's first probe per image is
          // anonymous by design and never retried, so a 429 on it surfaces as
          // "no-result" whatever credentials are set here.
          hostType: 'docker',
          matchHost: 'ghcr.io',
          username: 'n-gibs',
          password: process.env.RENOVATE_TOKEN,
          // Serial on purpose: ghcr.io pages at 1000 tags, so one lookup can be
          // dozens of requests. A slow run is fine; a 429'd probe skips silently.
          concurrentRequestLimit: 1,
          maxRequestsPerSecond: 2,
        },
      ],
    };

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  # CronJob, so no VPA rewrites this — 1 core was the literal ceiling and the last two
  # runs throttled 72% and 64% (2026-08-12).
  limits:
    cpu: 2
    memory: 2Gi
