controllers:
  main:
    # local-path is ReadWriteOnce and node-pinned, and two Jellyfins must never open
    # the same SQLite database: the old pod has to be gone before the new one starts.
    strategy: Recreate
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
      securityContext:
        # render (991) and video (44) own the DRI devices; the container runs as uid 1000.
        supplementalGroups: [991, 44]
    containers:
      app:
        # renovate: datasource=docker depName=lscr.io/linuxserver/jellyfin versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)ubu(?<build>\d+)-ls(?<revision>\d+)$
        image:
          repository: lscr.io/linuxserver/jellyfin
          tag: 10.11.11ubu2604-ls43
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Los_Angeles
        resources:
          requests:
            cpu: "1"
          limits:
            # QuickSync, advertised by system/intel-gpu-plugin. Requesting the resource is
            # what gets renderD128 past containerd's device cgroup; mounting it does not.
            gpu.intel.com/i915: 1
          # No cpu limit on purpose -- see limitrange.yaml. VPA preserves the
          # request:limit ratio, so 250m:4 here became a 100m:1600m pod and throttled
          # transcodes at 1.6 cores.

service:
  main:
    controller: main
    ports:
      http:
        port: 8096

route:
  main:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Jellyfin"
      gethomepage.dev/description: "Media server"
      gethomepage.dev/group: "Media"
      gethomepage.dev/icon: "jellyfin.png"
      gethomepage.dev/href: "https://jellyfin.nik-homelab.dev"
      gethomepage.dev/widget.type: "jellyfin"
      gethomepage.dev/widget.url: "http://jellyfin.jellyfin.svc.cluster.local:8096"
      # Outer tpl escape: Homepage substitutes the placeholder at runtime, Helm must not touch it.
      gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}" }}'
      # No `version` — that's for Jellyfin >= 10.12; we run 10.11.x, which wants v1 (default).
      gethomepage.dev/widget.enableBlocks: "true"
    enabled: true
    kind: HTTPRoute
    hostnames:
      - jellyfin.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system

persistence:
  config:
    # local-path, not nfs -- jellyfin.db is SQLite and SQLite over NFS deadlocks.
    # See config-pvc.yaml for the rationale and the restore path. Defined as its
    # own manifest so the comment lives with the volume.
    existingClaim: jellyfin-config-local
    globalMounts:
      - path: /config
  # Jellyfin writes backups to <datadir>/backups, which is /config/data/data/backups
  # in the linuxserver image (verified against the Path in GET /Backup). Mounting the
  # NFS share there puts the archives on a different disk from the local-path config
  # volume they protect, without making the rest of /data writable.
  backups:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage/backups/jellyfin
    globalMounts:
      - path: /config/data/data/backups
  data:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage
    globalMounts:
      - path: /data
        readOnly: true
