# Probes the URL a browser would, through the real gateway and the real cert. Readiness and
# scrape checks are inside-out: they miss an app answering 500s, a name that stopped
# resolving, and a certificate the gateway never reloaded.
fullnameOverride: blackbox-exporter

# Replaces the chart's default module map wholesale, so http_2xx is restated verbatim —
# widening it would stop the sixteen real-200 targets from asserting it. http_2xx_auth is
# for longhorn alone, whose UI answers 401 unauthenticated; 401/403 still proves DNS, the
# gateway, the HTTPRoute and the served certificate.
config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        follow_redirects: true
        preferred_ip_protocol: ip4
        valid_http_versions: [HTTP/1.1, HTTP/2.0]
    http_2xx_auth:
      prober: http
      timeout: 5s
      http:
        follow_redirects: true
        preferred_ip_protocol: ip4
        valid_http_versions: [HTTP/1.1, HTTP/2.0]
        valid_status_codes: [200, 401, 403]
    # For 192.168.30.194:2049. A handshake against nfsd is the whole check — every `nfs`
    # PVC in the cluster depends on it, and nothing else watches it directly.
    tcp_connect:
      prober: tcp
      timeout: 5s
      tcp:
        preferred_ip_protocol: ip4

replicas: 1

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
