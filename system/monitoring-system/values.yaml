# KubeJobFailed duplicates CronJobJobFailed in prometheusrule-backups.yaml, which carries
# the runbook text and the recency bound. Both read kube_job_failed, so a single failure
# notified twice and escalated twice. Upstream has no recency bound, so keeping it would
# reintroduce the behaviour the bound exists to remove.
defaultRules:
  disabled:
    KubeJobFailed: true

# k3s doesn't expose these endpoints
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# etcd runs in the k3s process, so the chart's `component: etcd` selector matches nothing.
# kubeEtcd.endpoints would render an Endpoints object, which ArgoCD excludes by kind, so
# scrapeconfig-etcd.yaml addresses the nodes directly instead. `enabled` stays true only
# because the chart gates its etcd alert rules on it.
kubeEtcd:
  enabled: true
  service:
    enabled: false
  serviceMonitor:
    enabled: false

kubelet:
  serviceMonitor:
    relabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        sourceLabels: []
        targetLabel: cluster
        replacement: homelab
    cAdvisorRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        sourceLabels: []
        targetLabel: cluster
        replacement: homelab
    # Chart default drops container_cpu_cfs_throttled_seconds_total here too;
    # keep the rest of the cardinality reduction but preserve that metric for CPU throttling monitoring.
    cAdvisorMetricRelabelings:
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_cpu_(load_average_10s|system_seconds_total|user_seconds_total)'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_memory_(mapped_file|swap)'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_(file_descriptors|tasks_state|threads_max)'
      - sourceLabels: [__name__, scope]
        action: drop
        regex: 'container_memory_failures_total;hierarchy'
      - sourceLabels: [__name__, interface]
        action: drop
        regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_spec.*'
      - sourceLabels: [id, pod]
        action: drop
        regex: '.+;'

prometheusOperator:
  # Trivial on their own (7-day peak 0m / 20Mi each), but these two sidecars were part of
  # the seventeen requestless containers that made worker-00 look empty to the scheduler.
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi

kube-state-metrics:
  prometheus:
    monitor:
      relabelings:
        - action: replace
          sourceLabels: []
          targetLabel: cluster
          replacement: homelab
  # Extend KSM's ClusterRole rather than replace it so the chart's own rules survive. The
  # CRD read rule is omitted deliberately: the chart grants it when customResourceState is on.
  rbac:
    extraRules:
      - apiGroups: ["secrets.infisical.com"]
        resources: ["infisicalstaticsecrets"]
        verbs: ["list", "watch"]
      - apiGroups: ["k3s.cattle.io"]
        resources: ["etcdsnapshotfiles"]
        verbs: ["list", "watch"]
  # Editing customResourceState needs a kube-state-metrics rollout restart: it reads the
  # ConfigMap only at startup and the chart sets no checksum annotation, so ArgoCD reports
  # Synced while the new metric never appears.
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: secrets.infisical.com
              version: v1beta1
              kind: InfisicalStaticSecret
            labelsFromPath:
              name: [metadata, name]
              namespace: [metadata, namespace]
            metrics:
              - name: infisical_secret_last_sync_timestamp_seconds
                help: Unix time of the operator's last successful reconcile of this secret
                each:
                  type: Gauge
                  gauge:
                    # Find-by-key path, not a type label filter: the CR carries four
                    # conditions and only this one's message is a timestamp — the other
                    # three are prose and would fail timestamp parsing.
                    path: [status, conditions, "[type=secrets.infisical.com/LastSuccessfulReconcileAt]"]
                    valueFrom: [message]

          # k3s records every etcd snapshot it takes as an ETCDSnapshotFile, so the age of
          # the newest one is the age of the cluster's restore point. Nothing else reports
          # it: these are local files on each node, not a CronJob, so the backup rules in
          # prometheusrule-backups.yaml cannot see them.
          - groupVersionKind:
              group: k3s.cattle.io
              version: v1
              kind: ETCDSnapshotFile
            labelsFromPath:
              name: [metadata, name]
              node: [spec, nodeName]
            metrics:
              - name: k3s_etcd_snapshot_creation_timestamp_seconds
                help: Unix time at which this etcd snapshot was taken
                each:
                  type: Gauge
                  gauge:
                    path: [status, creationTime]

prometheus-node-exporter:
  # The chart ships resources: {}, which left all three pods BestEffort.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  # Points the textfile collector at what smart-temp-textfile.timer writes (ansible/roles/common);
  # the chart already bind-mounts / at /host/root. The filesystem excludes repeat the chart's own
  # defaults verbatim because Helm replaces lists rather than merging — re-check on a chart bump.
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.textfile.directory=/host/root/var/lib/node_exporter/textfile_collector
  prometheus:
    monitor:
      relabelings:
        - action: replace
          sourceLabels: []
          targetLabel: cluster
          replacement: homelab

prometheus:
  prometheusSpec:
    # Requests exist so the scheduler stops treating this pod as free. Memory is sized for a
    # TSDB working set that grows with retention and series count, not for the observed peak.
    # No limits, deliberately: a memory limit turns a slow query into an OOMKill that loses
    # the WAL, and this pod is the alerting path.
    resources:
      requests:
        cpu: 250m
        memory: 3Gi
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false
    # A TSDB is mmap-heavy, which NFS handles worst. Changing this line alone does nothing:
    # volumeClaimTemplates are immutable, so the recreated StatefulSet reuses the existing PVC
    # and Prometheus keeps running on the old class while everything reports Synced. Migrating
    # means deleting the PVC deliberately, with the operator scaled to 0.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

grafana:
  enabled: true
  # RWO + RollingUpdate deadlocks: the new pod waits on a volume the old pod still holds.
  deploymentStrategy:
    type: Recreate
  # Chart default is emptyDir, so starred dashboards and anything created in the UI live in a
  # SQLite DB that dies with the pod. Longhorn, not NFS — SQLite over NFS locks up.
  persistence:
    enabled: true
    type: pvc
    storageClassName: longhorn
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
  service:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Grafana"
      gethomepage.dev/description: "Metrics & dashboards"
      gethomepage.dev/group: "Infrastructure"
      gethomepage.dev/icon: "grafana.png"
      gethomepage.dev/href: "https://grafana.nik-homelab.dev"
  adminPassword: changeme  # override via secret in production
  grafana.ini:
    server:
      root_url: "%(protocol)s://grafana.nik-homelab.dev"
      serve_from_sub_path: false
    auth.anonymous:
      enabled: true
      org_role: Admin
  additionalDataSources:
    - name: Loki
      type: loki
      access: proxy
      url: http://loki.loki.svc.cluster.local:3100

alertmanager:
  alertmanagerSpec:
    # 7-day peak 14m / 46Mi. Small, but it shipped requestless like the rest, which is how
    # it ended up co-located with Prometheus on the 4-core node.
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
    secrets:
      - ntfy-webhook-url
      - deadmanssnitch-url
  config:
    global:
      resolve_timeout: 5m
    inhibit_rules:
      - source_matchers: ['severity = critical']
        target_matchers: ['severity =~ warning|info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['severity = warning']
        target_matchers: ['severity = info']
        equal: ['namespace', 'alertname']
      - source_matchers: ['alertname = InfoInhibitor']
        target_matchers: ['severity = info']
        equal: ['namespace']
      - target_matchers: ['alertname = InfoInhibitor']
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
        # Dead-man's switch: healthchecks.io alerts on the ABSENCE of these pings, so don't pin
        # hc-ping.com's IP — a DNS break stopping the ping IS the signal. group_interval must
        # stay well under repeat_interval; the dispatcher only re-evaluates on its ticks.
        - receiver: 'deadmanssnitch'
          matchers: ['alertname = "Watchdog"']
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 5m
        # Criticals re-notify hourly; delivery half of prometheusrule-alert-escalation.yaml.
        # Must stay ABOVE the warning|critical route — routes match in order and the broader
        # one would swallow it. group_by overrides the top-level ['namespace'] because
        # node-level alerts carry none and would all collapse into one repeat_interval timer.
        - receiver: 'ntfy'
          matchers: ['severity = "critical"']
          group_by: ['alertname', 'escalated_alert', 'namespace']
          repeat_interval: 1h
        - receiver: 'ntfy'
          matchers: ['severity =~ "warning|critical"']
          continue: false
    receivers:
      - name: 'null'
      - name: 'deadmanssnitch'
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/deadmanssnitch-url/url
            send_resolved: false
      - name: 'ntfy'
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/ntfy-webhook-url/url
            send_resolved: true
            # ntfy 400s once the rendered message exceeds 4096 bytes and Alertmanager treats
            # that as unrecoverable, so delivery breaks during a storm. truncatedAlerts carries
            # the dropped count; rendered size depends on the ntfy-side template, not this repo.
            max_alerts: 5
    templates:
      - '/etc/alertmanager/config/*.tmpl'
