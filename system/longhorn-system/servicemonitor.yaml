---
# Longhorn's manager exposes metrics on the longhorn-backend Service.
#
# No namespaceSelector: this now lives in the namespace it selects, so the default of
# own-namespace-only is exactly right.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: longhorn
  namespace: longhorn-system
  labels:
    release: monitoring-system
spec:
  selector:
    matchLabels:
      app: longhorn-manager
  endpoints:
    - port: manager
      path: /metrics
      interval: 30s
      relabelings:
        # Every built-in scrape config in values.yaml stamps cluster: homelab; match it here
        # too since this ServiceMonitor is outside that config and gets nothing for free.
        - action: replace
          sourceLabels: []
          targetLabel: cluster
          replacement: homelab
