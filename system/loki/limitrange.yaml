apiVersion: v1
kind: LimitRange
metadata:
  name: loki
  namespace: loki
spec:
  limits:
    - type: Container
      # defaultRequest only. The three loki-canary DaemonSet pods declare no resources at
      # all, which made them BestEffort. No default cpu limit — VPA preserves the
      # request:limit ratio and would throttle loki off its own recommendation.
      defaultRequest:
        cpu: 50m
        memory: 128Mi
