server:
  ingress:
    enabled: false
  httproute:
    enabled: true
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system
    hostnames:
      - argocd.nik-homelab.dev

configs:
  params:
    server.insecure: true  # TLS terminated at gateway
  cm:
    users.anonymous.enabled: "true"
    server-side-apply: "true"
  rbac:
    policy.default: "role:admin"
