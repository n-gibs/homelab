---
# The Cilium chart only ships an Ingress for hubble-ui, and this repo routes with Gateway
# API, so the route lives here instead of in bootstrap/values/cilium.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Hubble"
    gethomepage.dev/description: "Cilium network flows"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "cilium.png"
    gethomepage.dev/href: "https://hubble.nik-homelab.dev"
spec:
  hostnames:
    - hubble.nik-homelab.dev
  parentRefs:
    - name: homelab
      namespace: envoy-gateway-system
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
