---
# Watches Infisical -> cluster secret delivery. The operator's own error counter and conditions
# are useless here: it reports success every cycle whether or not it wrote anything. This reads
# the LastSuccessfulReconcileAt timestamp instead, turned into a gauge by kube-state-metrics'
# CustomResourceState (see values.yaml).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: infisical
  namespace: monitoring-system
  labels:
    release: monitoring-system
spec:
  groups:
    - name: infisical
      rules:
        # refreshInterval on the CRs is 60s, so 900s is 15 missed cycles. for: 15m adds
        # another 15, so this needs ~30m of genuine staleness before firing — deliberately
        # loose because propagation has been observed taking several minutes on its own,
        # and a tighter bound flaps.
        - alert: InfisicalSecretStale
          expr: time() - kube_customresource_infisical_secret_last_sync_timestamp_seconds > 900
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.name }} has not synced from Infisical in over 15m"
            description: >-
              The Kubernetes Secret this InfisicalStaticSecret manages is untouched and
              workloads keep running on it, so nothing breaks immediately — what's broken
              is that changes made in Infisical no longer reach the cluster. Check
              `kubectl -n infisical-operator logs deploy/infisical-opera-controller-manager`
              and `kubectl get infisicalstaticsecret -A -o wide`.

        # An absent series cannot go stale, so InfisicalSecretStale falls silent if
        # kube-state-metrics loses its CustomResourceState config or RBAC. absent() over a
        # count rather than named secrets, so adding a secret needs no edit here. This is the
        # rule that notices the monitoring itself stopped.
        - alert: InfisicalSecretMetricsMissing
          expr: absent(kube_customresource_infisical_secret_last_sync_timestamp_seconds)
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: No Infisical secret sync metrics are being reported
            description: >-
              kube_customresource_infisical_secret_last_sync_timestamp_seconds has had no
              series for over an hour, so InfisicalSecretStale cannot fire. Likely causes:
              kube-state-metrics lost its customResourceState config
              (system/monitoring-system/values.yaml), its ClusterRole lost the
              secrets.infisical.com RBAC grant, or every InfisicalStaticSecret was deleted.
