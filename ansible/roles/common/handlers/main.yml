---
- name: Restart sshd
  ansible.builtin.service:
    name: sshd
    state: restarted
  become: true

# Picks up the k3s drop-in without restarting k3s — the drop-in only has to be in
# effect by the next boot, and restarting k3s here would be gratuitously disruptive.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

# -r replaces the profile in place, so running containers pick up the new rules too.
- name: Reload containerd AppArmor profile
  ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/cri-containerd.apparmor.d
  changed_when: true
  become: true

# No reboot. Nothing here should decide to drop an etcd member.
- name: Update grub
  ansible.builtin.command: update-grub
  changed_when: true
  become: true
