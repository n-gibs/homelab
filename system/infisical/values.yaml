infisical:
  replicaCount: 2
  kubeSecretRef: infisical-secrets
  # No cpu limit: VPA preserves the request:limit ratio, so its 93m target turned this
  # 1 core into a 930m ceiling and throttled 18.7% of CFS periods (2026-08-12).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# useExistingPostgresSecret belongs here, not under infisical: — misplaced, Helm
# ignores it silently and no DB env vars render at all.
postgresql:
  enabled: false
  useExistingPostgresSecret:
    enabled: true
    existingConnectionStringSecret:
      name: infisical-database-app
      key: uri

# Cache and queues only. persistence off: the chart's local-path PVC would pin Redis to one node
# with no reschedule on node failure. The password is plaintext by necessity — the chart bakes
# REDIS_URL as an explicit `env` entry and `env` beats `envFrom`, so no secret can override it.
redis:
  enabled: true
  auth:
    password: "352aeabb5b3a5e1829f77bf9e200aa36f3d5b50ec22cab8c"
  master:
    persistence:
      enabled: false

# Repo is Gateway API only. The chart would otherwise deploy ingress-nginx.
ingress:
  enabled: false
  nginx:
    enabled: false
