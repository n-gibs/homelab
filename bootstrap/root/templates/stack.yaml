{{- range $stack := .Values.gitops.stacks }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $stack.name }}
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: {{ $.Values.gitops.repo }}
        revision: {{ $.Values.gitops.revision }}
        directories:
          - path: {{ $stack.name }}/*
  template:
    metadata:
      name: '{{`{{path.basename}}`}}'
    spec:
      destination:
        name: in-cluster
        namespace: '{{`{{path.basename}}`}}'
      project: default
      source:
        repoURL: {{ $.Values.gitops.repo }}
        path: '{{`{{path}}`}}'
        targetRevision: {{ $.Values.gitops.revision }}
      syncPolicy:
        automated:
          prune: true
          retry:
            limit: 10
            backoff:
              duration: 1m
              factor: 2
              maxDuration: 16m
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
{{- end }}
