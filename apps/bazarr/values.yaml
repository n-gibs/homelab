controllers:
  main:
    # local-path is ReadWriteOnce and node-pinned, and two Bazarrs must never open the
    # same SQLite database: the old pod has to be gone before the new one starts.
    strategy: Recreate
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
    containers:
      app:
        # renovate: datasource=docker depName=lscr.io/linuxserver/bazarr versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-ls(?<build>\d+)$
        image:
          repository: lscr.io/linuxserver/bazarr
          tag: v1.6.0-ls361
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Los_Angeles
        resources:
          requests:
            cpu: 50m
            memory: 320Mi
          limits:
            # Memory only. No cpu limit: VPA preserves the request:limit ratio, so a
            # shrinking request drags the limit down with it and throttles the container.
            memory: 640Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 6767

route:
  main:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Bazarr"
      gethomepage.dev/description: "Subtitles"
      gethomepage.dev/group: "Media"
      gethomepage.dev/icon: "bazarr.png"
      gethomepage.dev/href: "https://bazarr.nik-homelab.dev"
      gethomepage.dev/widget.type: "bazarr"
      gethomepage.dev/widget.url: "http://bazarr.bazarr.svc.cluster.local:6767"
      gethomepage.dev/widget.key: '{{ "{{HOMEPAGE_VAR_BAZARR_API_KEY}}" }}'
    enabled: true
    kind: HTTPRoute
    hostnames:
      - bazarr.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system
    # The UI holds a Socket.IO long-poll open until it has an event to push, so an idle
    # tab outlives Envoy's 15s default and every poll returns 504. backendRefs must be
    # spelled out here -- once rules are declared the chart no longer fills them in.
    rules:
      - backendRefs:
          - name: bazarr
            port: 6767
        matches:
          - path:
              type: PathPrefix
              value: /
        timeouts:
          request: 120s

persistence:
  config:
    # longhorn, not local-path -- bazarr.db is SQLite in WAL mode, which needs a real
    # block device. See config-pvc.yaml for the rationale and the restore path.
    existingClaim: bazarr-config
    globalMounts:
      - path: /config
  data:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage
    globalMounts:
      - path: /data
