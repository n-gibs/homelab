---
# k3s-ansible configuration
# https://github.com/k3s-io/k3s-ansible

k3s_version: "v1.36.4+k3s1"
token: "{{ vault_k3s_token }}"  # store in ansible-vault or pass via -e
api_endpoint: "192.168.30.129"

# These land in the k3s systemd unit via INSTALL_K3S_EXEC, not in config.yaml. Since
# k3s.orchestration 1.2.2 the role restarts k3s on every run, so a flag added here does
# get applied — but only one server at a time (`just provision` passes --forks=1); two at
# once loses etcd quorum.
common_server_flags: >-
  --disable traefik
  --disable servicelb
  --disable metrics-server
  --flannel-backend=none
  --disable-network-policy
  --write-kubeconfig-mode=644
  --resolv-conf /run/systemd/resolve/resolv.conf
  --etcd-expose-metrics=true

extra_server_args: "--node-taint node-role.kubernetes.io/control-plane=:NoSchedule {{ common_server_flags }}"

extra_agent_args: ""

letsencrypt_email: "{{ vault_letsencrypt_email }}"
