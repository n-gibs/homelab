kubeProxyReplacement: true
k8sServiceHost: "192.168.30.129"
k8sServicePort: "6443"

ipam:
  mode: kubernetes

loadBalancer:
  algorithm: maglev

l2announcements:
  enabled: true

l2podAnnouncements:
  enabled: true
  interfacePattern: "^(enp2s0|eno1)$"

operator:
  replicas: 1

socketLB:
  enabled: true
  hostNamespaceOnly: false

bpf:
  lbExternalClusterIP: true

hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
