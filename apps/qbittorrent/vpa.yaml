apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: qbittorrent
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: app
        # Hash checks and torrent adds spike past what VPA sees at idle.
        # The 1:2 request:limit ratio turns this 192Mi floor into a 384Mi limit.
        minAllowed:
          cpu: 50m
          memory: 192Mi
        maxAllowed:
          cpu: 4
          memory: 4Gi
      - containerName: gluetun
        minAllowed:
          cpu: 10m
          memory: 32Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
