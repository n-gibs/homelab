# Why this is separate from dashboard-cronjobs.yaml, and the thresholds it borrows:
# see system/monitoring-system/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-backups
  namespace: monitoring-system
  labels:
    grafana_dashboard: "1"
data:
  homelab-backups.json: |
    {
      "title": "Homelab — Backups",
      "uid": "homelab-backups",
      "tags": ["homelab", "backups"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "5m",
      "time": { "from": "now-7d", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Metrics",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "table",
          "title": "Hours since last CronJob run",
          "description": "Time since kube-state-metrics last saw this CronJob get scheduled, regardless of whether that run succeeded. Thresholds borrow CronJobNotSucceeding's 24h/26h window in prometheusrule-backups.yaml even though that alert keys on last_successful_time, not this panel's last_schedule_time — see the header comment for why CronJobOverdue's own 1h window would misfire here.",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 24 },
                  { "color": "red", "value": 26 }
                ]
              }
            },
            "overrides": []
          },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "(time() - kube_cronjob_status_last_schedule_time) / 3600",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "__name__": true, "cluster": true, "container": true, "endpoint": true, "instance": true, "job": true, "pod": true, "service": true },
                "renameByName": { "namespace": "Namespace", "cronjob": "CronJob", "Value": "Hours" }
              }
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Failed jobs (24h)",
          "description": "Count of Job failures over the trailing day, not the current-state count dashboard-cronjobs.yaml shows — this catches a job that failed and then succeeded on retry, which the point-in-time count misses.",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "sum(increase(kube_job_status_failed[24h]))"
            }
          ]
        },
        {
          "id": 3,
          "type": "table",
          "title": "Failing jobs by name",
          "description": "Currently-failed Jobs, by name. Empty is the healthy state — kube_job_status_failed reports 0 for every Job, so the `> 0` filter is what empties the table, not an absent series.",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "kube_job_status_failed > 0",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "__name__": true, "cluster": true, "condition": true, "container": true, "endpoint": true, "instance": true, "job": true, "pod": true, "service": true },
                "renameByName": { "namespace": "Namespace", "job_name": "Job", "Value": "Failed" }
              }
            }
          ]
        },
        {
          "id": 4,
          "type": "table",
          "title": "Longhorn backup state",
          "description": "Latest recurring-job backup per volume. 3 = Completed; anything else needs a look at the Longhorn UI.",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": {},
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "longhorn_backup_state",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "__name__": true, "cluster": true, "container": true, "endpoint": true, "instance": true, "job": true, "namespace": true, "pod": true, "service": true, "backup": true },
                "renameByName": { "volume": "Volume", "recurring_job": "Recurring Job", "Value": "State" }
              }
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Oldest DB backup (CNPG-backed apps)",
          "description": "Hours since the last successful run of the *-db-backup CronJob, oldest across the pg_dump-backed apps (immich, nextcloud, infisical, vaultwarden) — the actual backup path for their CNPG clusters, which have no native backup configured (see platform/cloudnative-pg/dashboard.yaml). Thresholds match CronJobNotSucceeding (26h) in prometheusrule-backups.yaml, the alert that keys on this same metric.",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "h",
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 24 },
                  { "color": "red", "value": 26 }
                ]
              }
            },
            "overrides": []
          },
          "options": { "colorMode": "background", "graphMode": "none", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max((time() - kube_cronjob_status_last_successful_time{cronjob=~\"(immich|nextcloud|infisical|vaultwarden)-db-backup\"}) / 3600)"
            }
          ]
        }
      ]
    }
