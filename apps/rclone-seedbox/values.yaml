# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/library/common/values.schema.json
controllers:
  main:
    type: cronjob
    pod:
      # Copy as uid/gid 1000, the PUID/PGID every *arr runs under. rclone defaults to root, and
      # with fs.protected_hardlinks=1 a user cannot hardlink a root-owned file it can't write —
      # so an arr silently falls back to a full copy of every seedbox import, defeating the
      # shared /data mount. Local qBittorrent hardlinks fine because it also runs as 1000.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      # worker-01 is the NFS server itself, so running anywhere else means every copied byte
      # crosses the LAN a second time as an NFS write. Pinning costs no availability: if
      # worker-01 is down there is no export to write to either.
      nodeSelector:
        homelab.io/media: "true"
    cronjob:
      schedule: "*/10 * * * *"
      # Forbid: a run that overruns 10 minutes must not get a second copier
      # competing for the same files.
      concurrencyPolicy: Forbid
      successfulJobsHistory: 1
      failedJobsHistory: 3
      backoffLimit: 2
    containers:
      app:
        image:
          repository: rclone/rclone
          tag: 1.75.0
        command:
          - rclone
        args:
          - copy
          - seedbox:/home/seedit4me/torrents/qbittorrent
          - /data/downloads/seedbox
          # One category per arr, because an arr claims every torrent in its client's category
          # and a shared one leaves queues stuck at importBlocked. Copying the parent means
          # naming what to take: `temp` is qBittorrent's scratch dir and `ratio` is manual
          # seeding. With any --include present rclone excludes all else, so this is the contract.
          - --include=/music/**
          - --include=/tv/**
          - --include=/movies/**
          # ProFTPD's shell-less SFTP forces disable_hashcheck, so rclone compares size+modtime —
          # and the destination gets stamped with the copy time, so nothing ever matches, every
          # run re-transfers everything, and each re-copy renames a new inode into place and
          # orphans an arr's hardlink. Size alone is sound: a completed torrent's size is fixed.
          - --size-only
          - --transfers=4
          - --checkers=4
          - --stats=1m
          - --stats-one-line
          - --log-level=INFO
        env:
          # rclone builds the "seedbox:" remote from these. The username and
          # password come from the sealed secret via envFrom below.
          RCLONE_CONFIG_SEEDBOX_TYPE: sftp
          RCLONE_CONFIG_SEEDBOX_HOST: nl137.seedit4.me
          RCLONE_CONFIG_SEEDBOX_PORT: "2097"
          # ProFTPD mod_sftp serves SFTP with no login shell. Without these two,
          # rclone probes for a remote shell and runs md5sum over it, failing
          # every transfer.
          RCLONE_CONFIG_SEEDBOX_SHELL_TYPE: none
          RCLONE_CONFIG_SEEDBOX_DISABLE_HASHCHECK: "true"
          # Without a pinned key rclone accepts any host key, and since this remote
          # authenticates with a password an on-path server would collect it. Key
          # scanned 2026-08-14, SHA256:xbLXJ4/A3uDY1Bt8GJdqVz+BTOKEtRG/+qAKEKwtNDg.
          # Re-scan and update here if seedit4.me ever rebuilds the box.
          RCLONE_CONFIG_SEEDBOX_HOST_KEYS: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKhXY6Oz2zccYqk6M55deQ7Z/T81DQNead+joQEwljiE"
        envFrom:
          - secretRef:
              name: rclone-seedbox-sftp
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            # Peak memory is concurrency x buffer, not file size: rclone allocates
            # --multi-thread-chunk-size per stream per transfer, and the defaults land exactly on
            # 1Gi. This keeps multi-thread copy on with headroom above that; anything raising
            # --transfers or --multi-thread-streams raises the peak, so re-check it first.
            memory: 2Gi
            # SFTP throughput is bounded by cipher work at ~58 MiB/s, and 16 concurrent
            # streams spread that across cores. worker-01 has 12.
            cpu: 4

persistence:
  data:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage
    globalMounts:
      - path: /data
