controller:
  type: deployment
  replicas: 1

# Alloy is the only log shipper; unscraped, a stopped pipeline is invisible. See
# prometheusrule.yaml.
serviceMonitor:
  enabled: true

alloy:
  # No cpu limit: VPA preserves the request:limit ratio, so its 23m target turned this
  # 1 core into a 230m ceiling that alloy ran flat against (2026-08-12).
  resources:
    requests:
      cpu: 100m
  configMap:
    content: |-
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        // Every bjw-s app-template pod ships as container="app", and Loki's
        // discover_service_name picks `container` — so without this every app collapses into
        // one service_name="app" stream. `app` outranks `container` in discover_service_name,
        // so setting it here is what splits them apart.
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
        // Fallbacks for pods that don't set the recommended label: the bare `app` label, then
        // the namespace. The `;(.+)` regex only matches when `app` is still empty, so each
        // rule is a no-op once an earlier one has filled it in.
        rule {
          source_labels = ["app", "__meta_kubernetes_pod_label_app"]
          regex         = ";(.+)"
          target_label  = "app"
          replacement   = "$1"
        }
        rule {
          source_labels = ["app", "__meta_kubernetes_pod_label_k8s_app"]
          regex         = ";(.+)"
          target_label  = "app"
          replacement   = "$1"
        }
        rule {
          source_labels = ["app", "__meta_kubernetes_namespace"]
          regex         = ";(.+)"
          target_label  = "app"
          replacement   = "$1"
        }

        // job defaults to the constant "loki.source.kubernetes.pods", which makes the
        // namespace/app convention every Loki dashboard queries on unusable.
        rule {
          source_labels = ["__meta_kubernetes_namespace", "app"]
          separator     = "/"
          target_label  = "job"
        }
      }

      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pods.receiver]
      }

      // Rejoins the *arr apps' stack traces, which arrive one Loki entry per physical line. Only
      // these apps' lines start with `[`; adding one whose lines do not would treat every line as
      // a continuation and glue its whole log into one entry. A tighter level-matching regex
      // merges unrelated failures instead, because the exception body sits under a version prefix.
      loki.process "pods" {
        forward_to = [loki.write.local.receiver]

        stage.match {
          selector = "{app=~\"sonarr|radarr|lidarr|prowlarr\"}"

          stage.multiline {
            firstline     = "^\\["
            max_lines     = 200
            max_wait_time = "3s"
          }
        }
      }

      loki.write "local" {
        endpoint {
          url = "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
        }
        external_labels = {
          cluster = "homelab",
        }
      }
