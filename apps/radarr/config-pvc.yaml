apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: radarr
spec:
  accessModes:
    - ReadWriteOnce
  # /config is SQLite -- longhorn per the CLAUDE.md storage rule.
  # Backup: Radarr's own System -> Backup, writing to /data/backups/radarr/scheduled/.
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
