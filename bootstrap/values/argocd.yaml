server:
  # Keep this inside the existing server block: a second top-level `server:` key silently
  # wins in YAML, which drops everything below it and deletes the ArgoCD HTTPRoute.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  service:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "ArgoCD"
      gethomepage.dev/description: "GitOps CD"
      gethomepage.dev/group: "Infrastructure"
      gethomepage.dev/icon: "argocd.png"
      gethomepage.dev/href: "https://argocd.nik-homelab.dev"
  ingress:
    enabled: false
  httproute:
    enabled: true
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system
    hostnames:
      - argocd.nik-homelab.dev

# The controller already listens on :8082; this only puts a Service in front of it, so an
# alert on ArgoCD sync state has something to fire on. The matching ServiceMonitor lives in
# system/monitoring-system/ because serviceMonitor.enabled needs the Prometheus Operator
# CRDs, which don't exist yet at bootstrap and would break a from-scratch `just bootstrap`.
controller:
  metrics:
    enabled: true
  # Requests for this and every component below, from measured peak usage. All seven shipped
  # requestless, which is why all seven crowded onto the smallest node: kube-scheduler scores
  # on requested resources, so a requestless container looks free everywhere and nothing
  # rebalances afterwards. Requests only — a limit here throttles or OOMKills a live sync.
  resources:
    requests:
      cpu: 200m
      memory: 768Mi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 192Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

dex:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 10m
      memory: 96Mi

notifications:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi

configs:
  params:
    server.insecure: true  # TLS terminated at gateway
    controller.diff.server.side: "true"  # cancel CRD-defaulted fields (Gateway API drift)
  cm:
    users.anonymous.enabled: "true"
    accounts.readonly: apiKey
    # infisical-standalone stamps `updatedAt` on its Deployment and pod template with no
    # way to disable it, so every refresh looks like drift and selfHeal rolls the pods.
    resource.customizations.ignoreDifferences.apps_Deployment: |
      jsonPointers:
        - /metadata/annotations/updatedAt
        - /spec/template/metadata/annotations/updatedAt
  rbac:
    policy.default: "role:admin"
    policy.csv: "g, readonly, role:readonly"
