---
# Scrapes the ArgoCD application-controller for argocd_app_info, which prometheusrule.yaml
# builds on. Lives here rather than bootstrap/values/argocd.yaml because a ServiceMonitor
# needs the Prometheus Operator CRDs, and helmfile bootstraps ArgoCD before
# monitoring-system exists. Port name is `http-metrics`, not `metrics`.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-application-controller
  namespace: monitoring-system
  labels:
    release: monitoring-system
spec:
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-metrics
      app.kubernetes.io/component: application-controller
  endpoints:
    - port: http-metrics
      interval: 30s
      relabelings:
        # Match the `cluster` label the other scrape configs in values.yaml set.
        - action: replace
          sourceLabels: []
          targetLabel: cluster
          replacement: homelab
