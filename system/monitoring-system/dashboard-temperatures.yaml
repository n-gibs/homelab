# Thresholds mirror prometheusrule-temperature.yaml; keep them in sync.
# See system/monitoring-system/README.md.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-temperatures
  namespace: monitoring-system
  labels:
    grafana_dashboard: "1"
data:
  homelab-temperatures.json: |
    {
      "title": "Homelab — Temperatures",
      "uid": "homelab-temperatures",
      "tags": ["homelab", "hardware"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": { "from": "now-24h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Temperature — hottest sensor per node",
          "description": "CPU and HDD come from the node:temperature_celsius:max recording rule; NVMe is the Composite sensor (temp1), not the per-die readings. A step that moves every series at once is ambient — the room, not the workload.",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "decimals": 0,
              "custom": { "lineWidth": 2, "fillOpacity": 0 }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "node:temperature_celsius:max",
              "legendFormat": "{{sensor_name}}"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "max by (nodename) (node_hwmon_temp_celsius{chip=~\"nvme.*\", sensor=\"temp1\"} * on(instance) group_left(nodename) node_uname_info)",
              "legendFormat": "{{nodename}} NVMe"
            }
          ]
        },
        {
          "id": 2,
          "type": "bargauge",
          "title": "Headroom to limit",
          "description": "Degrees left before each sensor hits its own rated ceiling. Raw temperature is meaningless across this hardware — the coretemp criticals are 82C on the G4 and 100C on the other two, and the NVMe drives sit at 81.85/81.85/87.85C. Amber and red are the same points at which NodeSensorTemperatureHigh and NodeSensorTemperatureCritical fire. The NAS's disks are watched by TrueNAS, not here.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "decimals": 0,
              "min": 0,
              "max": 60,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 5 },
                  { "color": "green", "value": 12 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }
          },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" },
              "expr": "min by (nodename) ((node_hwmon_temp_crit_celsius - node_hwmon_temp_celsius{chip!~\"thermal_thermal_zone.*\"}) * on(instance) group_left(nodename) node_uname_info)",
              "legendFormat": "{{nodename}} worst sensor",
              "instant": true
            }
          ]
        }
      ]
    }
