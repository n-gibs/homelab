# Every check in this cluster was inside-out: pod Ready, container not restarting, scrape
# succeeding. None of that notices an app that is Running and answering 500s, a DNS record
# that stopped resolving, or a certificate the gateway never reloaded. This probes the same
# URL a browser would, from inside the cluster, through the real gateway and the real cert.
#
fullnameOverride: blackbox-exporter

# This replaces the chart's default module map wholesale, so http_2xx is restated verbatim
# rather than extended — widening it would stop the sixteen targets that really do answer
# 200 from asserting it.
#
# http_2xx_auth exists for longhorn alone: its UI is behind basic auth and answers 401
# unauthenticated, measured through this exporter before it was added. Accepting 401/403
# still proves DNS, the gateway, the HTTPRoute and the served certificate all work; it just
# stops short of claiming the app authenticated us, which no unauthenticated probe can.
config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        follow_redirects: true
        preferred_ip_protocol: ip4
        valid_http_versions: [HTTP/1.1, HTTP/2.0]
    http_2xx_auth:
      prober: http
      timeout: 5s
      http:
        follow_redirects: true
        preferred_ip_protocol: ip4
        valid_http_versions: [HTTP/1.1, HTTP/2.0]
        valid_status_codes: [200, 401, 403]
    # For 192.168.30.194:2049. A handshake against nfsd is the whole check — every `nfs`
    # PVC in the cluster depends on it, and nothing else watches it directly.
    tcp_connect:
      prober: tcp
      timeout: 5s
      tcp:
        preferred_ip_protocol: ip4

replicas: 1

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 64Mi
