image:
  tag: v1.13.2

enableRbac: true
serviceAccount:
  create: true

extraClusterRoles:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
      - gateways
    verbs:
      - get
      - list
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "home.nik-homelab.dev"
  - name: HOMEPAGE_VAR_SONARR_API_KEY
    valueFrom:
      secretKeyRef:
        name: arr-api-keys
        key: SONARR_API_KEY
  - name: HOMEPAGE_VAR_RADARR_API_KEY
    valueFrom:
      secretKeyRef:
        name: arr-api-keys
        key: RADARR_API_KEY
  - name: HOMEPAGE_VAR_ARGOCD_API_KEY
    valueFrom:
      secretKeyRef:
        name: argocd-api-key
        key: ARGOCD_API_KEY

config:
  settings:
    title: Homelab
    theme: dark
    color: slate
    headerStyle: boxed
    target: _blank

  kubernetes:
    mode: cluster
    gateway: true

  widgets:
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
    - openmeteo:
        label: Home
        latitude: 32.80626271655686
        longitude: -117.2240939981718
        timezone: America/Los_Angeles
        units: imperial
        cache: 5
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: duckduckgo
        target: _blank

  services:
    - Media:
        - Sonarr:
            href: https://sonarr.nik-homelab.dev
            description: TV shows
            icon: sonarr.png
            widget:
              type: sonarr
              url: http://sonarr.sonarr.svc.cluster.local:8989
              key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
        - Radarr:
            href: https://radarr.nik-homelab.dev
            description: Movies
            icon: radarr.png
            widget:
              type: radarr
              url: http://radarr.radarr.svc.cluster.local:7878
              key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
        - Calendar:
            description: Upcoming releases
            icon: mdi-calendar
            widget:
              type: calendar
              view: agenda
              maxEvents: 10
              showTime: true
              timezone: America/Los_Angeles
              integrations:
                - type: sonarr
                  service_group: Media
                  service_name: Sonarr
                  color: teal
                - type: radarr
                  service_group: Media
                  service_name: Radarr
                  color: amber
    - Infrastructure:
        - ArgoCD:
            href: https://argocd.nik-homelab.dev
            description: GitOps CD
            icon: argo-cd.png
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local
              key: "{{HOMEPAGE_VAR_ARGOCD_API_KEY}}"
        - Grafana:
            href: https://grafana.nik-homelab.dev
            description: Metrics & dashboards
            icon: grafana.png
            widget:
              type: grafana
              version: 2
              url: http://monitoring-system-grafana.monitoring-system.svc.cluster.local
              username: admin
              password: changeme

  bookmarks: []
