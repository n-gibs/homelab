---
# Alerts on ArgoCD's own view of the cluster. The chart's default rules cover pods and
# nodes but say nothing about whether GitOps is still reconciling — all 27 apps once sat at
# sync_status="Unknown" for ~1h with nothing watching, after a DNS fault stopped the
# application-controller resolving argocd-repo-server.
#
# `Unknown` is the signal here, not OutOfSync: it means ArgoCD cannot compare desired vs
# live state at all, which is what happens when something underneath it breaks (DNS,
# repo-server, git creds).
#
# Requires the ServiceMonitor in argocd-servicemonitor.yaml — with no scrape target these
# expressions are empty and never fire.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd
  namespace: monitoring-system
  labels:
    release: monitoring-system
spec:
  groups:
    - name: argocd
      rules:
        - alert: ArgoCDAppSyncUnknown
          expr: argocd_app_info{sync_status="Unknown"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: ArgoCD cannot determine sync state for {{ $labels.name }}
            description: >-
              Application {{ $labels.name }} (project {{ $labels.project }}) has been in
              sync_status=Unknown for 15m. ArgoCD cannot compare desired against live
              state, so GitOps is not reconciling this app. Usually a ComparisonError —
              check the application-controller and repo-server logs for DNS or git
              failures rather than looking at the app itself.

        - alert: ArgoCDAppDegraded
          expr: argocd_app_info{health_status="Degraded"} == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: ArgoCD app {{ $labels.name }} is Degraded
            description: >-
              Application {{ $labels.name }} (project {{ $labels.project }}) has reported
              health_status=Degraded for 15m.

        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: ArgoCD app {{ $labels.name }} has been OutOfSync for 1h
            description: >-
              Application {{ $labels.name }} (project {{ $labels.project }}) has been
              OutOfSync for 1h. Auto-sync should have resolved this; a sync is likely
              failing or the app is missing auto-sync.
