---
k3s_cluster:
  children:
    server:
      hosts:
        worker-00:
          ansible_host: 192.168.30.129
        worker-02:
          ansible_host: 192.168.30.136  # G6: server + worker, no control-plane taint
        worker-01:
          ansible_host: 192.168.30.194  # G9: i5 12th gen, 16GB RAM, 12TB USB drive — server + worker, PreferNoSchedule media taint

  vars:
    ansible_user: homelab
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
    ansible_python_interpreter: /usr/bin/python3
