# Jellyfin has a backup engine but no scheduled task for it, so this job is only the trigger --
# Jellyfin does its own consistent database export and nothing here touches SQLite files, which
# is why this is a curl and not a copy of apps/cleanuparr/backup-cronjob.yaml. Longhorn's own
# backup is crash-consistent; this is the application-consistent one, landing on the NFS share.
apiVersion: batch/v1
kind: CronJob
metadata:
  # Name must keep the -db-backup suffix: BackupCronJobMissing in
  # system/monitoring-system/prometheusrule-backups.yaml counts CronJobs matching
  # ".+-db-backup" and alerts if one stops reporting.
  name: jellyfin-db-backup
  namespace: jellyfin
spec:
  schedule: "45 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            # Alloy derives the Loki `app` stream label from this; without it these
            # pods fall back to the namespace and land in Jellyfin's main stream.
            app.kubernetes.io/name: jellyfin-db-backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          containers:
            - name: trigger-backup
              image: python:3.13-alpine
              env:
                - name: JELLYFIN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: jellyfin-api-key
                      key: JELLYFIN_API_KEY
              command:
                - python
                - -c
                - |
                  import glob, json, os, sys, time, urllib.request

                  BASE = "http://jellyfin.jellyfin.svc.cluster.local:8096"
                  DEST = "/backups"
                  RETAIN_DAYS = 14

                  def call(path, data=None):
                      req = urllib.request.Request(
                          BASE + path,
                          data=json.dumps(data).encode() if data is not None else None,
                          headers={
                              "Authorization": f'MediaBrowser Token={os.environ["JELLYFIN_API_KEY"]}',
                              "Content-Type": "application/json",
                          },
                      )
                      # The archive is ~2MB and written synchronously, but a large
                      # library makes this slower than the default timeout allows.
                      with urllib.request.urlopen(req, timeout=900) as r:
                          body = r.read()
                      return json.loads(body) if body else None

                  before = {b["Path"] for b in call("/Backup")}
                  # Database only. Metadata/Trickplay/Subtitles are regenerable from
                  # the media files, and including them turns a 2MB archive into tens
                  # of GB on every run.
                  call("/Backup/Create", {
                      "Metadata": False,
                      "Trickplay": False,
                      "Subtitles": False,
                      "Database": True,
                  })
                  new = [b for b in call("/Backup") if b["Path"] not in before]
                  if not new:
                      sys.exit("/Backup/Create returned but no new archive appeared")
                  for b in new:
                      local = os.path.join(DEST, os.path.basename(b["Path"]))
                      print(f'wrote {b["Path"]} ({os.path.getsize(local)} bytes)')

                  cutoff = time.time() - RETAIN_DAYS * 86400
                  kept = 0
                  for old in sorted(glob.glob(os.path.join(DEST, "jellyfin-backup-*.zip"))):
                      if os.path.getmtime(old) < cutoff:
                          os.remove(old)
                          print(f"pruned {os.path.basename(old)}")
                      else:
                          kept += 1
                  print(f"retained: {kept} archives")
              volumeMounts:
                # The same directory Jellyfin writes into, so this job can size-check
                # what it just created and prune what has aged out.
                - name: backups
                  mountPath: /backups
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
          volumes:
            - name: backups
              nfs:
                server: 192.168.30.194
                path: /mnt/storage/backups/jellyfin
