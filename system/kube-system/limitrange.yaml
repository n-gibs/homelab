apiVersion: v1
kind: LimitRange
metadata:
  name: kube-system
  namespace: kube-system
spec:
  limits:
    - type: Container
      # A LimitRange, not chart values: local-path-provisioner is k3s-managed and reverts
      # edits, and Cilium's values live in the helmfile bootstrap.
      # No default limits: a cpu ceiling feeds the VPA ratio trap, and a memory ceiling on
      # the CNI turns a traffic spike into an OOMKill.
      defaultRequest:
        cpu: 10m
        memory: 128Mi
