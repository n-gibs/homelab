apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab
  namespace: envoy-gateway-system
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.nik-homelab.dev"
      tls:
        mode: Terminate
        certificateRefs:
          - name: wildcard-nik-homelab-dev
            namespace: envoy-gateway-system
      allowedRoutes:
        namespaces:
          from: All
