---
# A proxy that is Running and answering 503 to everything looks identical to a healthy one, and
# the chart's default pod-level rules cannot see the difference. Requires podmonitor.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: envoy-gateway
  namespace: envoy-gateway
  labels:
    release: monitoring-system
spec:
  groups:
    - name: envoy-gateway
      rules:
        # Per route, from upstream_rq: downstream_rq_xx never carries routed traffic (README).
        # Routes idle at a few requests a minute, so the floor counts errors rather than
        # traffic; one stray 503 alone is over 5%. EndpointDown covers a route that is fully
        # down; this catches the partial failure a passing probe misses.
        - alert: Gateway5xxRateHigh
          expr: |
            (
              sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq{envoy_cluster_name=~"httproute/.*", envoy_response_code=~"5.."}[15m]))
              /
              sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq{envoy_cluster_name=~"httproute/.*"}[15m]))
            ) > 0.05
            and
            sum by (envoy_cluster_name) (increase(envoy_cluster_upstream_rq{envoy_cluster_name=~"httproute/.*", envoy_response_code=~"5.."}[15m])) >= 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.envoy_cluster_name }} is serving over 5% 5xx"
            description: >-
              More than 5% of requests to {{ $labels.envoy_cluster_name }} have returned 5xx
              for 15m. A VPA Recreate that shrank a container's CPU limit has caused this
              before, so check recent pod resizes on that backend too.

        # One series per HTTPRoute backend, so the firing label points straight at the route.
        # This is the alert that distinguishes "the gateway is broken" from "one app behind it
        # is". It also fires for an app deliberately scaled to zero — nothing here is; if that
        # changes, exclude it by envoy_cluster_name rather than loosening the threshold.
        - alert: GatewayNoHealthyUpstream
          expr: envoy_cluster_membership_healthy == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: No healthy backend for {{ $labels.envoy_cluster_name }}
            description: >-
              Envoy has had no healthy endpoint for {{ $labels.envoy_cluster_name }} for 15m,
              so every request to that hostname returns 503 while the gateway itself stays
              healthy. Check the backing Service's endpoints and the pods behind it.

        - alert: EnvoyMetricsMissing
          expr: absent(envoy_server_live)
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: No Envoy data-plane metrics are being scraped
            description: >-
              envoy_server_live has had no series for 15m, so the error-rate and backend-health
              rules above are evaluating on an empty series set. Either the proxy pod is gone,
              which takes all ingress with it, or the PodMonitor stopped matching it. Check
              `kubectl -n envoy-gateway get pods -l app.kubernetes.io/component=proxy`.
