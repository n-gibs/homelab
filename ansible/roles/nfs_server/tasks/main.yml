---
- name: Install NFS server packages
  ansible.builtin.apt:
    name:
      - nfs-kernel-server
      - nfs-common
    state: present
  become: true

- name: Create NFS export directory
  ansible.builtin.file:
    path: "{{ nfs_export_path }}"
    state: directory
    mode: "0755"
    owner: nobody
    group: nogroup
  become: true

- name: Mount external drive by UUID
  ansible.posix.mount:
    path: "{{ nfs_export_path }}"
    src: "UUID={{ nfs_drive_uuid }}"
    fstype: xfs
    opts: "{{ nfs_mount_options }}"
    state: mounted
  become: true

- name: Create NFS subdirectories
  ansible.builtin.file:
    path: "{{ nfs_export_path }}/{{ item }}"
    state: directory
    mode: "0755"
    owner: nobody
    group: nogroup
  become: true
  loop: "{{ nfs_subdirs }}"

- name: Configure NFS export
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "{{ nfs_export_path }} {{ nfs_allowed_clients }}(rw,sync,no_subtree_check,no_root_squash)"
    create: true
    mode: "0644"
  become: true
  notify: Re-export NFS shares

# Nested inside the parent /mnt/storage export, so it must agree with that export's
# no_root_squash rather than contradict it: an NFSv4 client resolves through the parent and
# writes as root regardless. Disagreeing leaves the backupstore half-owned by nobody, where a
# root-owned drwx------ then blocks a squashed client's mkdir.
- name: Configure NFS export for Longhorn backups
  ansible.builtin.blockinfile:
    path: /etc/exports
    marker: "# {mark} ANSIBLE MANAGED BLOCK - longhorn-backups export"
    create: true
    mode: "0644"
    block: |
      {{ nfs_export_path }}/{{ nfs_backup_subdir }} {{ nfs_allowed_clients }}(rw,sync,no_subtree_check,no_root_squash)
      {{ nfs_export_path }}/{{ nfs_backup_subdir }} {{ nfs_pod_cidr }}(rw,sync,no_subtree_check,no_root_squash)
  become: true
  notify: Re-export NFS shares

# The export drive is USB. When it is absent or slow at boot, mnt-storage.mount fails and
# nfs-server dies with result "dependency" — which Restart= does not cover, so it stays down
# until started by hand. Start it from the device instead; nfs-server pulls the mount in
# itself via RequiresMountsFor.
- name: Start NFS server when the export drive appears
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-nfs-storage.rules
    mode: "0644"
    content: |
      # Managed by Ansible (roles/nfs_server). nfs-server cannot recover from a missing
      # export drive on its own — see the task comment for why Restart= does not cover it.
      ACTION=="add|change", SUBSYSTEM=="block", ENV{ID_FS_UUID}=="{{ nfs_drive_uuid }}", ENV{SYSTEMD_WANTS}+="nfs-server.service"
  become: true
  notify: Reload udev rules

- name: Enable and start NFS server
  ansible.builtin.service:
    name: nfs-kernel-server
    enabled: true
    state: started
  become: true

- name: Allow NFS through UFW
  community.general.ufw:
    rule: allow
    port: "2049"
    proto: "{{ item }}"
    src: "{{ nfs_allowed_clients }}"
  become: true
  loop:
    - tcp
    - udp

# worker-01 reaches the longhorn-backups export over the pod CIDR, not the LAN — see the
# export task above for why.
- name: Allow NFS through UFW from pod CIDR
  community.general.ufw:
    rule: allow
    port: "2049"
    proto: "{{ item }}"
    src: "{{ nfs_pod_cidr }}"
  become: true
  loop:
    - tcp
    - udp
