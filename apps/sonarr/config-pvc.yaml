apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config-local
  namespace: sonarr
  # No sync-wave annotation -- see the local-path note in CLAUDE.md. Superseded by
  # sonarr-config below; scheduled for deletion.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: sonarr
spec:
  accessModes:
    - ReadWriteOnce
  # /config is SQLite -- longhorn per the CLAUDE.md storage rule. Sonarr is the
  # busiest writer of the migrated volumes.
  # Backup: Sonarr's own System -> Backup, writing to /data/backups/sonarr/scheduled/.
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
