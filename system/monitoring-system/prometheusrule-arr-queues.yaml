---
# exportarr is the only view of the arrs' queues; the media dashboard reads nothing else.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: arr-queues
  namespace: monitoring-system
spec:
  groups:
    - name: arr-queues
      rules:
        - alert: ArrExporterDown
          # Matched on endpoint, not job: the operator resolves `job` from the Service's
          # jobLabel, which is inconsistent across this cluster's monitors, while
          # `endpoint` is always the port name.
          expr: 'up{namespace=~"lidarr|sonarr|radarr", endpoint="metrics"} == 0'
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "exportarr sidecar in {{ $labels.namespace }} is not being scraped"
            description: >-
              Prometheus cannot reach the exportarr sidecar, so the media dashboard's
              queue and library panels go blank for this namespace. Usually
              the API key in the arr-api-key secret no longer matches the one the app is
              using, since the sidecar authenticates with the same value the app reads.
              Check with `kubectl -n {{ $labels.namespace }} logs
              deploy/{{ $labels.namespace }} -c metrics`.
