apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: homepage
  namespace: homepage
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: homepage
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        # Well above the usual floor. VPA targets sustained usage, and this pod is idle between
        # page loads, so it recommends a request for a process that actually wants a whole core
        # in bursts. The request is still what cpu.shares and the scheduler go by, so a floor
        # admitting the burst keeps a page load from queueing behind a noisy neighbour.
        minAllowed:
          cpu: 200m
          memory: 64Mi
        maxAllowed:
          cpu: 500m
          memory: 512Mi
