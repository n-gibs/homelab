apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html
  namespace: nextcloud
  # No sync-wave annotation -- see the local-path note in CLAUDE.md. Superseded by
  # nextcloud-html-longhorn below; scheduled for deletion.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html-longhorn
  namespace: nextcloud
spec:
  accessModes:
    - ReadWriteOnce
  # The PHP app tree: thousands of small files, too hot for the nfs class, and
  # rebuilt from the container image if lost -- so no app-level backup is needed.
  # Nextcloud upgrades rewrite the tree, so it wants more headroom than a config
  # volume. nextcloud-cron mounts this claim too; both need updating together.
  storageClassName: longhorn
  resources:
    requests:
      storage: 3Gi
