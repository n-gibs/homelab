controllers:
  main:
    # Temporary: scaled to zero for the Longhorn config migration (Merge A). Restored to
    # unset once the config PVC swap (Merge B) lands. See
    # docs/superpowers/plans/2026-08-13-longhorn-deployment.md.
    replicas: 0
    # local-path is ReadWriteOnce and node-pinned, and two Bazarrs must never open the
    # same SQLite database: the old pod has to be gone before the new one starts.
    strategy: Recreate
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
    containers:
      app:
        # renovate: datasource=docker depName=lscr.io/linuxserver/bazarr versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-ls(?<build>\d+)$
        image:
          repository: lscr.io/linuxserver/bazarr
          tag: v1.6.0-ls357
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Los_Angeles
        resources:
          requests:
            cpu: 50m
            memory: 320Mi
          limits:
            # Memory only. No cpu limit: VPA preserves the request:limit ratio, so a
            # shrinking request drags the limit down with it and throttles the container.
            memory: 640Mi

service:
  main:
    controller: main
    ports:
      http:
        port: 6767

route:
  main:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Bazarr"
      gethomepage.dev/description: "Subtitles"
      gethomepage.dev/group: "Media"
      gethomepage.dev/icon: "bazarr.png"
      gethomepage.dev/href: "https://bazarr.nik-homelab.dev"
    enabled: true
    kind: HTTPRoute
    hostnames:
      - bazarr.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system

persistence:
  config:
    # local-path, not nfs -- bazarr.db is SQLite in WAL mode, which does not work
    # over NFS. See config-pvc.yaml for the rationale and the restore path.
    existingClaim: bazarr-config-local
    globalMounts:
      - path: /config
  data:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage
    globalMounts:
      - path: /data
