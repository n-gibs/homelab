---
# Needs --etcd-expose-metrics=true (ansible/group_vars/k3s_cluster.yml); without it the port
# binds 127.0.0.1 only and every target refuses the connection. A ScrapeConfig rather than the
# chart's kubeEtcd Service because etcd is not a pod here — see the kubeEtcd block in values.yaml.
# `job` is pinned so the chart's etcd dashboards and job-filtered rules keep matching.
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: kube-etcd
  namespace: monitoring-system
  labels:
    release: monitoring-system
spec:
  scheme: HTTP
  metricsPath: /metrics
  staticConfigs:
    - labels:
        job: kube-etcd
        cluster: homelab
      targets:
        - 192.168.30.129:2381
        - 192.168.30.136:2381
        - 192.168.30.194:2381
