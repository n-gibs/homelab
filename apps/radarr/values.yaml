controllers:
  main:
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/radarr
          tag: latest
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Los_Angeles
        envFrom:
          - secretRef:
              name: arr-api-key
        resources:
          requests:
            cpu: 100m
          # no cpu limit: VPA preserves the request:limit ratio, so a shrinking
          # request drags the limit down with it and throttles the container.

service:
  main:
    controller: main
    ports:
      http:
        port: 7878

route:
  main:
    enabled: true
    kind: HTTPRoute
    hostnames:
      - radarr.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: nfs
    size: 2Gi
    accessMode: ReadWriteMany
    globalMounts:
      - path: /config
  data:
    type: nfs
    server: 192.168.30.194
    path: /mnt/storage
    globalMounts:
      - path: /data
