controllers:
  main:
    containers:
      app:
        # renovate: datasource=docker depName=ghcr.io/flaresolverr/flaresolverr
        image:
          repository: ghcr.io/flaresolverr/flaresolverr
          tag: v3.5.0
        env:
          TZ: America/Los_Angeles
          LOG_LEVEL: info
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            # No cpu limit: VPA preserves the request:limit ratio, so a lowered request drags the
            # ceiling down and throttles the container -- and solving a Cloudflare challenge is
            # exactly the burst-for-a-second workload a ceiling ruins. Same reasoning as the
            # namespace LimitRange.
            memory: 1Gi

service:
  main:
    controller: main
    ports:
      http:
        port: 8191
