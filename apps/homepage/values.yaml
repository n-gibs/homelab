image:
  tag: v1.13.2

enableRbac: true
serviceAccount:
  create: true

extraClusterRoles:
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
      - gateways
    verbs:
      - get
      - list
  - apiGroups:
      - metrics.k8s.io
    resources:
      - nodes
      - pods
    verbs:
      - get
      - list

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "home.nik-homelab.dev"
  - name: HOMEPAGE_VAR_SONARR_API_KEY
    valueFrom:
      secretKeyRef:
        name: arr-api-keys
        key: SONARR_API_KEY
  - name: HOMEPAGE_VAR_RADARR_API_KEY
    valueFrom:
      secretKeyRef:
        name: arr-api-keys
        key: RADARR_API_KEY
  - name: HOMEPAGE_VAR_LIDARR_API_KEY
    valueFrom:
      secretKeyRef:
        name: arr-api-keys
        key: LIDARR_API_KEY
  - name: HOMEPAGE_VAR_ARGOCD_API_KEY
    valueFrom:
      secretKeyRef:
        name: argocd-api-key
        key: ARGOCD_API_KEY
  - name: HOMEPAGE_VAR_NAVIDROME_USER
    valueFrom:
      secretKeyRef:
        name: navidrome-homepage-token
        key: user
  - name: HOMEPAGE_VAR_NAVIDROME_TOKEN
    valueFrom:
      secretKeyRef:
        name: navidrome-homepage-token
        key: token
  - name: HOMEPAGE_VAR_NAVIDROME_SALT
    valueFrom:
      secretKeyRef:
        name: navidrome-homepage-token
        key: salt

config:
  settings:
    title: Homelab
    theme: dark
    color: slate
    headerStyle: boxedWidgets
    target: _blank
    statusStyle: dot
    useEqualHeights: true
    # unsplash.com/photos/blue-skies-filled-of-stars-W8KTS-mhFUE. Fetched by the
    # browser, not the pod, so no egress from the cluster. Remote URL means no
    # /app/public/images volume to mount. brightness dims the star field enough
    # for card text to stay legible; that rules out cardBlur, which the docs call
    # incompatible with background filters.
    background:
      image: https://images.unsplash.com/photo-1496715976403-7e36dc43f17b?auto=format&fit=crop&w=2560&q=80
      brightness: 50
    # Only place group icons and column counts can be set. Note Homepage takes group
    # display order from the key order here, but the chart renders this map through
    # toYaml, which sorts keys — so the order is alphabetical and not controllable
    # from values.yaml. Calendar gets its own single-column group so the agenda
    # renders full width instead of squeezed into a third of the Media grid; it
    # sorts last, which is a fine home for an agenda strip.
    layout:
      Upcoming:
        style: row
        columns: 1
        icon: mdi-calendar
      Media:
        style: row
        columns: 3
        icon: mdi-play-circle
      Infrastructure:
        style: row
        columns: 3
        icon: mdi-server

  kubernetes:
    mode: cluster
    gateway: true

  widgets:
    - datetime:
        text_size: xl
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
    - openmeteo:
        label: Home
        latitude: 32.80626271655686
        longitude: -117.2240939981718
        timezone: America/Los_Angeles
        units: imperial
        cache: 5
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: duckduckgo
        target: _blank

  services:
    - Media:
        - Sonarr:
            href: https://sonarr.nik-homelab.dev
            description: TV shows
            icon: sonarr.png
            widget:
              type: sonarr
              url: http://sonarr.sonarr.svc.cluster.local:8989
              key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
        - Radarr:
            href: https://radarr.nik-homelab.dev
            description: Movies
            icon: radarr.png
            widget:
              type: radarr
              url: http://radarr.radarr.svc.cluster.local:7878
              key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
        - Lidarr:
            href: https://lidarr.nik-homelab.dev
            description: Music
            icon: lidarr.png
            widget:
              type: lidarr
              url: http://lidarr.lidarr.svc.cluster.local:8686
              key: "{{HOMEPAGE_VAR_LIDARR_API_KEY}}"
        - Navidrome:
            href: https://navidrome.nik-homelab.dev
            description: Music streaming
            icon: navidrome.png
            widget:
              type: navidrome
              url: http://navidrome.navidrome.svc.cluster.local:4533
              user: "{{HOMEPAGE_VAR_NAVIDROME_USER}}"
              token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"
              salt: "{{HOMEPAGE_VAR_NAVIDROME_SALT}}"
    - Upcoming:
        - Calendar:
            description: Releases across the arr stack
            icon: mdi-calendar
            widget:
              type: calendar
              view: agenda
              maxEvents: 10
              showTime: true
              timezone: America/Los_Angeles
              integrations:
                - type: sonarr
                  service_group: Media
                  service_name: Sonarr
                  color: teal
                - type: radarr
                  service_group: Media
                  service_name: Radarr
                  color: amber
                - type: lidarr
                  service_group: Media
                  service_name: Lidarr
                  color: purple
    - Infrastructure:
        - ArgoCD:
            href: https://argocd.nik-homelab.dev
            description: GitOps CD
            icon: argo-cd.png
            widget:
              type: argocd
              url: http://argocd-server.argocd.svc.cluster.local
              key: "{{HOMEPAGE_VAR_ARGOCD_API_KEY}}"
        - Grafana:
            href: https://grafana.nik-homelab.dev
            description: Metrics & dashboards
            icon: grafana.png
            widget:
              type: grafana
              version: 2
              url: http://monitoring-system-grafana.monitoring-system.svc.cluster.local
              username: admin
              password: changeme
        # Reads the node:temperature_headroom_celsius:min recording rule from
        # system/monitoring-system/prometheusrule-temperature.yaml, which is also what keeps
        # this URL short enough to review. Headroom, not raw temperature: the hardware
        # disagrees about what hot means (coretemp crit is 82C on worker-00 and 100C on the
        # other two, the 12TB WD is rated 65C), so "57" tells you nothing while "8 C to
        # limit" tells you everything. Smaller is worse — sort() puts the sensor with the
        # least slack at the top, which is the one worth seeing first.
        #
        # dynamic-list takes each row's name from metric.sensor_name in the response rather
        # than from its position, so the display does not depend on series order.
        #
        # suffix/format are undocumented for dynamic-list but do work: the display passes the
        # whole mappings object to the same formatValue() the block display uses (verified in
        # v1.13.2 src/widgets/customapi/component.jsx). Nothing in customapi can colour a
        # row in any display mode, hence carrying the threshold in the wording instead.
        #
        # 60s refresh instead of the 10s default: the underlying SMART reading is only
        # refreshed every 2 minutes by a systemd timer on the node, so polling faster just
        # re-renders the same number.
        - Temperatures:
            href: https://grafana.nik-homelab.dev/d/homelab-temperatures
            description: Thermal headroom per sensor
            icon: mdi-thermometer
            widget:
              type: customapi
              url: http://prometheus-operated.monitoring-system.svc.cluster.local:9090/api/v1/query?query=sort(node:temperature_headroom_celsius:min)
              refreshInterval: 60000
              display: dynamic-list
              mappings:
                items: data.result
                name: metric.sensor_name
                label: value.1
                format: number
                suffix: "C to limit"

  bookmarks: []
