apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html
  namespace: nextcloud
  # NO sync-wave annotation — do not add one. local-path is WaitForFirstConsumer,
  # so this stays Pending (= unhealthy to ArgoCD) until its consumer is scheduled.
  # An earlier wave deadlocks the sync forever. The sibling volumes bind
  # immediately, which is why they can carry wave -1.
spec:
  accessModes:
    - ReadWriteOnce
  # local-path per the second exception in CLAUDE.md: ~15k small PHP files stat-ed
  # on every request, too hot for the sync-exported USB disk the nfs class uses,
  # and reconstructible from the image.
  # Recovery if the pinned node dies: delete this PVC, the tree rebuilds on next
  # start. Database and data directory are untouched.
  # 10Gi against a ~1.5GB tree is headroom for apps — local-path can't be expanded.
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
