apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: homelab
  namespace: envoy-gateway-system
  annotations:
    # Apply before the Gateway/GatewayClass so the Service is created with this
    # externalTrafficPolicy rather than defaulted and left un-reconciled — see gateway.yaml.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  # Client IP survives only while the forward stays node-local: Cilium SNATs to the
  # forwarding node's cilium_host address when it crosses a node, and that is still
  # RFC1918, so Jellyfin reads every remote session as LAN and its bitrate limit goes
  # inert. Silently — ingress keeps working.
  #
  # Local guarantees node-local backends. Cluster does not: it hashes across all of them,
  # so a second replica would cross nodes for some connections.
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        externalTrafficPolicy: Local
      envoyDeployment:
        replicas: 2
        # A DoNotSchedule spread with replicas == nodes leaves a surge pod nowhere to
        # land, so the 25% default would deadlock a rolling update.
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
        pod:
          nodeSelector:
            homelab.io/ingress: "true"
          # Load-bearing: under Local, a node announcing the VIP without a local proxy is
          # a blackhole. One replica per candidate node rules that out.
          topologySpreadConstraints:
            - topologyKey: kubernetes.io/hostname
              maxSkew: 1
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: homelab
                  gateway.envoyproxy.io/owning-gateway-namespace: envoy-gateway-system
