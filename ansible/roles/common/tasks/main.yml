---
- name: Add root subuid mapping for containerd user namespaces
  ansible.builtin.lineinfile:
    path: /etc/subuid
    line: "root:165536:65536"
    create: true
    mode: "0644"
  become: true

- name: Add root subgid mapping for containerd user namespaces
  ansible.builtin.lineinfile:
    path: /etc/subgid
    line: "root:165536:65536"
    create: true
    mode: "0644"
  become: true

- name: Create containerd override config directory
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d
    state: directory
    mode: "0755"
  become: true

# The native snapshotter worked around an early Ubuntu 26.04 / kernel 7.x problem.
# overlayfs is healthy on these nodes now, and native has no union mount — each
# layer is a full copy of its parent (measured 8m23s vs 26s to unpack one 798MB
# image, 80G vs 2.2G of store). `state: absent` rather than deleting the task, so
# already-provisioned nodes get cleaned up too. Takes effect on next k3s restart.
- name: Remove the containerd native-snapshotter override
  ansible.builtin.file:
    path: /var/lib/rancher/k3s/agent/etc/containerd/config-v3.toml.d/snapshotter.toml
    state: absent
  become: true

- name: Create k3s systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d
    state: directory
    mode: "0755"
  become: true

# Cilium's 05-cilium.conflist persists on disk once written, so at boot containerd
# finds it and kubelet marks the node Ready — while /var/run is a fresh tmpfs and
# cilium.sock does not exist yet. kubelet then starts every bound pod at once and
# cilium-cni fails the losers after a hard 30s wait for the socket ("CNI ADD failed
# ... failed to create cilium agent client"). CoreDNS is usually among them, so it
# presents as a per-node DNS outage on an apparently-Ready node.
#
# Dropping the stale conflist first makes the node honestly NotReady until the agent
# rewrites it. Note --register-with-taints=node.cilium.io/agent-not-ready does NOT
# work here: taints apply only at first Node registration, never on reboot.
#
# Guarded on the socket so `systemctl restart k3s` against a healthy agent is a
# no-op — KillMode=process keeps the running agent alive across a k3s restart, and
# it only writes the conflist during its own startup.
#
# That guard is what allows two cilium-agents on one node when a restart builds a
# *new* agent container while the old process survives; they then fight over the
# shared BPF LB maps, invisibly. Reaping the old agent here was tried (84ca78e) and
# reverted — it trades a rare silent failure for a routine one, and the containerd
# wedge remediation is exactly `systemctl restart k3s`. The invariant belongs in the
# new agent's startup. Detection is the CiliumAgentDuplicate alert (system/monitoring/).
- name: Gate k3s startup on a live Cilium CNI socket
  ansible.builtin.copy:
    dest: /etc/systemd/system/k3s.service.d/cilium-cni-gate.conf
    content: |
      [Service]
      ExecStartPre=/bin/sh -c '[ -S /var/run/cilium/cilium.sock ] || rm -f /etc/cni/net.d/05-cilium.conflist'
    mode: "0644"
  become: true
  notify: Reload systemd

# k3s.service already has Wants=/After=network-online.target, but that target is
# vacuous here: systemd-networkd-wait-online is skipped every boot on an unmet
# ConditionPathIsSymbolicLink pointing into /run/systemd/generator/, which does not
# exist on any of the three nodes. So nothing waits for DHCP and k3s starts with no
# default route ("no default routes found in /proc/net/route"). Restart=always
# self-heals a normal reboot, but during a cluster move — switch booting alongside
# the nodes — all three flap k3s and their etcd members until the route appears.
#
# Clearing the condition lets the unit run, which is all the target needs to mean
# something; k3s's existing After= does the rest. Costs 7ms when the network is
# already up, and k3s uses Wants= not Requires=, so a DHCP that never completes
# degrades to today's behaviour rather than blocking the boot.
- name: Create systemd-networkd-wait-online override directory
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-networkd-wait-online.service.d
    state: directory
    mode: "0755"
  become: true

- name: Make network-online.target actually wait for the network
  ansible.builtin.copy:
    dest: /etc/systemd/system/systemd-networkd-wait-online.service.d/always-run.conf
    content: |
      [Unit]
      ConditionPathIsSymbolicLink=
    mode: "0644"
  become: true
  notify: Reload systemd

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - htop
      - vim
      - unattended-upgrades
      - ufw
      - fail2ban
      - open-iscsi
      - nfs-common
      - chrony
      - lm-sensors
      - smartmontools
      - thermald
      # intel_gpu_top: shows Video/VideoEnhance engine occupancy, the only way to tell a
      # QSV transcode from a software one that merely opened the device.
      - intel-gpu-tools
    state: present
  become: true

# Longhorn's v1 data engine attaches every volume over iSCSI to localhost, so iscsid is a
# hard runtime dependency -- open-iscsi above ships the daemon disabled. A missing iscsid
# surfaces as a volume stuck in Attaching, which reads like a Longhorn bug.
# Talos equivalent: the iscsi-tools and util-linux-tools system extensions. See
# docs/talos-migration-audit.md before deleting this role.
- name: Load iscsi_tcp on boot
  ansible.builtin.copy:
    content: "iscsi_tcp\n"
    dest: /etc/modules-load.d/iscsi_tcp.conf
    mode: "0644"
  become: true

- name: Load iscsi_tcp now
  community.general.modprobe:
    name: iscsi_tcp
    state: present
  become: true

- name: Enable and start iscsid
  ansible.builtin.systemd_service:
    name: iscsid
    enabled: true
    state: started
  become: true

# chrony is the only time source on these nodes — no systemd-timesyncd. It ships
# without Restart=, so a stray SIGTERM (once collateral from a `kill` sweep) leaves
# it dead silently and the clock drifts unmonitored. Same for thermald and fail2ban,
# which the task below reconciles.
- name: Create chrony systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/chrony.service.d
    state: directory
    mode: "0755"
  become: true

# Restart=always, not on-failure: a SIGTERM is a clean exit (status=0/SUCCESS). An
# explicit `systemctl stop` still wins — systemd never restarts a deliberate stop.
# ponytail: chrony only. Clock skew on an etcd control-plane node is the one that hurts;
# add the same override for thermald/fail2ban if either ever goes missing again.
- name: Make chrony survive an unexpected termination
  ansible.builtin.copy:
    dest: /etc/systemd/system/chrony.service.d/override.conf
    content: |
      [Service]
      Restart=always
      RestartSec=5s
    mode: "0644"
  become: true

- name: Enable and start node services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop:
    - chrony
    - thermald
    - fail2ban
  become: true

# CPU and NVMe temperatures already reach Prometheus free via node-exporter's hwmon
# collector. USB-attached drives have no hwmon entry — `drivetemp` binds to SATA hosts,
# not usb-storage — so worker-01's 12TB WD (the only spinning disk, and the hottest
# sensor in the cluster at 61C against a 65C spec max) is invisible to it. Feeding it
# through the textfile collector beats adding a second exporter. Emits nothing on nodes
# with no SMART-readable non-NVMe disk.
#
# TODO(NAS): this exporter, its two systemd units, and the disk half of
# system/monitoring-system/prometheusrule-temperature.yaml all exist for that one USB
# drive. Once /mnt/storage moves to a NAS the nodes have only NVMe left, hwmon covers it,
# and this whole block goes silent — delete it rather than leaving it emitting nothing.
- name: Create node-exporter textfile collector directory
  ansible.builtin.file:
    path: /var/lib/node_exporter/textfile_collector
    state: directory
    mode: "0755"
  become: true

# Writes to a temp file and renames: a half-written .prom fails the whole scrape, not
# just this metric. Unreadable metrics are omitted per-disk rather than emitted as 0 —
# a missing series leaves the alert expression empty, a 0 reads as a stone-cold drive.
- name: Install SMART drive temperature textfile exporter
  ansible.builtin.copy:
    dest: /usr/local/bin/smart-temp-textfile
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      # Managed by Ansible (roles/common). Publishes SMART drive temperatures for
      # node-exporter's textfile collector.
      set -euo pipefail

      out=/var/lib/node_exporter/textfile_collector/smart_temp.prom
      tmp="$(mktemp "${out}.XXXXXX")"
      trap 'rm -f "$tmp"' EXIT

      {
        echo '# HELP node_smart_temperature_celsius Drive temperature reported by SMART.'
        echo '# TYPE node_smart_temperature_celsius gauge'
        echo '# HELP node_smart_temperature_limit_celsius Vendor specified maximum operating temperature.'
        echo '# TYPE node_smart_temperature_limit_celsius gauge'
        echo '# HELP node_smart_load_cycle_count Lifetime head load/unload cycles (SMART 193).'
        echo '# TYPE node_smart_load_cycle_count counter'
      } >"$tmp"

      # NVMe excluded: hwmon covers it, and two sources means two alerts for one disk.
      while read -r name type; do
        [[ "$type" == "disk" ]] || continue
        [[ "$name" == nvme* ]] && continue
        dev="/dev/$name"

        # Every smartctl call needs `|| true`: its exit status is a bitmask and sets bits
        # for non-failures. worker-01's WD returns non-zero every time (the enclosure
        # reports a bad SMART threshold checksum) while still giving a good temperature.
        attrs="$(smartctl -A "$dev" 2>/dev/null || true)"
        # Field 10 of attribute 194 is the raw value. Falls back to the SCSI-style line
        # for drives reporting no ATA attributes.
        temp="$(awk '$1 == 194 { print $10; exit }' <<<"$attrs")"
        if [[ -z "$temp" ]]; then
          temp="$(awk '/Current Drive Temperature/ { print $4; exit }' <<<"$attrs")"
        fi
        [[ "$temp" =~ ^[0-9]+$ ]] || continue

        model="$(smartctl -i "$dev" 2>/dev/null \
          | awk -F': +' '/^Device Model|^Product/ { print $2; exit }' || true)"
        printf 'node_smart_temperature_celsius{device="%s",model="%s"} %s\n' \
          "$name" "${model:-unknown}" "$temp" >>"$tmp"

        # Head parking is a wear budget, not a temperature, but only a rate over time
        # shows whether the APM fix below is holding — so it rides the same SMART read.
        cycles="$(awk '$1 == 193 { print $10; exit }' <<<"$attrs")"
        if [[ "$cycles" =~ ^[0-9]+$ ]]; then
          printf 'node_smart_load_cycle_count{device="%s"} %s\n' "$name" "$cycles" >>"$tmp"
        fi

        limit="$(smartctl -l devstat "$dev" 2>/dev/null \
          | awk '/Specified Maximum Operating Temperature/ { print $4; exit }' || true)"
        if [[ "$limit" =~ ^[0-9]+$ ]]; then
          printf 'node_smart_temperature_limit_celsius{device="%s"} %s\n' \
            "$name" "$limit" >>"$tmp"
        fi
      done < <(lsblk --nodeps --noheadings --output NAME,TYPE)

      chmod 0644 "$tmp"
      mv "$tmp" "$out"
      trap - EXIT
  become: true

- name: Install SMART temperature exporter systemd units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: smart-temp-textfile.service
      content: |
        [Unit]
        Description=Publish SMART drive temperatures for node-exporter
        After=local-fs.target

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/smart-temp-textfile
    # 2min, not 30s: polling SMART holds the drive awake, and the alerts need 15m
    # sustained to fire anyway.
    - name: smart-temp-textfile.timer
      content: |
        [Unit]
        Description=Publish SMART drive temperatures every 2 minutes

        [Timer]
        OnBootSec=2min
        OnUnitActiveSec=2min
        AccuracySec=10s

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  become: true
  notify: Reload systemd

- name: Enable and start SMART temperature exporter timer
  ansible.builtin.systemd_service:
    name: smart-temp-textfile.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true

# TODO(NAS): delete this task and the rule it installs once /mnt/storage moves off the
# USB drive. It is pinned to one serial and is dead weight the moment that drive leaves.
#
# worker-01's 12TB WD ships at APM 128, which parks the heads ~50 times an hour on a
# drive that is 0.02% busy — 9% of its 600k load-cycle rating in five weeks. APM 254
# stops it outright with no temperature penalty.
#
# On udev add/change, not a boot-time unit: APM is volatile and resets whenever the
# drive loses power, which on USB includes bus re-enumeration with the node still up.
#
# smartctl, not idle3ctl or hdparm: the WD120EDGZ is an Ultrastar He12 white-label with
# no idle3 timer, so unload is APM alone — and APM over SAT needs no vendor commands
# aimed at the disk backing every NFS PVC in the cluster.
#
# Matched on vendor+model, not serial: the shucked drive hangs off a generic SATA-USB
# bridge that fabricates an unstable identity (ID_SERIAL_SHORT and ID_WWN both
# 5000000000000001, by-id link re-randomised per enumeration). The SCSI INQUIRY strings
# are the only bridge-independent fields left, and worker-01 has exactly one USB disk.
- name: Stop the 12TB USB drive parking its heads every minute
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/60-wd-elements-apm.rules
    mode: "0644"
    content: |
      # Managed by Ansible (roles/common). See the task that installs this file.
      ACTION=="add|change", SUBSYSTEM=="block", KERNEL=="sd[a-z]", \
        ENV{ID_VENDOR}=="WDC_WD12", ENV{ID_MODEL}=="0EDGZ-11CNVA0", \
        RUN+="/usr/sbin/smartctl --set=apm,254 /dev/%k"
  become: true
  notify: Reload udev rules

# The default fs.inotify.max_user_instances=128 is charged per-UID and every
# containerd-shim holds 2 — worker-00 hit 129/128 at 37 pods, after which even PID 1
# could not allocate an inotify fd. Audited first (.claude/scripts/inotify-audit.py):
# not a leak, the only growth term is pod count, which kubelet caps at 110/node, so
# 1024 is real headroom at the measured ~2.2 fds/pod. max_user_watches is nowhere near
# its limit; raised for symmetry.
- name: Raise inotify limits for Kubernetes pod density
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-inotify.conf
    sysctl_set: true
    reload: true
    state: present
  loop:
    - { name: fs.inotify.max_user_instances, value: "1024" }
    - { name: fs.inotify.max_user_watches, value: "524288" }
  become: true

- name: Configure unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    content: |
      Unattended-Upgrade::Allowed-Origins {
        "${distro_id}:${distro_codename}-security";
      };
      Unattended-Upgrade::Automatic-Reboot "false";
    mode: "0644"
  become: true

- name: Enable unattended-upgrades
  ansible.builtin.service:
    name: unattended-upgrades
    enabled: true
    state: started
  become: true

- name: Harden SSH - disable password auth
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PasswordAuthentication"
    line: "PasswordAuthentication no"
    state: present
  become: true
  notify: Restart sshd

- name: Harden SSH - disable root login
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?PermitRootLogin"
    line: "PermitRootLogin no"
    state: present
  become: true
  notify: Restart sshd

- name: Configure UFW defaults
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - { direction: incoming, policy: deny }
    - { direction: outgoing, policy: allow }
  become: true

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  become: true

- name: Allow k3s API server
  community.general.ufw:
    rule: allow
    port: "6443"
    proto: tcp
  become: true

- name: Allow kubelet metrics
  community.general.ufw:
    rule: allow
    port: "10250"
    proto: tcp
  become: true

- name: Allow Cilium VXLAN
  community.general.ufw:
    rule: allow
    port: "8472"
    proto: udp
  become: true

- name: Allow node-exporter metrics from pod network
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: 10.42.0.0/16
  become: true

- name: Allow node-exporter metrics from cluster node subnet
  community.general.ufw:
    rule: allow
    port: "9100"
    proto: tcp
    src: 192.168.30.0/24
  become: true

- name: Enable UFW
  community.general.ufw:
    state: enabled
  become: true

# The Ubuntu installer allocates only part of the volume group to the root LV, and
# container images are the dominant consumer here — claim the whole VG.
- name: Check for unallocated space in the root volume group
  ansible.builtin.command: vgs --noheadings --nosuffix --units b -o vg_free ubuntu-vg
  register: root_vg_free
  changed_when: false
  failed_when: false
  check_mode: false        # read-only; must run under --check for the guard below to evaluate
  become: true

- name: Extend root logical volume to use all free volume group space
  community.general.lvol:
    vg: ubuntu-vg
    lv: ubuntu-lv
    size: +100%FREE
    resizefs: true
  become: true
  when:
    - root_vg_free.rc == 0
    - (root_vg_free.stdout | trim | int) > 1073741824
