---
- name: Install NFS server packages
  ansible.builtin.apt:
    name:
      - nfs-kernel-server
      - nfs-common
    state: present
  become: true

- name: Create NFS export directory
  ansible.builtin.file:
    path: "{{ nfs_export_path }}"
    state: directory
    mode: "0755"
    owner: nobody
    group: nogroup
  become: true

- name: Mount external drive by UUID
  ansible.posix.mount:
    path: "{{ nfs_export_path }}"
    src: "UUID={{ nfs_drive_uuid }}"
    fstype: xfs
    opts: "{{ nfs_mount_options }}"
    state: mounted
  become: true

- name: Create NFS subdirectories
  ansible.builtin.file:
    path: "{{ nfs_export_path }}/{{ item }}"
    state: directory
    mode: "0755"
    owner: nobody
    group: nogroup
  become: true
  loop: "{{ nfs_subdirs }}"

- name: Configure NFS export
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "{{ nfs_export_path }} {{ nfs_allowed_clients }}(rw,sync,no_subtree_check,no_root_squash)"
    create: true
    mode: "0644"
  become: true
  notify: Re-export NFS shares

# Nested inside the parent /mnt/storage export, so it must agree with that export's
# no_root_squash rather than contradict it: an NFSv4 client resolves through the parent and
# writes as root regardless. Disagreeing leaves the backupstore half-owned by nobody, where a
# root-owned drwx------ then blocks a squashed client's mkdir.
- name: Configure NFS export for Longhorn backups
  ansible.builtin.blockinfile:
    path: /etc/exports
    marker: "# {mark} ANSIBLE MANAGED BLOCK - longhorn-backups export"
    create: true
    mode: "0644"
    block: |
      {{ nfs_export_path }}/{{ nfs_backup_subdir }} {{ nfs_allowed_clients }}(rw,sync,no_subtree_check,no_root_squash)
      {{ nfs_export_path }}/{{ nfs_backup_subdir }} {{ nfs_pod_cidr }}(rw,sync,no_subtree_check,no_root_squash)
  become: true
  notify: Re-export NFS shares

- name: Enable and start NFS server
  ansible.builtin.service:
    name: nfs-kernel-server
    enabled: true
    state: started
  become: true

- name: Allow NFS through UFW
  community.general.ufw:
    rule: allow
    port: "2049"
    proto: "{{ item }}"
    src: "{{ nfs_allowed_clients }}"
  become: true
  loop:
    - tcp
    - udp

# worker-01 reaches the longhorn-backups export over the pod CIDR, not the LAN — see the
# export task above for why.
- name: Allow NFS through UFW from pod CIDR
  community.general.ufw:
    rule: allow
    port: "2049"
    proto: "{{ item }}"
    src: "{{ nfs_pod_cidr }}"
  become: true
  loop:
    - tcp
    - udp
