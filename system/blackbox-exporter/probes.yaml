---
# Public hostnames, not Services: they resolve to the gateway, so the probe traverses DNS,
# the HTTPRoute and the served certificate. A Service-level probe would skip all of that and
# only retest what pod readiness covers. Split by module because longhorn needs one that
# tolerates 401.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: apps
  namespace: blackbox-exporter
  labels:
    release: monitoring-system
spec:
  interval: 60s
  module: http_2xx
  prober:
    url: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://vault.nik-homelab.dev
        - https://grafana.nik-homelab.dev
        - https://jellyfin.nik-homelab.dev
        - https://nextcloud.nik-homelab.dev
        - https://immich.nik-homelab.dev
        # A hostname dropped from an HTTPRoute does not fail DNS: the wildcard record still
        # resolves it to the gateway, which 404s. So it surfaces here as EndpointDown rather
        # than as a name that stopped resolving.
        - https://argocd.nik-homelab.dev
        - https://bazarr.nik-homelab.dev
        - https://cleanuparr.nik-homelab.dev
        - https://home.nik-homelab.dev
        - https://infisical.nik-homelab.dev
        - https://lidarr.nik-homelab.dev
        - https://navidrome.nik-homelab.dev
        - https://prowlarr.nik-homelab.dev
        - https://qbittorrent.nik-homelab.dev
        - https://radarr.nik-homelab.dev
        - https://sonarr.nik-homelab.dev
---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: apps-auth
  namespace: blackbox-exporter
  labels:
    release: monitoring-system
spec:
  interval: 60s
  module: http_2xx_auth
  prober:
    url: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        # 401 unauthenticated, measured. On http_2xx this would be probe_success 0 and a
        # standing critical EndpointDown; see values.yaml for what the auth module still proves.
        - https://longhorn.nik-homelab.dev
---
# An address, not a DNS name: the failure under test is the host being gone, so resolving a
# name for it would add a dependency the check does not need.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: nfs-server
  namespace: blackbox-exporter
  labels:
    release: monitoring-system
spec:
  interval: 60s
  module: tcp_connect
  prober:
    url: blackbox-exporter.blackbox-exporter.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - 192.168.30.194:2049
