# Here for one label, intel.feature.node.kubernetes.io/gpu, which system/intel-gpu-plugin selects
# on. Chart defaults set memory limits but no requests, so these are sized against comparable
# controllers here; master memory tracks node count. No cpu limits, per the LimitRange rule.
master:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 256Mi

# DaemonSet: every request here lands on all three nodes.
worker:
  resources:
    requests:
      cpu: 5m
      memory: 48Mi
    limits:
      memory: 192Mi

gc:
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 128Mi
