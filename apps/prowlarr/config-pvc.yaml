apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config-local
  namespace: prowlarr
  # No sync-wave annotation -- see the local-path note in CLAUDE.md. Superseded by
  # prowlarr-config below; scheduled for deletion.
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: prowlarr
spec:
  accessModes:
    - ReadWriteOnce
  # /config is SQLite -- longhorn per the CLAUDE.md storage rule.
  # Backup: Prowlarr's own System -> Backup. Prowlarr has no /data mount, so it
  # reaches /data/backups/prowlarr/scheduled/ through the backups-only NFS mount in
  # values.yaml -- don't remove that mount. A bad restore breaks the other arrs too.
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
