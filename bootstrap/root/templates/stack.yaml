{{- range $stack := .Values.gitops.stacks }}
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: {{ $stack.name }}
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: {{ $.Values.gitops.repo }}
        revision: {{ $.Values.gitops.revision }}
        files:
          - path: "{{ $stack.name }}/*/app.yaml"
  template:
    metadata:
      name: '{{`{{path.basename}}`}}'
    spec:
      destination:
        name: in-cluster
        namespace: '{{`{{path.basename}}`}}'
      project: default
      sources:
        - repoURL: '{{`{{chartRepo}}`}}'
          chart: '{{`{{chartName}}`}}'
          targetRevision: '{{`{{chartVersion}}`}}'
          helm:
            valueFiles:
              - $values/{{`{{path}}`}}/values.yaml
        - repoURL: {{ $.Values.gitops.repo }}
          targetRevision: {{ $.Values.gitops.revision }}
          ref: values
        - repoURL: {{ $.Values.gitops.repo }}
          targetRevision: {{ $.Values.gitops.revision }}
          path: '{{`{{path}}`}}'
          directory:
            exclude: '{app.yaml,values.yaml}'
      syncPolicy:
        automated:
          prune: true
          retry:
            limit: 10
            backoff:
              duration: 1m
              factor: 2
              maxDuration: 16m
        syncOptions:
          - CreateNamespace=true
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
{{- end }}
