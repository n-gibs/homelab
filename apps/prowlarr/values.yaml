controllers:
  main:
    pod:
      nodeSelector:
        homelab.io/media: "true"
      tolerations:
        - key: homelab.io/media
          operator: Equal
          value: "true"
          effect: PreferNoSchedule
    containers:
      app:
        image:
          repository: lscr.io/linuxserver/prowlarr
          tag: latest
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: America/Los_Angeles
        envFrom:
          - secretRef:
              name: arr-api-key

service:
  main:
    controller: main
    ports:
      http:
        port: 9696

route:
  main:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Prowlarr"
      gethomepage.dev/description: "Indexer manager"
      gethomepage.dev/group: "Media"
      gethomepage.dev/icon: "prowlarr.png"
      gethomepage.dev/href: "https://prowlarr.nik-homelab.dev"
    enabled: true
    kind: HTTPRoute
    hostnames:
      - prowlarr.nik-homelab.dev
    parentRefs:
      - name: homelab
        namespace: envoy-gateway-system
    # An interactive search fans out to every indexer and can run ~60s, well past
    # Envoy's 15s default request timeout; the resulting plain-text 504 reaches the
    # UI as "Unable to load results". backendRefs must be spelled out here -- once
    # rules are declared the chart no longer fills them in.
    rules:
      - backendRefs:
          - name: prowlarr
            port: 9696
        matches:
          - path:
              type: PathPrefix
              value: /
        timeouts:
          request: 120s

persistence:
  config:
    type: persistentVolumeClaim
    storageClass: nfs
    size: 1Gi
    accessMode: ReadWriteMany
    globalMounts:
      - path: /config
