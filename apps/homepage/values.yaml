enableRbac: true
serviceAccount:
  create: true

env:
  - name: HOMEPAGE_ALLOWED_HOSTS
    value: "home.nik-homelab.dev"

config:
  settings:
    title: Homelab
    theme: dark
    color: slate
    headerStyle: boxed
    target: _blank

  kubernetes:
    mode: cluster

  widgets:
    - resources:
        backend: kubernetes
        expanded: true
        cpu: true
        memory: true
    - search:
        provider: duckduckgo
        target: _blank
    - greeting:
        text_size: xl
        text: Homelab

  services: []

  bookmarks: []
