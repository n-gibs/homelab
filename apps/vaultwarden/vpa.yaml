apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vaultwarden
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
      - containerName: "*"
        minAllowed:
          cpu: 10m
          memory: 32Mi
        maxAllowed:
          cpu: 1
          memory: 512Mi
