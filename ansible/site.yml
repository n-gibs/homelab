---
- name: Apply common baseline to all nodes
  hosts: k3s_cluster
  roles:
    - common

- name: Deploy k3s cluster
  ansible.builtin.import_playbook: k3s_io.k3s_ansible.site

- name: Configure NFS server on worker-01
  hosts: worker-01
  roles:
    - nfs_server

- name: Configure NFS client on worker-02
  hosts: worker-02
  roles:
    - nfs_client
