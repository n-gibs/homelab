apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-db-backup
  namespace: immich
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: immich-db-backup
  namespace: immich
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            # Alloy derives the Loki `app` stream label from this; without it these pods
            # fall back to the namespace and land in immich's main log stream.
            app.kubernetes.io/name: immich-db-backup
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-dump
              image: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
              env:
                - name: PGHOST
                  value: immich-database-rw
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: immich-database-app
                      key: username
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: immich-database-app
                      key: password
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  out="/backup/immich-$(date +%Y%m%d-%H%M%S).dump"
                  pg_dump -d app -Fc -f "$out"
                  echo "wrote $out ($(stat -c %s "$out") bytes)"
                  find /backup -name 'immich-*.dump' -mtime +7 -delete
                  echo "retained: $(ls -1 /backup/immich-*.dump | wc -l) dumps"
              volumeMounts:
                - name: backup
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: immich-db-backup
