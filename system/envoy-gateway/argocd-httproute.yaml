# Lives here, not in the argo-cd chart, because bootstrap installs ArgoCD before any
# Gateway API CRDs exist; this directory syncs in the same app that brings them.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: homelab
      namespace: envoy-gateway-system
  hostnames:
    - argocd.nik-homelab.dev
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
